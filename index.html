Privacy · WEP）","text":"SEC-WEP-001 有线等效保密 Wired Equivalent Privacy WEP 原始802.11加密机制，已被破解；现行认证禁止使用。"},{"type":"term","id":"SEC-TKIP-001","title":"临时密钥完整性协议（Temporal Key Integrity Protocol · TKIP）","text":"SEC-TKIP-001 临时密钥完整性协议 Temporal Key Integrity Protocol TKIP WPA的过渡加密协议；已不允许在新认证中使用(802.11-2012起弃用)。"},{"type":"term","id":"SEC-CCMP-001","title":"计数器模式密码块链消息认证码协议（Counter Mode with Cipher Block Chaining Message Authentication Code Protocol · CCMP）","text":"SEC-CCMP-001 计数器模式密码块链消息认证码协议 Counter Mode with Cipher Block Chaining Message Authentication Code Protocol CCMP 基于AES的RSN默认加密/完整性协议(WPA2强制)。"},{"type":"term","id":"SEC-GCMP-001","title":"伽罗瓦/计数器模式协议（Galois/Counter Mode Protocol · GCMP）","text":"SEC-GCMP-001 伽罗瓦/计数器模式协议 Galois/Counter Mode Protocol GCMP 基于AES-GCM的加密/完整性协议，性能开销低于CCMP；VHT/HE/DL OFDMA等高吞吐场景要求(适用条件待核)。"},{"type":"term","id":"SEC-WPA2-001","title":"WPA2（Wi-Fi Protected Access 2 · WPA2）","text":"SEC-WPA2-001 WPA2 Wi-Fi Protected Access 2 WPA2 WFA认证项目：实现RSN(RSN+CCMP)；Personal=PSK，Enterprise=802.1X/EAP。"},{"type":"term","id":"SEC-WPA3-001","title":"WPA3（Wi-Fi Protected Access 3 · WPA3）","text":"SEC-WPA3-001 WPA3 Wi-Fi Protected Access 3 WPA3 WFA认证项目(2018-06-25)：Personal以SAE替代PSK认证，Enterprise提供192位模式。"},{"type":"term","id":"SEC-OWE-001","title":"机会性无线加密（Opportunistic Wireless Encryption · OWE）","text":"SEC-OWE-001 机会性无线加密 Opportunistic Wireless Encryption OWE 开放网络的无认证加密机制(IEEE 802.11-2016/AKD)；WFA对应认证名Enhanced Open。"},{"type":"term","id":"PERF-MCS-001","title":"调制与编码方案（Modulation and Coding Scheme · MCS）","text":"PERF-MCS-001 调制与编码方案 Modulation and Coding Scheme MCS 将调制方式、码率、流数等组合编为索引的速率方案：HT=MCS0–76、VHT=0–9、HE=0–11、EHT扩展4096-QAM；结合带宽/流数查得PHY速率。"},{"type":"term","id":"PERF-OFDMA-001","title":"正交频分多址（Orthogonal Frequency Division Multiple Access · OFDMA）","text":"PERF-OFDMA-001 正交频分多址 Orthogonal Frequency Division Multiple Access OFDMA 802.11ax引入：把OFDM资源划分为RU，由AP经触发帧在同一时间分配给多个STA并行收发。"},{"type":"term","id":"PERF-TP-001","title":"吞吐量／有效吞吐量（throughput / effective throughput）","text":"PERF-TP-001 吞吐量／有效吞吐量 throughput / effective throughput  吞吐量=实际净荷传输速率；有效吞吐量=扣除重传与开销后应用层所得。"},{"type":"term","id":"PERF-JIT-001","title":"时延／抖动／丢包率（latency / jitter / packet loss）","text":"PERF-JIT-001 时延／抖动／丢包率 latency / jitter / packet loss  传输质量指标组：单程/往返时延、时延变化、丢帧比例。"},{"type":"term","id":"EVOL-HT-001","title":"高吞吐(Wi-Fi 4)（High Throughput (802.11n) · HT）","text":"EVOL-HT-001 高吞吐(Wi-Fi 4) High Throughput (802.11n) HT 802.11n-2009定义的PHY世代：MIMO/40MHz/MCS/A-MPDU等；WFA代际名Wi-Fi 4。"},{"type":"term","id":"EVOL-VHT-001","title":"甚高吞吐(Wi-Fi 5)（Very High Throughput (802.11ac) · VHT）","text":"EVOL-VHT-001 甚高吞吐(Wi-Fi 5) Very High Throughput (802.11ac) VHT 802.11ac-2013定义：5 GHz、更宽信道、256-QAM、DL MU-MIMO；WFA代际名Wi-Fi 5。"},{"type":"term","id":"EVOL-HE-001","title":"高效(Wi-Fi 6/6E)（High Efficiency (802.11ax) · HE）","text":"EVOL-HE-001 高效(Wi-Fi 6/6E) High Efficiency (802.11ax) HE 802.11ax-2021定义：OFDMA、UL MU-MIMO、BSS着色、TWT、更长OFDM符号等；2.4/5/6 GHz；WFA代际名Wi-Fi 6(6E=6GHz扩展)。"},{"type":"term","id":"EVOL-EHT-001","title":"极高吞吐(Wi-Fi 7)（Extremely High Throughput (802.11be) · EHT）","text":"EVOL-EHT-001 极高吞吐(Wi-Fi 7) Extremely High Throughput (802.11be) EHT 802.11be-2024定义：320 MHz、4096-QAM、MLO等；WFA认证Wi-Fi CERTIFIED 7(2024-01-08)。"},{"type":"term","id":"EVOL-MLO-001","title":"多链路操作（Multi-Link Operation · MLO）","text":"EVOL-MLO-001 多链路操作 Multi-Link Operation MLO 802.11be引入：多链路设备(MLD)经多条射频链路与对端同时建立并使用连接，聚合吞吐、降低时延、提高可靠性。"},{"type":"term","id":"EVOL-QAM4K-001","title":"4096-QAM（4096-QAM (WFA: 4K QAM)）","text":"EVOL-QAM4K-001 4096-QAM 4096-QAM (WFA: 4K QAM)  EHT新增调制阶数，每符号12比特；较1024-QAM约提升20%速率(WFA表述)。"},{"type":"term","id":"EVOL-320M-001","title":"320 MHz信道（320 MHz channel）","text":"EVOL-320M-001 320 MHz信道 320 MHz channel  EHT引入的最大信道宽度；主要在6 GHz频段可用(频谱约束)。"},{"type":"term","id":"NET-DHCP-001","title":"动态主机配置协议（Dynamic Host Configuration Protocol · DHCP）","text":"NET-DHCP-001 动态主机配置协议 Dynamic Host Configuration Protocol DHCP 为主机分配IP地址等参数的应用层协议；与802.11关联成功无关，是接入后的独立过程。"},{"type":"term","id":"NET-ARP-001","title":"地址解析协议（Address Resolution Protocol · ARP）","text":"NET-ARP-001 地址解析协议 Address Resolution Protocol ARP 把IPv4地址解析为链路层MAC地址的协议。"},{"type":"term","id":"NET-DNS-001","title":"域名系统（Domain Name System · DNS）","text":"NET-DNS-001 域名系统 Domain Name System DNS 域名到IP地址的解析系统。"},{"type":"term","id":"STD-ITUR-001","title":"国际电信联盟无线电通信部门（ITU Radiocommunication Sector · ITU-R）","text":"STD-ITUR-001 国际电信联盟无线电通信部门 ITU Radiocommunication Sector ITU-R 以国际条约形式把世界划分为区域并划分频段/频道及使用条件的机构；各国监管机构在其框架内管理本国频谱。"},{"type":"term","id":"STD-FCC-001","title":"联邦通信委员会（美国）（Federal Communications Commission · FCC）","text":"STD-FCC-001 联邦通信委员会（美国） Federal Communications Commission FCC 依据《1934 年通信法》监管美国境内及进出美国的无线电通信；规则载于 CFR Title 47 Part 15。"},{"type":"term","id":"STD-IEEE-001","title":"电气与电子工程师学会（Institute of Electrical and Electronics Engineers · IEEE）","text":"STD-IEEE-001 电气与电子工程师学会 Institute of Electrical and Electronics Engineers IEEE 制定 802.11 WLAN 技术标准（MAC/PHY）的标准组织；以任务组发布修正案并周期性发布整合版。"},{"type":"term","id":"STD-WFA-001","title":"Wi-Fi 联盟（Wi-Fi Alliance · WFA）","text":"STD-WFA-001 Wi-Fi 联盟 Wi-Fi Alliance WFA 拥有 Wi-Fi 商标、运行 Wi-Fi CERTIFIED 互操作性认证的行业联盟；与 IEEE 相互独立。"},{"type":"term","id":"STD-IETF-001","title":"互联网工程任务组（Internet Engineering Task Force · IETF）","text":"STD-IETF-001 互联网工程任务组 Internet Engineering Task Force IETF 以 RFC 文档定义互联网协议的标准组织；RFC 按序编号且永不复用。"},{"type":"term","id":"STD-ISO-001","title":"国际标准化组织（International Organization for Standardization · ISO）","text":"STD-ISO-001 国际标准化组织 International Organization for Standardization ISO 与 IEC 等共同维护更广标准体系；802 系列被纳入 ISO/IEC 8802 系列。"},{"type":"term","id":"STD-AMEND-001","title":"修正案（amendment）","text":"STD-AMEND-001 修正案 amendment  针对特定增强发布的 802.11 标准文件（如 802.11ax-2021），发布后并入下一轮整合版。"},{"type":"term","id":"STD-ROLLUP-001","title":"整合版（rollup revision）","text":"STD-ROLLUP-001 整合版 rollup revision  周期性把已发布修正案合并重写的完整 802.11 标准（-2007/-2012/-2016/-2020/-2024）；现行版为 802.11-2024。"},{"type":"term","id":"RF-CARRIER-001","title":"载波信号（carrier signal）","text":"RF-CARRIER-001 载波信号 carrier signal  承载数据被发射的射频交流信号；发射机决定其频率与初始功率。"},{"type":"term","id":"RF-KEYING-001","title":"键控法（keying methods (ASK/FSK/PSK)）","text":"RF-KEYING-001 键控法 keying methods (ASK/FSK/PSK)  改变载波的振幅/频率/相位以承载数据的调制方式：幅移/频移/相移键控；QAM 为幅相联合。"},{"type":"term","id":"RF-CCI-001","title":"同频干扰（co-channel interference · CCI）","text":"RF-CCI-001 同频干扰 co-channel interference CCI 同信道上其他 802.11 发射机造成的介质争用与能量叠加。"},{"type":"term","id":"RF-ACI-001","title":"邻频干扰（adjacent channel interference · ACI）","text":"RF-ACI-001 邻频干扰 adjacent channel interference ACI 相邻信道能量泄漏造成的有效噪声抬升，通常比同频干扰更伤性能。"},{"type":"term","id":"RF-IR-001","title":"有意辐射体（Intentional Radiator · IR）","text":"RF-IR-001 有意辐射体 Intentional Radiator IR 发射机+馈线（不含天线）组成的整体；监管功率限值针对 IR 与 EIRP 分别度量。"},{"type":"term","id":"RF-VSWR-001","title":"电压驻波比（Voltage Standing Wave Ratio · VSWR）","text":"RF-VSWR-001 电压驻波比 Voltage Standing Wave Ratio VSWR 衡量馈线-天线阻抗匹配程度；失配使能量反射回发射机。1.5:1 以内属良好（工程参考值）。"},{"type":"term","id":"RF-LOS-001","title":"视距（Line of Sight · LOS）","text":"RF-LOS-001 视距 Line of Sight LOS 视觉 LOS 与射频 LOS 不同；桥接链路还要求第一菲涅尔区基本无遮挡（遮挡≤40%为工程参考值）。"},{"type":"term","id":"ANT-OMNI-001","title":"全向天线（omnidirectional antenna）","text":"ANT-OMNI-001 全向天线 omnidirectional antenna  水平面 360° 近似均匀辐射、垂直面收窄的天线；办公室/仓库覆盖主力。"},{"type":"term","id":"ANT-SEMI-001","title":"半定向天线（semidirectional antenna）","text":"ANT-SEMI-001 半定向天线 semidirectional antenna  把能量导向特定方向的短中距天线（板状/Yagi 等）。"},{"type":"term","id":"ANT-HIGHDIR-001","title":"高定向天线（highly directional antenna）","text":"ANT-HIGHDIR-001 高定向天线 highly directional antenna  抛物面碟/栅格天线；严格点对点桥接用，波束最窄、受风载影响大。"},{"type":"term","id":"ANT-SECTOR-001","title":"扇区天线（sector antenna）","text":"ANT-SECTOR-001 扇区天线 sector antenna  覆盖一个扇面的半定向天线；多面拼接可构成全向覆盖。"},{"type":"term","id":"ANT-DIV-001","title":"天线分集（antenna diversity）","text":"ANT-DIV-001 天线分集 antenna diversity  多天线接收同一信号并择优/合并以对抗多径衰落；接收信号常在 10⁻⁸ mW 量级，天线间微小差异即有意义。"},{"type":"term","id":"TOPO-MBSS-001","title":"网状基本服务集（Mesh Basic Service Set · MBSS）","text":"TOPO-MBSS-001 网状基本服务集 Mesh Basic Service Set MBSS AP 间经无线回程多跳互联的 BSS；Mesh 路由为二层、基于 MAC，默认路径选择协议 HWMP。"},{"type":"term","id":"NET-FCTRL-001","title":"帧控制字段（Frame Control · FC）","text":"NET-FCTRL-001 帧控制字段 Frame Control FC MAC 头起始的位字段组：协议版本/类型/子类型/To DS/From DS/More Fragments/Retry/Power Mgmt/More Data/Protected/Order。"},{"type":"term","id":"NET-ADDR-001","title":"四地址字段（Address fields (RA/TA/DA/SA)）","text":"NET-ADDR-001 四地址字段 Address fields (RA/TA/DA/SA)  Addr1–4 按 To DS/From DS 组合分别承担 RA（接收射频）/TA（发送射频）/DA/SA/BSSID 角色。"},{"type":"term","id":"NET-FCS-001","title":"帧校验序列（Frame Check Sequence · FCS）","text":"NET-FCS-001 帧校验序列 Frame Check Sequence FCS MPDU 尾部的 32 位 CRC；校验失败则不回 ACK、触发重传。"},{"type":"term","id":"MAC-PCF-001","title":"点协调功能（Point Coordination Function · PCF）","text":"MAC-PCF-001 点协调功能 Point Coordination Function PCF AP 轮询式无竞争访问（CFP），需双方支持，与 DCF 交替；实现罕见。"},{"type":"term","id":"MAC-HCF-001","title":"混合协调功能（Hybrid Coordination Function · HCF）","text":"MAC-HCF-001 混合协调功能 Hybrid Coordination Function HCF 802.11e 定义：HC 以更高优先级分配 TXOP，构成受控访问期（CAP）。"},{"type":"term","id":"MAC-CTSS-001","title":"CTS-to-Self（单边预约）（CTS-to-Self）","text":"MAC-CTSS-001 CTS-to-Self（单边预约） CTS-to-Self  只发 CTS 不发 RTS 的单边信道预约；开销低、无回执，适合单播往返代价高的发送方。"},{"type":"term","id":"MAC-BA-001","title":"块确认（Block Acknowledgment · Block Ack）","text":"MAC-BA-001 块确认 Block Acknowledgment Block Ack 以一个管理动作建立、按位图批量确认多个 MPDU 的机制；A-MPDU 的配套。"},{"type":"term","id":"MAC-ATIM-001","title":"流量通告消息（ATIM (Announcement Traffic Indication Message) · ATIM）","text":"MAC-ATIM-001 流量通告消息 ATIM (Announcement Traffic Indication Message) ATIM IBSS 中 STA 在 ATIM 窗口互相通告缓存帧的省电机制；基础设施模式用 TIM。"},{"type":"term","id":"NET-UAPSD-001","title":"非调度自动省电投递（Unscheduled Automatic Power Save Delivery · U-APSD）","text":"NET-UAPSD-001 非调度自动省电投递 Unscheduled Automatic Power Save Delivery U-APSD WMM-PS 对应的省电机制：按服务间隔在 STA 发送触发时自动下发缓存帧，减少 PS-Poll 往返。"},{"type":"term","id":"SP-CC-001","title":"卷积编码与码率（convolutional coding / code rate）","text":"SP-CC-001 卷积编码与码率 convolutional coding / code rate  以冗余比特换取纠错能力的信道编码；码率=数据比特/编码比特（1/2、2/3、3/4、5/6）。"},{"type":"term","id":"PERF-DRS-001","title":"动态速率切换（Dynamic Rate Switching · DRS）","text":"PERF-DRS-001 动态速率切换 Dynamic Rate Switching DRS 客户端按 SNR/丢包在 BSA 内不同速率区间间切换的过程；算法属厂商实现。"},{"type":"term","id":"ARCH-PLANE-001","title":"管理/控制/数据三平面（Management / Control / Data planes）","text":"ARCH-PLANE-001 管理/控制/数据三平面 Management / Control / Data planes  网络的三个逻辑平面：管理（配置/监控）、控制（协同策略）、数据（用户流量转发）。"},{"type":"term","id":"ARCH-AC-001","title":"自主架构（Autonomous WLAN architecture）","text":"ARCH-AC-001 自主架构 Autonomous WLAN architecture  AP 各自独立配置/运行、不提供集中无线控制功能的架构；WNMS 可辅助集中管理。"},{"type":"term","id":"ARCH-CTRL-001","title":"WLAN 控制器（WLAN controller）","text":"ARCH-CTRL-001 WLAN 控制器 WLAN controller  集中承担配置/控制（并可选数据转发）的设备；split-MAC 下数据可本地转发。"},{"type":"term","id":"ARCH-CLOUD-001","title":"云管理（WLAN）（Cloud networking (WLAN)）","text":"ARCH-CLOUD-001 云管理（WLAN） Cloud networking (WLAN)  以 SaaS 方式提供 WLAN 管理/监控/配置功能；数据转发通常仍在本地。"},{"type":"term","id":"TOPO-VLAN-001","title":"VLAN 与 SSID-VLAN 映射（VLAN / SSID-to-VLAN mapping）","text":"TOPO-VLAN-001 VLAN 与 SSID-VLAN 映射 VLAN / SSID-to-VLAN mapping  按 802.1Q 划分的二层广播域；无线侧每个 SSID 可映射到不同 VLAN 实现业务隔离。"},{"type":"term","id":"SEC-RBAC-001","title":"基于角色的访问控制（Role-Based Access Control · RBAC）","text":"SEC-RBAC-001 基于角色的访问控制 Role-Based Access Control RBAC 按用户/组角色而非接入位置分配网络权限的模型。"},{"type":"term","id":"ARCH-MCA-001","title":"多信道架构（Multiple-Channel Architecture · MCA）","text":"ARCH-MCA-001 多信道架构 Multiple-Channel Architecture MCA 相邻 AP 使用不同非重叠信道、按复用平面部署的传统架构；覆盖可重叠、频率不可重叠。"},{"type":"term","id":"ARCH-SCA-001","title":"单信道架构（Single-Channel Architecture · SCA）","text":"ARCH-SCA-001 单信道架构 Single-Channel Architecture SCA 全部 AP 使用同一信道的厂商专有架构；同频干扰由控制器集中调度传输。"},{"type":"term","id":"ARCH-CAPCOV-001","title":"容量设计与覆盖设计（Capacity vs Coverage design）","text":"ARCH-CAPCOV-001 容量设计与覆盖设计 Capacity vs Coverage design  按单位面积用户/应用需求（容量）而非最大信号距离（覆盖）布点的设计取向；高密度场景以小覆盖单元+密复用为正解。"},{"type":"term","id":"SEC-PMK-001","title":"成对主密钥（Pairwise Master Key · PMK）","text":"SEC-PMK-001 成对主密钥 Pairwise Master Key PMK 由 802.1X/EAP 或 PSK 认证（或 SAE）产生的主密钥，作为派生 PTK/GTK 的种子材料；永不上线传输。"},{"type":"term","id":"SEC-PTK-001","title":"成对临时密钥（Pairwise Transient Key · PTK）","text":"SEC-PTK-001 成对临时密钥 Pairwise Transient Key PTK 四次握手时由 PMK+双方随机数+双方地址派生的单播会话密钥（含 KCK/TK），每会话新鲜。"},{"type":"term","id":"SEC-GTK-001","title":"组临时密钥（Group Transient Key · GTK）","text":"SEC-GTK-001 组临时密钥 Group Transient Key GTK 保护组播/广播流量的组密钥，由 AP 在四次握手消息 3 加密下发并可经组密钥握手更新。"},{"type":"term","id":"SEC-MFP-001","title":"管理帧保护（Management Frame Protection (802.11w) · MFP/PMF）","text":"SEC-MFP-001 管理帧保护 Management Frame Protection (802.11w) MFP/PMF 以 MIC 保护 Deauth/Disassoc 等管理帧，遏制伪造 DoS；PMF 为 WFA 对应认证名。"},{"type":"term","id":"NET-CAPTIVE-001","title":"强制门户（Captive Portal）","text":"NET-CAPTIVE-001 强制门户 Captive Portal  访客接入后被重定向到登录/同意页的机制；常与独立 VLAN/防火墙策略配合。"},{"type":"term","id":"DIAG-ROGUE-001","title":"未授权接入点（Rogue AP）","text":"DIAG-ROGUE-001 未授权接入点 Rogue AP  未经授权接入本方有线网络的无线 AP；与\"邻居可见网络\"有本质区别。"},{"type":"term","id":"DIAG-WIPS-001","title":"无线入侵检测/防御系统（WIDS / WIPS）","text":"DIAG-WIPS-001 无线入侵检测/防御系统 WIDS / WIPS  被动常听的传感器+集中服务器的检测（WIDS）与阻断（WIPS）体系。"},{"type":"term","id":"DIAG-SPECTRUM-001","title":"频谱分析仪（Spectrum Analyzer）","text":"DIAG-SPECTRUM-001 频谱分析仪 Spectrum Analyzer  测量非编码射频能量的仪器；测量噪声底与识别非 Wi-Fi 干扰的正确工具。"},{"type":"term","id":"PERF-RETXRATE-001","title":"重传率（retransmission rate）","text":"PERF-RETXRATE-001 重传率 retransmission rate  重传帧占比；约 10% 即显著损害性能（教材红线），是无线健康度的核心指标。"},{"type":"term","id":"SP-6GHZ-001","title":"6 GHz 频段（6 GHz band (5925–7125 MHz)）","text":"SP-6GHZ-001 6 GHz 频段 6 GHz band (5925–7125 MHz)  5925–7125 MHz 共 1200 MHz；802.11ax 起支持。监管分岔：美欧多地开放，中国大陆 6425–7125 MHz 划归 IMT（工信部 2023 规定）。"},{"type":"term","id":"NET-RNR-001","title":"精简邻域报告（Reduced Neighbor Report · RNR）","text":"NET-RNR-001 精简邻域报告 Reduced Neighbor Report RNR 在 2.4/5 GHz Beacon 中预告相邻 6 GHz BSS 信息的信息元素，帮助客户端高效发现 6 GHz 网络。"}]}}, chapters: {"unit-00":"<article data-unit=\"00\">\n  <h1>单元 00 · 课程导航与基础测评<\/h1>\n  <p class=\"unit-meta\">课程导航 ｜ 不属于阶段划分 ｜ 编制日期：2026-10-24<\/p>\n\n  <section id=\"intro\">\n    <h2>欢迎来到 Wi-Fi Academy<\/h2>\n    <p>这是一套基于 <strong>CWNA 教材（本地第 4 版，2014）与 IEEE 802.11 / Wi-Fi Alliance 官方资料<\/strong>构建的交互式 Wi-Fi 系统课程，共 20 个单元、五个阶段。当前开发状态：<strong>单元 06 为可用原型<\/strong>，其余单元的教材映射与资料核查已完成、内容按阶段逐章开发（见阶段 A 报告）。<\/p>\n    <div class=\"callout info\"><span class=\"co-t\">建议的入门路径<\/span>\n      先逛一遍目录了解全貌，然后直接进入原型单元 <a href=\"#/unit/06\">06 · 扫描、Beacon、Probe、认证、关联和漫游<\/a>——它演示了本课程的全部能力：正文、图解、时序动画、交互实验、测验、术语悬浮与进度管理。\n    <\/div>\n  <\/section>\n\n  <section id=\"usage\">\n    <h2>使用说明<\/h2>\n    <ul>\n      <li><strong>目录导航<\/strong>：左侧按五个阶段分组；单元图标 ◐=读过一部分，✓=已完成。<\/li>\n      <li><strong>进度管理<\/strong>：阅读小节与测验成绩自动记录在<strong>本机浏览器<\/strong>（非云端同步）；顶栏显示总体进度；\"学习设置\"里可导出/导入/清除进度（清除需二次确认）。<\/li>\n      <li><strong>术语查询<\/strong>：正文中的虚线下划线词可点击查看术语卡；<a href=\"#/glossary\">术语表<\/a>收录全部 96 条术语及其核查状态。<\/li>\n      <li><strong>动画与实验<\/strong>：动画可播放/步进/调速，底部列出\"教学简化说明\"；实验面板均标注\"教学仿真模型\"，参数假设写在面板内。<\/li>\n      <li><strong>诚实性约定<\/strong>：每个结论带核查徽章（已核实 / 概念已核·条款待核 / 待核实）；未核实内容不会伪装成已验证。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"selfcheck\">\n    <h2>基础自查清单<\/h2>\n    <p>开始学习前，确认以下先修概念是否熟悉（不熟悉也没关系，单元 01–04 会补齐）：<\/p>\n    <ul>\n      <li>能说出 IP 地址与 MAC 地址的区别；<\/li>\n      <li>知道 TCP/IP 大致分层（后续单元 15 会打通）；<\/li>\n      <li>接触过无线路由器/家庭 Wi-Fi 的基本配置；<\/li>\n      <li>（可选）知道 dB 是对数单位。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"map\">\n    <h2>课程地图<\/h2>\n    <table class=\"data\">\n      <tr><th>阶段<\/th><th>单元<\/th><th>主线<\/th><\/tr>\n      <tr><td>无线通信基础<\/td><td>01–04<\/td><td>标准组织 → 电磁波与 dBm → 传播与 SNR → 天线与链路预算<\/td><\/tr>\n      <tr><td>802.11 协议核心<\/td><td>05–09<\/td><td>拓扑身份 → 接入流程（<strong>本课程原型<\/strong>）→ 帧结构 → 信道访问 → 数据传输<\/td><\/tr>\n      <tr><td>性能与网络架构<\/td><td>10–13<\/td><td>OFDM/MCS → MIMO 与吞吐 → 架构与 VLAN → 信道规划与勘测<\/td><\/tr>\n      <tr><td>安全与实际网络<\/td><td>14–16<\/td><td>WPA2/WPA3 与密钥 → DHCP/DNS 打通三层 → 抓包与排障<\/td><\/tr>\n      <tr><td>现代 Wi-Fi<\/td><td>17–19<\/td><td>代际演进 → Wi-Fi 6 关键机制 → Wi-Fi 7（MLO/320 MHz/4096-QAM）<\/td><\/tr>\n    <\/table>\n  <\/section>\n<\/article>\n","unit-01":"<article data-unit=\"01\">\n  <h1>单元 01 · Wi-Fi 的发展、标准组织与技术体系<\/h1>\n  <p class=\"unit-meta\">第一阶段 · 无线通信基础 ｜ 教材映射：CWNA 4th Ed 第 1 章（正文节选已核对）｜ 编制日期：2026-10-24<\/p>\n\n  <section id=\"goals\">\n    <h2>学习目标<\/h2>\n    <ol>\n      <li>说出 ITU-R、FCC（及各国监管机构）、IEEE、Wi-Fi Alliance、IETF、ISO 各自的层级与职能；<\/li>\n      <li>区分 <strong>IEEE 技术标准<\/strong>与 <strong>WFA 互操作性认证<\/strong>这两个不同维度（\"两个独立组织\"）；<\/li>\n      <li>解释 802.11 的演进方式：修正案（amendment，如 802.11ax）与整合版（rollup，如 802.11-2024）；<\/li>\n      <li>说明修正案字母命名的规则与易混点（为什么没有 802.11x）；<\/li>\n      <li>梳理从 1997 到 802.11be/Wi-Fi 7 的技术代际脉络。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"prereqs\">\n    <h2>前置知识<\/h2>\n    <div class=\"callout info\"><span class=\"co-t\">先修<\/span>单元 00（课程导航）。本单元不要求 RF 背景。<\/div>\n  <\/section>\n\n  <section id=\"terms\">\n    <h2>核心术语<\/h2>\n    <div class=\"term-chips\">\n      <dfn data-term=\"STD-ITUR-001\">ITU-R<\/dfn>\n      <dfn data-term=\"STD-FCC-001\">FCC<\/dfn>\n      <dfn data-term=\"STD-IEEE-001\">IEEE<\/dfn>\n      <dfn data-term=\"STD-WFA-001\">Wi-Fi Alliance<\/dfn>\n      <dfn data-term=\"STD-IETF-001\">IETF<\/dfn>\n      <dfn data-term=\"STD-AMEND-001\">修正案 amendment<\/dfn>\n      <dfn data-term=\"STD-ROLLUP-001\">整合版 rollup<\/dfn>\n    <\/div>\n  <\/section>\n\n  <section id=\"intuition\">\n    <h2>直观解释：为什么无线领域\"管事的\"这么多<\/h2>\n    <p>有线网络里，两台设备之间隔着一根你自己的网线；而无线信号一发出就穿越了邻居、街道甚至国境——<strong>频谱是公共资源<\/strong>。因此它天然需要四层各司其职的体系：<strong>谁允许用哪个频段<\/strong>（国际条约与国家监管）→ <strong>设备该怎么说话<\/strong>（技术标准）→ <strong>不同厂家的设备能否互相听懂<\/strong>（互操作认证）→ <strong>互联网那头怎么走<\/strong>（互联网协议）。理解了这一层\"分工\"，你就不会再把 Wi-Fi 6（认证名）与 802.11ax（IEEE 修正案）混为一谈。<\/p>\n  <\/section>\n\n  <section id=\"formal\">\n    <h2>正式定义与职能表<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:150px\">组织<\/th><th>层级/职能（分级标注）<\/th><\/tr>\n      <tr><td><dfn data-term=\"STD-ITUR-001\">ITU-R<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 国际电信联盟无线电通信部门。其无线电规则属<strong>国际条约<\/strong>；在条约框架内把世界划分为区域并划分频段/频道及使用条件（教材 p.7，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"STD-FCC-001\">FCC<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 美国联邦监管机构：依据《1934 年通信法》监管美国境内及进出美国的无线电通信；规则载于美国联邦法规 CFR 第 47 编（Title 47）第 15 部分\"射频装置\"（教材 p.5–6，已核对正文）。其他国家有对应机构（教材列举 ACMA 等）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"STD-IEEE-001\">IEEE<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 电气与电子工程师学会。802.11 工作组以任务组（TG）形式制定 WLAN 的 MAC 与 PHY 技术标准，产物是修正案与整合版标准（教材 p.7–8，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"STD-WFA-001\">Wi-Fi Alliance<\/dfn><\/td><td><span class=\"badge verified\">WFA 认证要求<\/span> 行业联盟：拥有 Wi-Fi 商标，运行 Wi-Fi CERTIFIED 互操作性认证。教材明确：\"IEEE 定义 WLAN 标准，Wi-Fi Alliance 定义互操作性认证——这是两个独立组织\"（p.12，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"STD-IETF-001\">IETF<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 互联网工程任务组：以 RFC 文档定义互联网协议；RFC 按序编号且编号永不复用（教材 p.10，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"STD-ISO-001\">ISO<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 国际标准化组织：与 IEC 等共同维护更广层面的标准体系（802 系列被纳入 ISO/IEC 8802 系列）（教材 Ch1 概述）。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"principles\">\n    <h2>工作原理：四层体系与演进机制<\/h2>\n\n    <h3>1. 四层体系<\/h3>\n    <div style=\"overflow-x:auto\">\n    <svg viewBox=\"0 0 720 190\" style=\"min-width:560px;width:100%;height:auto\" role=\"img\" aria-label=\"无线网络监管、标准、认证与实现的四层体系\">\n      <g font-size=\"13\">\n        <rect x=\"30\" y=\"12\" width=\"660\" height=\"34\" rx=\"8\" fill=\"var(--warn-soft)\" stroke=\"var(--warn)\"/>\n        <text x=\"360\" y=\"34\" text-anchor=\"middle\" fill=\"var(--warn)\" font-weight=\"600\">监管层：ITU-R（国际条约）→ 各国监管机构（如 FCC）——决定\"哪里能用、多大功率\"<\/text>\n        <rect x=\"30\" y=\"56\" width=\"660\" height=\"34\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/>\n        <text x=\"360\" y=\"78\" text-anchor=\"middle\" fill=\"var(--accent-strong)\" font-weight=\"600\">标准层：IEEE 802.11（修正案 + 整合版）——决定\"怎么通信\"<\/text>\n        <rect x=\"30\" y=\"100\" width=\"660\" height=\"34\" rx=\"8\" fill=\"var(--ok-soft)\" stroke=\"var(--ok)\"/>\n        <text x=\"360\" y=\"122\" text-anchor=\"middle\" fill=\"var(--ok)\" font-weight=\"600\">认证层：Wi-Fi Alliance Wi-Fi CERTIFIED——保证\"不同厂家能互通\"<\/text>\n        <rect x=\"30\" y=\"144\" width=\"660\" height=\"34\" rx=\"8\" fill=\"var(--bg-soft)\" stroke=\"var(--border)\"/>\n        <text x=\"360\" y=\"166\" text-anchor=\"middle\" fill=\"var(--text-soft)\" font-weight=\"600\">实现层：芯片/设备厂商（在上述约束内做产品，能力有差异）<\/text>\n      <\/g>\n    <\/svg>\n    <\/div>\n    <p style=\"font-size:13px;color:var(--text-soft)\">原创示意图（非原书插图）。<\/p>\n\n    <h3>2. 演进机制：修正案与整合版<\/h3>\n    <ul>\n      <li><dfn data-term=\"STD-AMEND-001\">修正案<\/dfn>：任务组针对特定增强发布的文件（802.11n、802.11ac、802.11ax、802.11be……），发布后并入下一轮整合版；<\/li>\n      <li><dfn data-term=\"STD-ROLLUP-001\">整合版<\/dfn>：周期性把已发布修正案合并重写的完整标准（802.11-2007/2012/2016/2020/2024）。<strong>现行整合版为 IEEE Std 802.11-2024<\/strong><span class=\"badge verified\">已核实（IEEE 官方页）<\/span>；<\/li>\n      <li><strong>字母命名规则<\/strong>（教材 p.8，已核对正文）：小写字母按序指派给任务组；<strong>o 与 l 不指派<\/strong>（避免与数字 0/1 混淆）；<strong>802.11x 未被指派<\/strong>（避免与 802.1X 标准混淆，且 \"802.11x\" 已被民间滥用来泛指 802.11）。<\/li>\n    <\/ul>\n\n    <h3>3. 代际脉络<\/h3>\n    <table class=\"data\">\n      <tr><th>IEEE 修正案<\/th><th>俗称（WFA 代际名）<\/th><th>关键增强<\/th><\/tr>\n      <tr><td>802.11-1997<\/td><td>—<\/td><td>初始标准（DSSS/FHSS，2 Mb/s 量级）<\/td><\/tr>\n      <tr><td>802.11b / 802.11a / 802.11g<\/td><td>—<\/td><td>HR-DSSS 11 Mb/s；5 GHz OFDM；2.4 GHz OFDM<\/td><\/tr>\n      <tr><td>802.11n-2009<\/td><td>Wi-Fi 4<\/td><td>MIMO、40 MHz、MCS、帧聚合（HT）<\/td><\/tr>\n      <tr><td>802.11ac-2013<\/td><td>Wi-Fi 5<\/td><td>5 GHz、更宽信道、256-QAM、DL MU-MIMO（VHT）<\/td><\/tr>\n      <tr><td>802.11ax-2021<\/td><td>Wi-Fi 6 / 6E<\/td><td>OFDMA、UL MU-MIMO、TWT、6 GHz（HE）<\/td><\/tr>\n      <tr><td>802.11be-2024<\/td><td>Wi-Fi 7<\/td><td>320 MHz、4096-QAM、MLO（EHT）<\/td><\/tr>\n    <\/table>\n    <p style=\"font-size:13px;color:var(--text-soft)\">代际命名于 2018-10 由 WFA 公布；各代细节在单元 17–19 展开。表内编号/年份均已在 standards-matrix.md 核实。<\/p>\n  <\/section>\n\n  <section id=\"diagrams\">\n    <h2>图解<\/h2>\n    <p>本单元的\"图\"以静态结构图为主（四层体系见上）；协议流程类动画从单元 06 起引入。<\/p>\n  <\/section>\n\n  <section id=\"lab\">\n    <h2>交互实验<\/h2>\n    <div data-lab=\"org-match\"><\/div>\n  <\/section>\n\n  <section id=\"case\">\n    <h2>工程案例：采购\"Wi-Fi 7 AP\"时到底在看什么<\/h2>\n    <p>某企业准备采购 Wi-Fi 7 接入点，招标文件该写什么？用四层体系拆解：<\/p>\n    <ol>\n      <li><strong>监管层<\/strong>：部署所在国家/地区允许的频段与功率（6 GHz 是否开放、DFS 要求等——地区差异极大，须以当地监管文件为准；中国大陆 6 GHz 规划见单元 17 的专项说明）<span class=\"badge pending\">地区监管待核实<\/span>；<\/li>\n      <li><strong>标准层<\/strong>：明确要求支持的 IEEE 能力（如 802.11be EHT、MLO）；<\/li>\n      <li><strong>认证层<\/strong>：要求 Wi-Fi CERTIFIED 7 认证与 WPA3 认证——认证清单可在 WFA 官网按型号查验；<\/li>\n      <li><strong>实现层<\/strong>：厂商的射频规格、天线设计与软件功能（这部分标准不管，差异在这里）。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"pitfalls\">\n    <h2>易错点与概念辨析<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:240px\">易错说法<\/th><th>辨析<\/th><\/tr>\n      <tr><td>\"Wi-Fi 6 就是 802.11ax 标准\"<\/td><td>Wi-Fi 6 是 WFA 的<strong>代际认证名<\/strong>；802.11ax 是 <strong>IEEE 修正案编号<\/strong>。两者相关但维度不同，教材 p.12 明言两个组织相互独立。<\/td><\/tr>\n      <tr><td>\"802.11x 是下一个标准\"<\/td><td>802.11x 从未被指派（避免与 802.1X 混淆）；民间常用 \"802.11x\" 泛指整个 802.11 家族（教材 p.8）。<\/td><\/tr>\n      <tr><td>\"FCC 制定了 Wi-Fi 标准\"<\/td><td>FCC 只管频谱使用规则（功率/频段）；技术标准是 IEEE 的活。<\/td><\/tr>\n      <tr><td>\"通过了 Wi-Fi 认证=支持标准全部功能\"<\/td><td>认证是<strong>互操作性基线<\/strong>，许多可选能力不在认证范围内。<\/td><\/tr>\n      <tr><td>\"802.11be 是 Wi-Fi 8\"<\/td><td>802.11be（EHT）对应 Wi-Fi 7；Wi-Fi 8 方向的 P802.11bn 仍是草案（不得当标准引用）。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"summary\">\n    <h2>知识总结<\/h2>\n    <ul>\n      <li>频谱是公共资源 → 监管（ITU-R/FCC 等）→ 标准（IEEE 802.11）→ 认证（WFA）→ 实现（厂商）四层分工；<\/li>\n      <li>IEEE 管标准、WFA 管互操作认证，两个独立组织；<\/li>\n      <li>修正案按字母演进（无 o/l/x），周期性合并为整合版；现行整合版 802.11-2024；<\/li>\n      <li>代际名 Wi-Fi 4/5/6/7 是 WFA 命名，与 IEEE 编号一一对应但概念不同；<\/li>\n      <li>IETF 的 RFC 定义互联网协议，编号永不复用。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"quiz\">\n    <h2>单元测验<\/h2>\n    <div data-quiz=\"01\"><\/div>\n  <\/section>\n\n  <section id=\"mapping\">\n    <h2>教材章节映射<\/h2>\n    <table class=\"data\">\n      <tr><th>来源<\/th><th>对应位置<\/th><th>状态<\/th><\/tr>\n      <tr><td>CWNA 4th Ed<\/td><td>第 1 章 §History of WLAN / §Standards Organizations（书页 2–16）<\/td><td><span class=\"badge verified\">已核实（正文节选已读：p.2、5–8、10、12、15）<\/span><\/td><\/tr>\n      <tr><td>Sybex 6th Ed<\/td><td>Ch1（章题级）<\/td><td><span class=\"badge unverified\">仅目录可核<\/span><\/td><\/tr>\n      <tr><td>CWNA-110 考试域<\/td><td>WLAN Regulations and Standards（D2）<\/td><td><span class=\"badge verified\">已核实<\/span><\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"sources\">\n    <h2>标准与官方来源<\/h2>\n    <ul>\n      <li><strong>S1-1<\/strong> CWNA 4th Ed Ch1 p.1–30（引用页 p.2/5/6/7/8/10/12/15 已逐页核对）【一手】<\/li>\n      <li><strong>S2-1<\/strong> IEEE Std 802.11-2024【编号已核实】<\/li>\n      <li><strong>S3-1..S3-4<\/strong> Wi-Fi Alliance 代际命名与 CERTIFIED 6/6E/7 新闻稿【已核实】<\/li>\n      <li><strong>S4-2<\/strong> CWNA-110 考试目标 D2 域【已核实】<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"reading\">\n    <h2>延伸阅读<\/h2>\n    <ul>\n      <li>IEEE 802.11 官方时间线页（ieee802.org/11/Reports/802.11_Timelines.htm）：各任务组状态一手来源；<\/li>\n      <li>WFA explore-all-technologies 页：全部认证项目清单；<\/li>\n      <li>下一站：单元 02 进入物理世界——电磁波与 dBm。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"audit\">\n    <h2>本单元审核结果（摘要）<\/h2>\n    <p style=\"font-size:14px\">术语 7 条全部入对照术语库<span class=\"badge verified\">已核实<\/span>；组织职能逐条对照教材正文与官方页<span class=\"badge verified\">已核实<\/span>；标准编号对照 standards-matrix.md<span class=\"badge verified\">已核实<\/span>；地区监管（6 GHz）保留待核<span class=\"badge pending\">待核实<\/span>。详见 <code>docs/audits/unit-01-audit.md<\/code>。<\/p>\n  <\/section>\n<\/article>\n","unit-02":"<article data-unit=\"02\">\n  <h1>单元 02 · 电磁波、频率、波长、功率与 dBm<\/h1>\n  <p class=\"unit-meta\">第一阶段 · 无线通信基础 ｜ 教材映射：CWNA 4th Ed 第 2、3 章（正文节选已核对）｜ 编制日期：2026-10-24<\/p>\n\n  <section id=\"goals\">\n    <h2>学习目标<\/h2>\n    <ol>\n      <li>写出并使用 λ = c/f，对 2.4/5/6 GHz 估算波长；<\/li>\n      <li>用 10s &amp; 3s 规则心算 dBm↔mW 换算，并说明它是近似法；<\/li>\n      <li>严格区分 dB（比较单位）、dBm（绝对功率）、dBi/dBd（天线增益基准）；<\/li>\n      <li>解释振幅与功率、相位与调制的对应关系；<\/li>\n      <li>理解倒平方律：距离加倍，功率密度降为 1/4。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"prereqs\">\n    <h2>前置知识<\/h2>\n    <div class=\"callout info\"><span class=\"co-t\">先修<\/span>单元 01。需具备初中代数（对数概念会由 10s&amp;3s 规则绕开）。<\/div>\n  <\/section>\n\n  <section id=\"terms\">\n    <h2>核心术语<\/h2>\n    <div class=\"term-chips\">\n      <dfn data-term=\"RF-CARRIER-001\">载波信号<\/dfn>\n      <dfn data-term=\"RF-FREQ-001\">频率<\/dfn>\n      <dfn data-term=\"RF-WAVE-001\">波长<\/dfn>\n      <dfn data-term=\"RF-AMPL-001\">振幅<\/dfn>\n      <dfn data-term=\"RF-PHASE-001\">相位<\/dfn>\n      <dfn data-term=\"RF-DB-001\">dB<\/dfn>\n      <dfn data-term=\"RF-DBM-001\">dBm<\/dfn>\n      <dfn data-term=\"RF-DBI-001\">dBi / dBd<\/dfn>\n      <dfn data-term=\"RF-KEYING-001\">键控法 ASK/FSK/PSK<\/dfn>\n    <\/div>\n  <\/section>\n\n  <section id=\"intuition\">\n    <h2>直观解释：天线里\"抖\"出来的波<\/h2>\n    <p>天线上的高频电流让电子来回振荡，把能量以电磁波的形式\"抖\"进空间——这个波就像水面的涟漪，有<strong>波长<\/strong>（相邻两个波峰的距离）、<strong>频率<\/strong>（每秒抖多少次）、<strong>振幅<\/strong>（抖多猛，对应功率）和<strong>相位<\/strong>（此刻在周期里的哪个位置）。数据就藏在这四个量的变化里：改变振幅/频率/相位来承载 0 和 1，就是<dfn data-term=\"RF-KEYING-001\">键控<\/dfn>。<\/p>\n    <p>而 <strong>dBm<\/strong> 之所以无处不在，是因为无线信号的功率范围横跨十几个数量级（教材 p.137 举例：接收信号常小于 0.00000001 mW），线性单位写起来是灾难；对数单位把\"乘除\"变成\"加减\"，再配合\"10 和 3\"两条心算规则，工程师就能口算链路。<\/p>\n  <\/section>\n\n  <section id=\"formal\">\n    <h2>正式定义<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:150px\">概念<\/th><th>定义（分级标注）<\/th><\/tr>\n      <tr><td><dfn data-term=\"RF-CARRIER-001\">载波信号<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 承载数据被发射的射频交流信号；发射机决定其频率与初始幅度（功率）（教材 p.67，已核对正文）。<\/td><\/tr>\n      <tr><td>波长 / 频率<\/td><td><span class=\"badge verified\">标准正式定义<\/span> λ = c / f，f = c / λ；c ≈ 3×10⁸ m/s；两者<strong>反比<\/strong>（教材 p.40，已核对正文）。频率是\"指定事件在指定时间间隔内发生的次数\"，单位 Hz（p.39）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"RF-DB-001\">dB<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> <strong>比较单位，不是功率单位<\/strong>：dB = 10·lg(P₁/P₂)，表示两功率之比（教材 p.72–73，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"RF-DBM-001\">dBm<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 以 1 mW 为基准的<strong>绝对功率<\/strong>单位：P[dBm] = 10·lg(P[mW])；0 dBm = 1 mW（教材 p.75 一带；公式为通用定义）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"RF-DBI-001\">dBi / dBd<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 天线增益的参考基准：dBi 以理论各向同性辐射体为 0；dBd 以半波偶极子为 0，半波偶极子 = 2.14 dBi（教材 p.74–75，已核对正文；另有文献取 2.15，本课程采用教材值 2.14 并注明）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"RF-KEYING-001\">键控法<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 改变载波的振幅/频率/相位以承载数据：ASK（幅移）、FSK（频移）、PSK（相移）（教材 Ch1 §Understanding Keying Methods；后续 QAM 为幅相联合）。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"principles\">\n    <h2>工作原理<\/h2>\n\n    <h3>1. 10s &amp; 3s 心算规则（近似法）<\/h3>\n    <p>教材 p.78 明确指出：<strong>该规则给出的是近似值<\/strong>，做合规认证要用精确公式（已核对正文）。规则本身：<\/p>\n    <ul>\n      <li>+10 dB ⇒ 功率 ×10；−10 dB ⇒ ÷10；<\/li>\n      <li>+3 dB ⇒ 功率 ×2（精确 2.0 倍对应 +3.01 dB）；−3 dB ⇒ ÷2。<\/li>\n    <\/ul>\n    <div class=\"callout ok\"><span class=\"co-t\">示例<\/span>把 100 mW 换成 dBm：100 = 1 × 10 × 10 → 0 + 10 + 10 = <strong>20 dBm<\/strong>。反过来 −50 dBm = 1 mW ÷ 10 ÷ 10 ÷ 10 ÷ 10 ÷ 2 = 0.00001 mW（= 10⁻⁵ mW，注意教材 p.137 提到的接收信号量级正是 10⁻⁸ mW 级）。<\/div>\n\n    <h3>2. 倒平方律<\/h3>\n    <p>距离加倍 → 功率密度降为 1/4（−6 dB）；距离 ×10 → 1/100（−20 dB）。这就是 FSPL 的物理内核（单元 03 展开），也解释了为什么\"离 AP 远一个工位\"信号就明显变差。<\/p>\n\n    <h3>3. 电磁频谱与 Wi-Fi 的位置<\/h3>\n    <div style=\"overflow-x:auto\">\n    <svg viewBox=\"0 0 720 120\" style=\"min-width:560px;width:100%;height:auto\" role=\"img\" aria-label=\"电磁频谱示意与 Wi-Fi 频段位置\">\n      <g font-size=\"12\">\n        <rect x=\"20\" y=\"30\" width=\"680\" height=\"26\" rx=\"6\" fill=\"var(--bg-soft)\" stroke=\"var(--border)\"/>\n        <text x=\"80\" y=\"47\" text-anchor=\"middle\" fill=\"var(--text-soft)\">MF/HF…<\/text>\n        <text x=\"200\" y=\"47\" text-anchor=\"middle\" fill=\"var(--text-soft)\">VHF<\/text>\n        <text x=\"330\" y=\"47\" text-anchor=\"middle\" fill=\"var(--accent-strong)\" font-weight=\"700\">UHF 2.4/5/6 GHz（Wi-Fi）<\/text>\n        <text x=\"500\" y=\"47\" text-anchor=\"middle\" fill=\"var(--text-soft)\">SHF/EHF（mmWave 60 GHz）<\/text>\n        <text x=\"640\" y=\"47\" text-anchor=\"middle\" fill=\"var(--text-soft)\">红外/光<\/text>\n        <line x1=\"20\" y1=\"76\" x2=\"700\" y2=\"76\" stroke=\"var(--accent)\" stroke-width=\"1.4\"/>\n        <polygon points=\"700,72 708,76 700,80\" fill=\"var(--accent)\"/>\n        <text x=\"20\" y=\"96\" fill=\"var(--text-faint)\">频率升高 →<\/text>\n        <text x=\"700\" y=\"96\" text-anchor=\"end\" fill=\"var(--text-faint)\">波长变短（λ=c/f）→ 绕射更难、覆盖更小<\/text>\n      <\/g>\n    <\/svg>\n    <\/div>\n    <p style=\"font-size:13px;color:var(--text-soft)\">原创示意图（非原书插图）。<\/p>\n  <\/section>\n\n  <section id=\"diagrams\">\n    <h2>图解<\/h2>\n    <p>波形参数的动态演示见下方实验（wave-lab）：拖动频率/振幅/相位滑块观察正弦波变化。<\/p>\n  <\/section>\n\n  <section id=\"lab\">\n    <h2>交互实验<\/h2>\n    <div data-lab=\"wave-lab\"><\/div>\n    <div data-lab=\"dbm-lab\"><\/div>\n  <\/section>\n\n  <section id=\"case\">\n    <h2>工程案例：\"−40 和 −70 dBm 差多少？\"<\/h2>\n    <p>同事说\"会议室信号 −70 dBm 也还行吧，才比工位的 −40 差 30 而已\"。用本单元知识纠正：30 dB = 1000 倍功率比。−40 dBm = 10⁻⁴ mW，−70 dBm = 10⁻⁷ mW——差三个数量级。对链路预算而言，这 30 dB 要靠提高功率/增益或缩短距离来补，而发射功率受监管上限约束（EIRP 概念见单元 04）。<\/p>\n  <\/section>\n\n  <section id=\"pitfalls\">\n    <h2>易错点与概念辨析<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:240px\">易错说法<\/th><th>辨析<\/th><\/tr>\n      <tr><td>\"dB 是功率单位\"<\/td><td>dB 是<strong>比较/比值<\/strong>单位；绝对功率要用 dBm（教材 p.72：\"a unit of comparison, not a unit of power\"，已核对正文）。<\/td><\/tr>\n      <tr><td>\"dBi 以半波偶极子为基准\"<\/td><td>dBi 基准是<strong>各向同性辐射体<\/strong>；半波偶极子基准是 dBd（0 dBd ≈ 2.14 dBi）。<\/td><\/tr>\n      <tr><td>\"+3 dB 就是功率加了 3%\"<\/td><td>+3 dB 是翻倍（×2）；+10 dB 是十倍。<\/td><\/tr>\n      <tr><td>\"频率越高波长越长\"<\/td><td>反比：f 越高 λ 越短。5 GHz 波长约 5.5 cm，只有 2.4 GHz（约 12.3 cm）的一半不到。<\/td><\/tr>\n      <tr><td>\"10s&amp;3s 算出来的就是精确值\"<\/td><td>它是<strong>近似心算法<\/strong>（教材 p.78 明示）；合规计算用 10·lg 公式。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"summary\">\n    <h2>知识总结<\/h2>\n    <ul>\n      <li>载波四要素：频率、波长、振幅、相位；λ = c/f（反比）；<\/li>\n      <li>dB=比值，dBm=绝对功率（0 dBm=1 mW），dBi/dBd=增益基准（0 dBd≈2.14 dBi）；<\/li>\n      <li>10s &amp; 3s：×10=+10 dB、×2≈+3 dB，结果为近似值；<\/li>\n      <li>倒平方律：距离加倍 −6 dB（功率密度 1/4）；<\/li>\n      <li>键控法把数据装进波形：ASK/FSK/PSK（→QAM，单元 10）。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"quiz\">\n    <h2>单元测验<\/h2>\n    <div data-quiz=\"02\"><\/div>\n  <\/section>\n\n  <section id=\"mapping\">\n    <h2>教材章节映射<\/h2>\n    <table class=\"data\">\n      <tr><th>来源<\/th><th>对应位置<\/th><th>状态<\/th><\/tr>\n      <tr><td>CWNA 4th Ed<\/td><td>第 2 章 §Radio Frequency Characteristics（书页 34–41）；第 3 章 §Units of Power and Comparison / §RF Mathematics（书页 70–97）<\/td><td><span class=\"badge verified\">已核实（正文节选已读：p.33–40、67、71–78、89、94、96）<\/span><\/td><\/tr>\n      <tr><td>Sybex 6th Ed<\/td><td>Ch3 / Ch4（章题级）<\/td><td><span class=\"badge unverified\">仅目录可核<\/span><\/td><\/tr>\n      <tr><td>CWNA-110 考试域<\/td><td>Radio Frequency (RF) Technologies（D1）<\/td><td><span class=\"badge verified\">已核实<\/span><\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"sources\">\n    <h2>标准与官方来源<\/h2>\n    <ul>\n      <li><strong>S1-1<\/strong> CWNA 4th Ed Ch2/Ch3（引用页已逐页核对）【一手】<\/li>\n      <li><strong>S4-2<\/strong> CWNA-110 考试目标 D1 域【已核实】<\/li>\n      <li>公式 dB/dBm/λ=c/f 为通用工程定义，与教材一致。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"reading\">\n    <h2>延伸阅读<\/h2>\n    <ul>\n      <li>教材 p.76–77：为什么同时需要 mW 与 dBm 两种表示；<\/li>\n      <li>下一站：单元 03——波在真实环境里会发生什么（吸收/反射/绕射/多径）。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"audit\">\n    <h2>本单元审核结果（摘要）<\/h2>\n    <p style=\"font-size:14px\">术语 9 条对照术语库<span class=\"badge verified\">已核实<\/span>；单位定义逐条对照教材正文（dB 比较单位/2.14 dBi/10s&amp;3s 近似）<span class=\"badge verified\">已核实<\/span>；公式与算例复核通过（换算表、倒平方律）<span class=\"badge verified\">已核实<\/span>。详见 <code>docs/audits/unit-02-audit.md<\/code>。<\/p>\n  <\/section>\n<\/article>\n","unit-03":"<article data-unit=\"03\">\n  <h1>单元 03 · 无线传播、衰减、多径、干扰和信噪比<\/h1>\n  <p class=\"unit-meta\">第一阶段 · 无线通信基础 ｜ 教材映射：CWNA 4th Ed 第 2、3 章（正文节选已核对）｜ 编制日期：2026-10-24<\/p>\n\n  <section id=\"goals\">\n    <h2>学习目标<\/h2>\n    <ol>\n      <li>说出五种主要 RF 行为（吸收、反射、散射、折射、绕射）并各举一例；<\/li>\n      <li>使用 FSPL 公式与 6 dB 规则估算损耗，并说明其前提；<\/li>\n      <li>解释多径的两面性：ISI/深衰落 vs MIMO 的增益来源；<\/li>\n      <li>区分噪声底、SNR、SINR，并说明测量噪声底应使用的工具；<\/li>\n      <li>编制一张简单链路预算表并解释衰落余量的用途。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"prereqs\">\n    <h2>前置知识<\/h2>\n    <div class=\"callout info\"><span class=\"co-t\">先修<\/span>单元 02（dB/dBm 心算）。本单元大量使用 +6/−3 dB 这类语言。<\/div>\n  <\/section>\n\n  <section id=\"terms\">\n    <h2>核心术语<\/h2>\n    <div class=\"term-chips\">\n      <dfn data-term=\"RF-ABSP-001\">吸收<\/dfn>\n      <dfn data-term=\"RF-REFL-001\">反射<\/dfn>\n      <dfn data-term=\"RF-SCAT-001\">散射<\/dfn>\n      <dfn data-term=\"RF-REFR-001\">折射<\/dfn>\n      <dfn data-term=\"RF-DIFF-001\">绕射<\/dfn>\n      <dfn data-term=\"RF-MP-001\">多径<\/dfn>\n      <dfn data-term=\"RF-FSPL-001\">自由空间路径损耗<\/dfn>\n      <dfn data-term=\"RF-CCI-001\">同频干扰<\/dfn>\n      <dfn data-term=\"RF-ACI-001\">邻频干扰<\/dfn>\n      <dfn data-term=\"RF-NF-001\">噪声底<\/dfn>\n      <dfn data-term=\"RF-SNR-001\">SNR<\/dfn>\n      <dfn data-term=\"RF-SINR-001\">SINR<\/dfn>\n      <dfn data-term=\"RF-LB-001\">链路预算<\/dfn>\n      <dfn data-term=\"RF-FM-001\">衰落余量<\/dfn>\n    <\/div>\n  <\/section>\n\n  <section id=\"intuition\">\n    <h2>直观解释：一封\"漂流瓶\"投递到隔壁办公室<\/h2>\n    <p>把一帧数据想象成漂流瓶：从 AP 出发后，它可能<strong>被墙喝掉一部分<\/strong>（吸收）、<strong>被金属柜子弹回来<\/strong>（反射）、<strong>在粗糙表面碎成一堆小瓶<\/strong>（散射）、<strong>穿过不同密度空气时拐了弯<\/strong>（折射）、<strong>顺着门框边缘溜过去<\/strong>（绕射）。拐了弯、弹回来的那些\"分身\"走的路不一样长，几乎同时到达接收端——这就是<dfn data-term=\"RF-MP-001\">多径<\/dfn>。接收端听到的是所有分身的<strong>叠加<\/strong>：同相则强，反相则弱甚至为零。理解\"叠加\"是理解一切无线覆盖现象的钥匙。<\/p>\n  <\/section>\n\n  <section id=\"formal\">\n    <h2>正式定义<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:150px\">概念<\/th><th>定义（分级标注）<\/th><\/tr>\n      <tr><td><dfn data-term=\"RF-ABSP-001\">吸收<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 信号既不弹开、不绕行也不穿透时，100% 被介质吸收；砖/混凝土墙吸收显著，石膏板较小（教材 p.44，已核对正文；书中并给出常见建材 2.4 GHz 衰减表：电梯/金属障碍 −10 dB、金属架 −6 dB、石膏板/玻璃/木门 −3 dB、隔断 −2 dB）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"RF-REFL-001\">反射<\/dfn> / <dfn data-term=\"RF-SCAT-001\">散射<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 反射：波遇大于其波长的光滑表面弹回；散射：遇与波长相当或更小的粗糙表面/颗粒向多方向散开（教材 p.44–47，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"RF-REFR-001\">折射<\/dfn> / <dfn data-term=\"RF-DIFF-001\">绕射<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 折射：穿过不同密度介质时方向弯折（多由大气条件引起，室外桥接关注 k 因子）；绕射：波绕过障碍物边缘继续传播——不要与折射混淆（教材 p.47–48，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"RF-FSPL-001\">FSPL<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 自由空间路径损耗：仅因距离与频率而衰减（球面扩散）。FSPL[dB] = 20·lg(d_km) + 20·lg(f_MHz) + 32.44；教材还给出<strong>6 dB 规则<\/strong>：距离每翻一倍约 +6 dB（p.52 及表 2.2，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"RF-MP-001\">多径<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 两条及以上路径的信号同时（或相差纳秒级）到达接收天线；时延扩展造成符号间干扰（ISI），接收端经 CRC 检错并触发重传；MIMO/DSP 则<strong>利用<\/strong>多径（教材 p.53–55、p.46，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"RF-NF-001\">噪声底<\/dfn> / <dfn data-term=\"RF-SNR-001\">SNR<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 噪声底=某信道上环境背景射频能量总电平（含非 802.11 源：微波炉、蓝牙等）；测量噪声底的正确工具是<strong>高质量便携频谱仪<\/strong>，AP 不是理想工具（教材 p.89、94，已核对正文）。SNR=信号/(噪声)（dB）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"RF-CCI-001\">同频干扰<\/dfn> / <dfn data-term=\"RF-ACI-001\">邻频干扰<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 同频干扰（CCI）：同信道上其他 802.11 发射机造成的介质争用/能量叠加；邻频干扰（ACI）：相邻信道能量泄漏造成的有效噪声抬升，通常比 CCI 更伤（教材 Ch6/Ch12 展开，本单元先建立概念）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"RF-FM-001\">衰落余量<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 接收电平高于接收灵敏度的部分；教材以 +25 dBi 抛物面链路为例给出完整逐项累加表（p.96，已核对正文）。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"principles\">\n    <h2>工作原理<\/h2>\n\n    <h3>1. 传播行为速查<\/h3>\n    <div style=\"overflow-x:auto\">\n    <svg viewBox=\"0 0 720 210\" style=\"min-width:560px;width:100%;height:auto\" role=\"img\" aria-label=\"五种射频传播行为示意\">\n      <g font-size=\"12\">\n        <rect x=\"250\" y=\"20\" width=\"16\" height=\"80\" fill=\"var(--warn-soft)\" stroke=\"var(--warn)\"/>\n        <text x=\"258\" y=\"14\" text-anchor=\"middle\" fill=\"var(--warn)\">吸收（墙）<\/text>\n        <line x1=\"120\" y1=\"60\" x2=\"248\" y2=\"60\" stroke=\"var(--accent)\" stroke-width=\"1.6\"/>\n        <text x=\"120\" y=\"48\" fill=\"var(--accent)\">入射波<\/text>\n        <rect x=\"470\" y=\"20\" width=\"16\" height=\"80\" fill=\"var(--bg-soft)\" stroke=\"var(--border)\"/>\n        <line x1=\"486\" y1=\"60\" x2=\"600\" y2=\"20\" stroke=\"var(--ok)\" stroke-width=\"1.6\"/>\n        <line x1=\"486\" y1=\"60\" x2=\"600\" y2=\"100\" stroke=\"var(--ok)\" stroke-width=\"1.6\"/>\n        <text x=\"560\" y=\"14\" fill=\"var(--ok)\">反射<\/text>\n        <circle cx=\"400\" cy=\"60\" r=\"9\" fill=\"var(--bg-soft)\" stroke=\"var(--border)\"/>\n        <line x1=\"409\" y1=\"60\" x2=\"452\" y2=\"42\" stroke=\"var(--text-faint)\" stroke-width=\"1.2\"/>\n        <line x1=\"409\" y1=\"60\" x2=\"452\" y2=\"60\" stroke=\"var(--text-faint)\" stroke-width=\"1.2\"/>\n        <line x1=\"409\" y1=\"60\" x2=\"452\" y2=\"78\" stroke=\"var(--text-faint)\" stroke-width=\"1.2\"/>\n        <text x=\"430\" y=\"34\" fill=\"var(--text-faint)\">散射（粗糙面）<\/text>\n        <rect x=\"120\" y=\"130\" width=\"70\" height=\"10\" fill=\"var(--bg-soft)\" stroke=\"var(--border)\"/>\n        <path d=\"M 60 168 Q 150 118 240 168\" fill=\"none\" stroke=\"var(--ok)\" stroke-width=\"1.5\"/>\n        <text x=\"150\" y=\"160\" fill=\"var(--ok)\">绕射（绕过边缘）<\/text>\n        <path d=\"M 330 168 C 420 150 520 168 600 130\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/>\n        <text x=\"430\" y=\"160\" fill=\"var(--accent)\">折射（穿介质弯折）<\/text>\n      <\/g>\n    <\/svg>\n    <\/div>\n    <p style=\"font-size:13px;color:var(--text-soft)\">原创示意图（非原书插图）。<\/p>\n\n    <h3>2. FSPL 的直觉<\/h3>\n    <p>频率翻倍或距离翻倍，都约 +6 dB。由此可得一条工程经验：5 GHz 的 FSPL 在同距离下比 2.4 GHz 大约 7–8 dB——这是\"5 GHz 覆盖小于 2.4 GHz\"的重要成因之一（但不是全部：接收灵敏度、天线增益也在起作用）。用下方计算器亲手验证。<\/p>\n\n    <h3>3. 多径与信噪比<\/h3>\n    <ul>\n      <li><strong>害<\/strong>：时延扩展 → 符号间干扰（ISI）→ CRC 校验失败 → 重传；反相叠加 → 深衰落；<\/li>\n      <li><strong>利<\/strong>：802.11n 起 MIMO 用多天线与 DSP 把多径变成并行数据通道（教材 p.46，单元 10/11 展开）；<\/li>\n      <li><strong>测量<\/strong>：噪声底要用频谱仪量（教材 p.94）；SNR = 接收电平 − 噪声底；有同频干扰时真正决定性能的是 SINR = 信号/(干扰+噪声)。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"diagrams\">\n    <h2>图解与动画<\/h2>\n    <p>多径相位叠加的动态演示见下方实验（multipath-sum）：拖动相位差，观察同相增强与反相抵消。<\/p>\n  <\/section>\n\n  <section id=\"lab\">\n    <h2>交互实验<\/h2>\n    <div data-lab=\"fspl-calc\"><\/div>\n    <div data-lab=\"multipath-sum\"><\/div>\n  <\/section>\n\n  <section id=\"case\">\n    <h2>工程案例：一墙之隔的带宽减半<\/h2>\n    <p>某仓库在同一信道上部署了两台 AP，中间一道混凝土墙。墙后客户端 RSSI 从 −50 掉到 −62（穿墙损耗），且墙把两个 AP 的信号隔离得不够彻底，彼此仍互相同步对方的数据帧——同频干扰叠加低 SNR，实测吞吐掉一半。处置：把两台 AP 调到不同信道（1/6），让\"墙\"承担部分隔离并用信道复用消灭 CCI（单元 13 展开信道规划）。<\/p>\n    <div class=\"callout warn\"><span class=\"co-t\">注意<\/span>案例数值为工程示例；实际墙体衰减随材质/频率差异很大，应现场实测（教材 p.51 的建材衰减表是 2.4 GHz 参考值）。<\/div>\n  <\/section>\n\n  <section id=\"pitfalls\">\n    <h2>易错点与概念辨析<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:250px\">易错说法<\/th><th>辨析<\/th><\/tr>\n      <tr><td>\"FSPL 是能量被空气吸收了\"<\/td><td>FSPL 是球面扩散效应，没有能量转化；吸收是另一回事（能量转热）。<\/td><\/tr>\n      <tr><td>\"SNR 和 SINR 差不多\"<\/td><td>同频部署下干扰可能远高于噪声，SINR 才是决定性指标；两者可能相差十几 dB。<\/td><\/tr>\n      <tr><td>\"绕射和折射是一回事\"<\/td><td>绕射=绕过障碍物边缘；折射=穿过介质时弯折（教材 p.48 特别提醒不要混淆，已核对正文）。<\/td><\/tr>\n      <tr><td>\"用 AP 就能精确量噪声底\"<\/td><td>教材 p.94：正确工具是高质量便携频谱仪；AP 的噪声底读数仅供参考（已核对正文）。<\/td><\/tr>\n      <tr><td>\"多径只有坏处\"<\/td><td>对单天线系统是灾难（ISI/衰落），对 MIMO 是增益来源（教材 p.46）。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"summary\">\n    <h2>知识总结<\/h2>\n    <ul>\n      <li>五种行为：吸收/反射/散射/折射/绕射；常见建材衰减 −2 ~ −10 dB（2.4 GHz 参考表）；<\/li>\n      <li>FSPL = 20lg d + 20lg f + 32.44；6 dB 规则；频率更高 → 同距损耗更大；<\/li>\n      <li>多径：ISI 与深衰落是害，MIMO 是利；CRC 检错 + 重传兜底；<\/li>\n      <li>噪声底用频谱仪测；SNR=信号−噪声底；有干扰看 SINR；<\/li>\n      <li>链路预算逐项累加；衰落余量 = 接收电平 − 灵敏度（单元 04 亲手算）。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"quiz\">\n    <h2>单元测验<\/h2>\n    <div data-quiz=\"03\"><\/div>\n  <\/section>\n\n  <section id=\"mapping\">\n    <h2>教材章节映射<\/h2>\n    <table class=\"data\">\n      <tr><th>来源<\/th><th>对应位置<\/th><th>状态<\/th><\/tr>\n      <tr><td>CWNA 4th Ed<\/td><td>第 2 章 §Radio Frequency Behaviors（书页 42–56）；第 3 章 §RF Mathematics（书页 89–97）<\/td><td><span class=\"badge verified\">已核实（正文节选已读：p.43–48、51–53、55、89、94、96）<\/span><\/td><\/tr>\n      <tr><td>Sybex 6th Ed<\/td><td>Ch3 / Ch4 / Ch15（章题级）<\/td><td><span class=\"badge unverified\">仅目录可核<\/span><\/td><\/tr>\n      <tr><td>CWNA-110 考试域<\/td><td>Radio Frequency (RF) Technologies（D1）<\/td><td><span class=\"badge verified\">已核实<\/span><\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"sources\">\n    <h2>标准与官方来源<\/h2>\n    <ul>\n      <li><strong>S1-1<\/strong> CWNA 4th Ed Ch2/Ch3（引用页已逐页核对）【一手】<\/li>\n      <li><strong>S4-2<\/strong> CWNA-110 考试目标 D1 域【已核实】<\/li>\n      <li>FSPL 公式为通用工程定义，与教材一致（教材另给 6 dB 规则）。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"reading\">\n    <h2>延伸阅读<\/h2>\n    <ul>\n      <li>教材 p.47：室外桥接的 k 因子与大气折射；<\/li>\n      <li>教材 p.51 表：2.4 GHz 常见建材衰减参考值；<\/li>\n      <li>下一站：单元 04——把能量\"摆\"向该去的方向（天线与链路预算）。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"audit\">\n    <h2>本单元审核结果（摘要）<\/h2>\n    <p style=\"font-size:14px\">术语 14 条对照术语库<span class=\"badge verified\">已核实<\/span>；五种行为/FSPL/多径/噪声底论断逐条对照教材正文<span class=\"badge verified\">已核实<\/span>；FSPL 算例复核（50 m@2.4G→60.2 dB 等）<span class=\"badge verified\">已核实<\/span>。详见 <code>docs/audits/unit-03-audit.md<\/code>。<\/p>\n  <\/section>\n<\/article>\n","unit-04":"<article data-unit=\"04\">\n  <h1>单元 04 · 天线、增益、极化、MIMO 基础和链路预算<\/h1>\n  <p class=\"unit-meta\">第一阶段 · 无线通信基础 ｜ 教材映射：CWNA 4th Ed 第 4 章（正文节选已核对）｜ 编制日期：2026-10-24<\/p>\n\n  <section id=\"goals\">\n    <h2>学习目标<\/h2>\n    <ol>\n      <li>读懂天线方位图（H 面）与俯仰图（E 面），并说出它们常被误读的原因；<\/li>\n      <li>区分全向、半定向、高定向（抛物面/栅格）、扇区四类天线及各自适用场景；<\/li>\n      <li>解释极化匹配的重要性与失配后果；<\/li>\n      <li>区分天线分集与空间复用（MIMO 的两种收益）；<\/li>\n      <li>独立编制完整链路预算并计算衰落余量。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"prereqs\">\n    <h2>前置知识<\/h2>\n    <div class=\"callout info\"><span class=\"co-t\">先修<\/span>单元 02（dBi/dBd、dBm）、单元 03（FSPL、衰落余量）。<\/div>\n  <\/section>\n\n  <section id=\"terms\">\n    <h2>核心术语<\/h2>\n    <div class=\"term-chips\">\n      <dfn data-term=\"RF-AG-001\">天线增益<\/dfn>\n      <dfn data-term=\"RF-BW-001\">波束宽度<\/dfn>\n      <dfn data-term=\"RF-POL-001\">极化<\/dfn>\n      <dfn data-term=\"ANT-OMNI-001\">全向天线<\/dfn>\n      <dfn data-term=\"ANT-SEMI-001\">半定向天线<\/dfn>\n      <dfn data-term=\"ANT-HIGHDIR-001\">高定向天线<\/dfn>\n      <dfn data-term=\"ANT-SECTOR-001\">扇区天线<\/dfn>\n      <dfn data-term=\"ANT-DIV-001\">天线分集<\/dfn>\n      <dfn data-term=\"SS-MIMO-001\">MIMO<\/dfn>\n      <dfn data-term=\"RF-VSWR-001\">VSWR<\/dfn>\n      <dfn data-term=\"RF-EIRP-001\">EIRP<\/dfn>\n      <dfn data-term=\"RF-IR-001\">有意辐射体<\/dfn>\n      <dfn data-term=\"RF-FZ-001\">菲涅尔区<\/dfn>\n      <dfn data-term=\"RF-LOS-001\">视距 LOS<\/dfn>\n    <\/div>\n  <\/section>\n\n  <section id=\"intuition\">\n    <h2>直观解释：增益不是\"放大\"，是\"捏灯罩\"<\/h2>\n    <p>无源天线没有电源、不会放大任何东西。它做的是<strong>重新分配<\/strong>：把本该均匀散向四面八方的能量，捏成你想要的形状——手电筒加聚光罩后\"更亮\"，不是因为灯泡变强，而是光被集中了（教材 p.69 正是用手电筒+透镜类比解释 EIRP，已核对正文）。代价是其他方向变暗：增益大的天线波束更窄，对安装指向更敏感（风吹偏一点，桥接链路就中断——教材 p.125）。<\/p>\n  <\/section>\n\n  <section id=\"formal\">\n    <h2>正式定义<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:170px\">概念<\/th><th>定义（分级标注）<\/th><\/tr>\n      <tr><td>方位图 / 俯仰图<\/td><td><span class=\"badge verified\">标准正式定义<\/span> 天线辐射包络在水平面（H 面/azimuth）与垂直面（E 面/elevation）的极坐标图；以 dB 标度绘制，<strong>常被误读<\/strong>——图上没有画出的方向并非\"零信号\"（教材 p.110–112，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"RF-BW-001\">波束宽度<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 增益下降 3 dB 点之间的角度范围（水平/垂直）（教材 p.114–116）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"ANT-OMNI-001\">全向天线<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 水平面 360° 均匀辐射、垂直面收窄的 antennas（教材 p.118–121；办公室/仓库主力）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"ANT-SEMI-001\">半定向<\/dfn> / <dfn data-term=\"ANT-HIGHDIR-001\">高定向<\/dfn> / <dfn data-term=\"ANT-SECTOR-001\">扇区<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 半定向（板状/Yagi）：短中距离、定向覆盖；高定向（抛物面碟/栅格）：严格点对点桥接、最窄波束、受风载影响大；扇区：把若干半定向拼成扇面覆盖（教材 p.121–127，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"RF-POL-001\">极化<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 电场振荡方向；收发极化须匹配，失配造成显著损耗——教材称之为\"鲜为人知却极其重要\"（p.135，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"ANT-DIV-001\">天线分集<\/dfn> / <dfn data-term=\"SS-MIMO-001\">MIMO<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 分集：多天线接收同一信号、择优/合并，对抗多径衰落（接收信号常在 10⁻⁸ mW 量级，天线间微小差异就很重要，p.137）；MIMO：多收发链路在空间维度并行传输——空间复用提速率、波束成形提方向性（p.136–138；细节单元 10/11）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"RF-VSWR-001\">VSWR<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 电压驻波比：衡量馈线-天线阻抗匹配程度；失配使能量反射回发射机（教材 p.139–141；1.5:1 以内属良好——工程参考值）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"RF-IR-001\">有意辐射体<\/dfn> / <dfn data-term=\"RF-EIRP-001\">EIRP<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> IR：发射机+馈线（不含天线）的整体；EIRP = 发射功率 − 馈线损耗 + 天线增益，是监管上限的度量对象（教材 p.68–69）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"RF-LOS-001\">视距<\/dfn> / <dfn data-term=\"RF-FZ-001\">菲涅尔区<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 视觉 LOS ≠ 射频 LOS：桥接链路还要求<strong>第一菲涅尔区<\/strong>（围绕视距的最内层椭球）遮挡 ≤40% 左右（工程参考值），否则额外损耗；无遮挡链路还要考虑地球曲率凸起（教材 p.129–134，已核对正文）。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"principles\">\n    <h2>工作原理<\/h2>\n\n    <h3>1. 四类天线的形状（原创示意）<\/h3>\n    <div style=\"overflow-x:auto\">\n    <svg viewBox=\"0 0 720 240\" style=\"min-width:560px;width:100%;height:auto\" role=\"img\" aria-label=\"四类天线水平面覆盖示意\">\n      <g font-size=\"12\">\n        <circle cx=\"110\" cy=\"120\" r=\"70\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/>\n        <circle cx=\"110\" cy=\"120\" r=\"4\" fill=\"var(--text)\"/>\n        <text x=\"110\" y=\"215\" text-anchor=\"middle\" fill=\"var(--text)\">全向：水平 360°<\/text>\n        <path d=\"M 330 120 L 430 70 A 110 110 0 0 1 430 170 Z\" fill=\"var(--ok-soft)\" stroke=\"var(--ok)\"/>\n        <circle cx=\"330\" cy=\"120\" r=\"4\" fill=\"var(--text)\"/>\n        <text x=\"390\" y=\"215\" text-anchor=\"middle\" fill=\"var(--text)\">半定向/扇区：定向覆盖<\/text>\n        <path d=\"M 560 120 L 700 96 A 145 145 0 0 1 700 144 Z\" fill=\"var(--warn-soft)\" stroke=\"var(--warn)\"/>\n        <circle cx=\"560\" cy=\"120\" r=\"4\" fill=\"var(--text)\"/>\n        <text x=\"630\" y=\"215\" text-anchor=\"middle\" fill=\"var(--text)\">高定向：极窄波束（点对点）<\/text>\n      <\/g>\n    <\/svg>\n    <\/div>\n    <p style=\"font-size:13px;color:var(--text-soft)\">原创示意图（非原书插图），仅表达形状概念，不代表具体型号方向图。<\/p>\n\n    <h3>2. 链路预算：一串加减法<\/h3>\n    <div class=\"formula\">\n      <div class=\"f-main\">接收电平 = 发射功率 − 发端馈损 + 发端天线增益 − FSPL + 收端天线增益 − 收端馈损<\/div>\n      <div class=\"f-main\">EIRP = 发射功率 − 发端馈损 + 发端天线增益　；　余量 = 接收电平 − 接收灵敏度<\/div>\n      <div class=\"f-defs\">教材 p.96 给出的逐项累加示例：抛物面 +25 dBi → 50 英尺 LMR-600 馈线 −2.21 dB → 避雷器 −0.1 dB → 10 英尺馈线 −0.44 dB → 接收 −65.5 dBm，灵敏度 −80 dBm → 余量 14.5 dB（已核对正文）。用下方实验亲手调参。<\/div>\n    <\/div>\n\n    <h3>3. 极化与安装<\/h3>\n    <ul>\n      <li>收发天线极化方向一致（垂直对垂直、水平对水平）；斜装板状天线要记下它的极化角；<\/li>\n      <li>馈线越长损耗越大（LMR-600 约 0.44 dB/10 英尺@2.4 GHz 量级，以厂商数据为准<span class=\"badge vendor\">厂商数据<\/span>）；接头/避雷器也有损耗——预算要逐项计；<\/li>\n      <li>VSWR 失配 → 能量反射回发射机，发热且降效。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"diagrams\">\n    <h2>图解<\/h2>\n    <p>覆盖形状示意见上文；链路预算的动态累加见下方实验。<\/p>\n  <\/section>\n\n  <section id=\"lab\">\n    <h2>交互实验<\/h2>\n    <div data-lab=\"link-budget\"><\/div>\n  <\/section>\n\n  <section id=\"case\">\n    <h2>工程案例：两栋楼 5 km 桥接的预算表<\/h2>\n    <p>需求：A/B 楼间 5 km 点对点 5.8 GHz 桥接。方案：两端 23 dBi 集成板状桥接设备（一体机，无外置馈线），发射 20 dBm（注意当地 EIRP 上限——23+20=43 dBm EIRP 是否合规须查当地法规<span class=\"badge pending\">地区法规待核实<\/span>）。预算：EIRP 43 dBm − FSPL(5 km, 5.8 GHz ≈ 121.5 dB) + 23 dBi ≈ −55.5 dBm；灵敏度取 −74 dBm（高 MCS）→ 余量 18.5 dB。再核对<strong>第一菲涅尔区<\/strong>：中点半径 r≈4.33·√(d/f)（米，d 米 f GHz）≈ 4.33·√(5000/5.8) ≈ 127 m——路径中部 127 m 内不得有遮挡。<\/p>\n    <div class=\"callout warn\"><span class=\"co-t\">注意<\/span>本案例为教学示例；实施前须以现场勘测与当地监管数据为准（单元 13/16）。<\/div>\n  <\/section>\n\n  <section id=\"pitfalls\">\n    <h2>易错点与概念辨析<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:250px\">易错说法<\/th><th>辨析<\/th><\/tr>\n      <tr><td>\"天线增益高=信号被放大了\"<\/td><td>无源天线不会放大，只是重新分配能量方向（手电筒类比，教材 p.69）。<\/td><\/tr>\n      <tr><td>\"4×4 MIMO=4 条空间流\"<\/td><td>记法 4×4:3 表示 4 发 4 收 3 流；流数≤min(收,发)，天线数≠流数。<\/td><\/tr>\n      <tr><td>\"方向图上没画的方向=没信号\"<\/td><td>极坐标图是 dB 标度且常被误读，未画出≠零（教材 p.112）。<\/td><\/tr>\n      <tr><td>\"桥接链路只要看得见就行\"<\/td><td>还需第一菲涅尔区 60% 无遮挡；且视觉 LOS≠射频 LOS。<\/td><\/tr>\n      <tr><td>\"增益越大越好\"<\/td><td>波束越窄、指向越敏感（风载）；覆盖设计要形状匹配场景。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"summary\">\n    <h2>知识总结<\/h2>\n    <ul>\n      <li>方向图分 H/E 两面，dB 标度易误读；波束宽度=3 dB 下降角；<\/li>\n      <li>四类天线：全向（360°）/半定向/高定向（点对点）/扇区（拼扇面）；<\/li>\n      <li>极化必须收发匹配；分集对抗衰落，空间复用提高速率（MIMO 细节在单元 10/11）；<\/li>\n      <li>EIRP=功率−馈损+增益（监管度量对象）；链路预算逐项累加；<\/li>\n      <li>余量=接收电平−灵敏度；桥接还要看菲涅尔区遮挡（≤40% 为工程参考）。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"quiz\">\n    <h2>单元测验<\/h2>\n    <div data-quiz=\"04\"><\/div>\n  <\/section>\n\n  <section id=\"mapping\">\n    <h2>教材章节映射<\/h2>\n    <table class=\"data\">\n      <tr><th>来源<\/th><th>对应位置<\/th><th>状态<\/th><\/tr>\n      <tr><td>CWNA 4th Ed<\/td><td>第 4 章全书（书页 107–160）<\/td><td><span class=\"badge verified\">已核实（正文节选已读：p.110–114、118、121、123、125、129–130、135–137、139）<\/span><\/td><\/tr>\n      <tr><td>Sybex 6th Ed<\/td><td>Ch5（章题级）<\/td><td><span class=\"badge unverified\">仅目录可核<\/span><\/td><\/tr>\n      <tr><td>CWNA-110 考试域<\/td><td>Radio Frequency (RF) Technologies（D1）<\/td><td><span class=\"badge verified\">已核实<\/span><\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"sources\">\n    <h2>标准与官方来源<\/h2>\n    <ul>\n      <li><strong>S1-1<\/strong> CWNA 4th Ed Ch4（引用页已逐页核对）【一手】<\/li>\n      <li><strong>S4-2<\/strong> CWNA-110 考试目标 D1 域【已核实】<\/li>\n      <li>菲涅尔区遮挡 40%、VSWR 1.5:1 为工程实践参考值<span class=\"badge vendor\">工程实践<\/span>。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"reading\">\n    <h2>延伸阅读<\/h2>\n    <ul>\n      <li>教材 p.147–152：馈线/接头/功分器/避雷器等安装附件与损耗；<\/li>\n      <li>下一站：单元 05——带着这些 RF 直觉进入 802.11 拓扑与身份体系。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"audit\">\n    <h2>本单元审核结果（摘要）<\/h2>\n    <p style=\"font-size:14px\">术语 14 条对照术语库<span class=\"badge verified\">已核实<\/span>；天线类型/极化/分集/菲涅尔论断逐条对照教材正文<span class=\"badge verified\">已核实<\/span>；链路预算算例复核（EIRP 43 dBm、FSPL 121.5 dB、余量 18.5 dB）<span class=\"badge verified\">已核实<\/span>；地区 EIRP 法规<span class=\"badge pending\">待核实<\/span>。详见 <code>docs/audits/unit-04-audit.md<\/code>。<\/p>\n  <\/section>\n<\/article>\n","unit-05":"<article data-unit=\"05\">\n  <h1>单元 05 · STA、AP、BSS、ESS、SSID、BSSID 与无线网络拓扑<\/h1>\n  <p class=\"unit-meta\">阶段二 · 802.11 协议核心 ｜ 教材映射：CWNA 4th Ed 第 7 章（正文节选已核对）｜ 编制日期：2026-10-24<\/p>\n\n  <section id=\"goals\">\n    <h2>学习目标<\/h2>\n    <ol>\n      <li>准确区分 <strong>SSID / BSSID / STA MAC / AP 无线口 MAC / AP 有线口 MAC / IP<\/strong> 六种身份；<\/li>\n      <li>定义 BSS、BSA、IBSS、MBSS、ESS 与分布式系统（DS），并说明它们是逻辑集合还是物理覆盖；<\/li>\n      <li>解释为什么\"一个 AP\"可以有多个 BSS（多射频/MBSSID）；<\/li>\n      <li>说出 802.11 与 WWAN/WMAN/WPAN 的边界；<\/li>\n      <li>解释 Mesh（MBSS）为什么是二层路由、HWMP 是什么。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"prereqs\">\n    <h2>前置知识<\/h2>\n    <div class=\"callout info\"><span class=\"co-t\">先修<\/span>单元 01（组织体系）。本单元是单元 06 接入流程的\"舞台\"。<\/div>\n  <\/section>\n\n  <section id=\"terms\">\n    <h2>核心术语<\/h2>\n    <div class=\"term-chips\">\n      <dfn data-term=\"TOPO-STA-001\">STA<\/dfn>\n      <dfn data-term=\"TOPO-AP-001\">AP<\/dfn>\n      <dfn data-term=\"TOPO-BSS-001\">BSS<\/dfn>\n      <dfn data-term=\"TOPO-BSSID-001\">BSSID<\/dfn>\n      <dfn data-term=\"TOPO-SSID-001\">SSID<\/dfn>\n      <dfn data-term=\"TOPO-ESS-001\">ESS<\/dfn>\n      <dfn data-term=\"TOPO-IBSS-001\">IBSS<\/dfn>\n      <dfn data-term=\"TOPO-DS-001\">分布式系统 DS<\/dfn>\n      <dfn data-term=\"TOPO-MBSS-001\">MBSS（Mesh）<\/dfn>\n    <\/div>\n  <\/section>\n\n  <section id=\"intuition\">\n    <h2>直观解释：细胞、中枢与公路<\/h2>\n    <p>把无线网络想成一个蜂巢：一台 AP 的射频连同它麾下的客户端构成一个\"细胞\"（<dfn data-term=\"TOPO-BSS-001\">BSS<\/dfn>），细胞有围墙（信号覆盖范围 = <strong>BSA<\/strong>）和门牌号（<dfn data-term=\"TOPO-BSSID-001\">BSSID<\/dfn>）。若干细胞用地下公路（<dfn data-term=\"TOPO-DS-001\">分布式系统<\/dfn>）连成一片城区（<dfn data-term=\"TOPO-ESS-001\">ESS<\/dfn>），整个城区挂同一块招牌（<dfn data-term=\"TOPO-SSID-001\">SSID<\/dfn>）。没有 AP、几台设备自发围成一圈，是\"野营帐篷\"（<dfn data-term=\"TOPO-IBSS-001\">IBSS<\/dfn>）；AP 之间改用无线互联而不是网线，是\"蜂窝之间搭飞线\"（WDS/Mesh）。<\/p>\n  <\/section>\n\n  <section id=\"formal\">\n    <h2>正式定义<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:150px\">概念<\/th><th>定义（分级标注）<\/th><\/tr>\n      <tr><td>BSS / BSA<\/td><td><span class=\"badge verified\">标准正式定义<\/span> BSS=一台 AP 与其关联 STA 的逻辑集合（IBSS/MBSS 为另两类拓扑）；BSA=该 BSS 的物理覆盖区。BSS 是\"集合\"，BSA 是\"地盘\"（教材 Ch7，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"TOPO-BSSID-001\">BSSID<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> \"每个 BSS 的二层标识符——最常见情形即 AP 无线网络接口的 MAC 地址\"（教材 p.249 原文，已核对正文）。多射频 AP 有多个 BSSID；MBSSID 机制下另有规则<span class=\"badge pending\">条款待核<\/span>。<\/td><\/tr>\n      <tr><td><dfn data-term=\"TOPO-SSID-001\">SSID<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 标识 ESS/IBSS 的网络名（≤32 字节）；同一 ESS 的 AP 可共用。SSID 隐藏（cloaking）\"是标准未定义的极弱安全尝试\"（教材 p.248 原文，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"TOPO-ESS-001\">ESS<\/dfn> / <dfn data-term=\"TOPO-DS-001\">DS<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> DS 互连多个 BSS 构成 ESS；集成服务（IS）负责在 DS 与 802.11 侧之间搬运 MSDU（教材 p.243–244，已核对正文）。DS 的常见实现就是有线以太网（DSM）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"TOPO-IBSS-001\">IBSS<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 仅由客户端 STA 组成、无 AP 的独立拓扑（p.253，已核对正文）；Beacon 由成员 STA 轮流发送。<\/td><\/tr>\n      <tr><td><dfn data-term=\"TOPO-MBSS-001\">MBSS<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> Mesh BSS：AP 间经无线回程多跳互联；Mesh 路由是<strong>二层操作、基于 MAC 地址而非 IP<\/strong>，默认路径选择协议为 HWMP（教材 p.255，已核对正文）。<\/td><\/tr>\n      <tr><td>AP 的半双工本质<\/td><td><span class=\"badge verified\">标准正式定义<\/span> \"AP 是半双工设备，因为 RF 介质本身就是半双工的\"（教材 p.242 原文，已核对正文）——为单元 08 的 CSMA/CA 埋下伏笔。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"principles\">\n    <h2>工作原理：六种身份各就各位<\/h2>\n    <p>本单元最重要的能力是\"认人\"。总 Prompt 4.4 要求的第一组辨析——同一台 AP 身上至少挂着两套 MAC（无线口=常用 BSSID；有线口=管理身份），SSID 是连 AP 自己都不\"拥有\"的网络名，IP 是三层世界另行分配的地址——完整的交互式探查见下方\"交互实验\"节。<\/p>\n    <h3>拓扑家族速查<\/h3>\n    <table class=\"data\">\n      <tr><th>拓扑<\/th><th>组成<\/th><th>典型场景<\/th><\/tr>\n      <tr><td>基础设施 BSS<\/td><td>1 AP + ≥0 STA<\/td><td>家庭/企业主流<\/td><\/tr>\n      <tr><td>ESS<\/td><td>DS 互连的多个 BSS，共用 SSID<\/td><td>办公楼漫游（单元 06）<\/td><\/tr>\n      <tr><td>IBSS<\/td><td>纯 STA 直连<\/td><td>临时直连（与 WFA 的 Wi-Fi Direct 机制不同）<\/td><\/tr>\n      <tr><td>MBSS<\/td><td>Mesh AP + HWMP 二层路由<\/td><td>布线困难的园区/室外<\/td><\/tr>\n      <tr><td>WDS<\/td><td>AP 间四地址无线桥接（厂商语义，Figure 7.5）<\/td><td>老式无线中继/桥<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"diagrams\">\n    <h2>图解<\/h2>\n    <p>身份关系动态图见上方实验（topology-ids）；接入流程时序动画在单元 06。<\/p>\n  <\/section>\n\n  <section id=\"lab\">\n    <h2>交互实验<\/h2>\n    <div data-lab=\"topology-ids\"><\/div>\n  <\/section>\n\n  <section id=\"case\">\n    <h2>工程案例：抓包里四个 MAC 地址把人看晕<\/h2>\n    <p>新同事在 AP 与交换机之间的镜像口抓包，看到同一帧里出现 4 个 MAC（RA/TA/DA/SA），报障\"有陌生设备入侵\"。用本单元知识拆解：那是 WDS/中继链路上的四地址帧（教材 Figure 7.5 正是这样一张帧头实例）——RA/TA 是两台桥接 AP 的射频地址，DA/SA 才是真正的收/发终端。处置：按 To DS/From DS 位判定帧方向，再按角色对应身份（单元 07 的解码器实验）；确认链路两端确属公司的桥接设备后关闭告警。<\/p>\n  <\/section>\n\n  <section id=\"pitfalls\">\n    <h2>易错点与概念辨析<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:250px\">易错说法<\/th><th>辨析<\/th><\/tr>\n      <tr><td>\"SSID 藏起来更安全\"<\/td><td>SSID 隐藏是标准未定义的弱混淆，主动扫描用通配符照样发现（教材 p.248，单元 06 动画 2）。<\/td><\/tr>\n      <tr><td>\"BSSID=AP 的 IP 或管理 MAC\"<\/td><td>BSSID 是二层无线身份（通常=射频 MAC）；AP 有线口 MAC/管理 IP 是另一套。<\/td><\/tr>\n      <tr><td>\"一个 AP 只能有一个 BSS\"<\/td><td>双频 AP 每射频一个 BSS（2.4G/5G 各一）；MBSSID 还能一射频多 BSS（待核）。<\/td><\/tr>\n      <tr><td>\"Mesh 路由就是 IP 路由\"<\/td><td>MBSS 路由是二层、按 MAC 转发，默认协议 HWMP（教材 p.255）。<\/td><\/tr>\n      <tr><td>\"BSS 是一片覆盖区域\"<\/td><td>那是 BSA；BSS 是设备集合。ESS 由 DS 互连 BSS 而成。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"summary\">\n    <h2>知识总结<\/h2>\n    <ul>\n      <li>BSS=AP+STA 集合；BSA=覆盖区；BSSID=射频二层身份；SSID=网络名（可共用）；<\/li>\n      <li>ESS=DS 互连的多个 BSS；IS 负责 DS↔802.11 之间搬运 MSDU；<\/li>\n      <li>IBSS 无 AP、Beacon 轮流发；MBSS 二层 Mesh、HWMP；WDS=四地址无线桥接；<\/li>\n      <li>AP 半双工（RF 介质半双工）；SSID 隐藏无效；<\/li>\n      <li>六身份辨析：SSID/BSSID/STA MAC/AP 无线口 MAC/AP 有线口 MAC/IP。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"quiz\">\n    <h2>单元测验<\/h2>\n    <div data-quiz=\"05\"><\/div>\n  <\/section>\n\n  <section id=\"mapping\">\n    <h2>教材章节映射<\/h2>\n    <table class=\"data\">\n      <tr><th>来源<\/th><th>对应位置<\/th><th>状态<\/th><\/tr>\n      <tr><td>CWNA 4th Ed<\/td><td>第 7 章 §802.11 Topologies（书页 241–257）<\/td><td><span class=\"badge verified\">已核实（正文节选已读：p.238/242/243/244/247/248/249/250/253/255）<\/span><\/td><\/tr>\n      <tr><td>Sybex 6th Ed<\/td><td>Ch7（章题级）<\/td><td><span class=\"badge unverified\">仅目录可核<\/span><\/td><\/tr>\n      <tr><td>CWNA-110 考试域<\/td><td>WLAN Protocols and Devices（D3）<\/td><td><span class=\"badge verified\">已核实<\/span><\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"sources\">\n    <h2>标准与官方来源<\/h2>\n    <ul>\n      <li><strong>S1-1<\/strong> CWNA 4th Ed Ch7（引用页已逐页核对）【一手】<\/li>\n      <li><strong>S2-1<\/strong> IEEE 802.11-2024（BSSID/MBSSID 条款待核）【编号已核实】<\/li>\n      <li><strong>S4-2<\/strong> CWNA-110 考试目标 D3 域【已核实】<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"reading\">\n    <h2>延伸阅读<\/h2>\n    <ul>\n      <li>教材 p.244：DSS（分布式系统服务）细节属 CWAP 级内容；<\/li>\n      <li>802.11bh-2024（MAC 随机化）与隐私：延伸至单元 05 的 STA 身份讨论；<\/li>\n      <li>下一站：单元 06（已交付）——在这些拓扑里走一遍接入流程。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"audit\">\n    <h2>本单元审核结果（摘要）<\/h2>\n    <p style=\"font-size:14px\">术语 9 条对照术语库<span class=\"badge verified\">已核实<\/span>；BSSID/IS/IBSS/MBSS/HWMP/半双工论断逐条对照教材正文<span class=\"badge verified\">已核实<\/span>；MBSSID 条款<span class=\"badge pending\">待核<\/span>。详见 <code>docs/audits/unit-05-audit.md<\/code>。<\/p>\n  <\/section>\n<\/article>\n","unit-06":"<article data-unit=\"06\">\n  <h1>单元 06 · 扫描、Beacon、Probe、认证、关联和漫游<\/h1>\n  <p class=\"unit-meta\">阶段二 · 802.11 协议核心 ｜ 原型单元（阶段 C）｜ 教材映射：CWNA 4th Ed 第 9 章（正文节选已核对）｜ 编制日期：2026-10-24<\/p>\n\n  <section id=\"goals\">\n    <h2>学习目标<\/h2>\n    <p>完成本单元后，你应当能够：<\/p>\n    <ol>\n      <li>用自己的话区分<strong>被动扫描<\/strong>与<strong>主动扫描<\/strong>，并说出两者各自发送/接收的帧；<\/li>\n      <li>按正确顺序排列<strong>扫描 → 认证 → 关联 → 密钥协商 → 获取 IP<\/strong>五个阶段，并指出哪些属于 802.11、哪些不属于；<\/li>\n      <li>解释<strong>开放系统认证<\/strong>与 <dfn data-term=\"SEC-SAE-001\">SAE<\/dfn> 的本质区别，纠正\"认证成功=验证过口令\"的误区；<\/li>\n      <li>描述 802.11 站点的 <strong>State 1/2/3<\/strong> 状态机及触发各状态迁移的帧；<\/li>\n      <li>说明<strong>漫游<\/strong>在标准中的定位：决策属厂商实现，机制是携带原 AP 地址的重新关联。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"prereqs\">\n    <h2>前置知识<\/h2>\n    <div class=\"callout info\">\n      <span class=\"co-t\">建议先完成<\/span>\n      <a href=\"#/unit/05\">单元 05（STA、AP、BSS、ESS、SSID、BSSID）<\/a>——本单元所有流程都发生在\"AP 的 BSS\"这一语境中；\n      另需 <a href=\"#/unit/02\">单元 02<\/a> 的 dBm/RSSI 概念（用于漫游实验）。\n    <\/div>\n    <p>一句话回顾：BSSID 标识一个 AP 的一台射频（一个 BSS），SSID 是网络的名字，ESS 由分布式系统互连的多个 BSS 组成、可共用同一 SSID。<\/p>\n  <\/section>\n\n  <section id=\"terms\">\n    <h2>核心术语<\/h2>\n    <p>点击术语查看完整定义（来源与核查状态见术语库）：<\/p>\n    <div class=\"term-chips\">\n      <dfn data-term=\"NET-SCAN-001\">被动/主动扫描<\/dfn>\n      <dfn data-term=\"MAC-BEACON-001\">信标帧 Beacon<\/dfn>\n      <dfn data-term=\"NET-AUTH-001\">认证（802.11）<\/dfn>\n      <dfn data-term=\"SEC-SAE-001\">SAE<\/dfn>\n      <dfn data-term=\"NET-ASSOC-001\">关联 / 重新关联<\/dfn>\n      <dfn data-term=\"NET-ROAM-001\">漫游<\/dfn>\n      <dfn data-term=\"TOPO-BSSID-001\">BSSID<\/dfn>\n      <dfn data-term=\"TOPO-SSID-001\">SSID<\/dfn>\n    <\/div>\n  <\/section>\n\n  <section id=\"intuition\">\n    <h2>直观解释：这套流程为什么长这样<\/h2>\n    <p>把一台新笔记本带进陌生的办公楼，它面对的问题依次是：<strong>这里有哪些网络？<\/strong>（发现）→ <strong>凭什么让我进？<\/strong>（准入）→ <strong>我在这个网络里是谁？<\/strong>（注册）。802.11 用三个阶段回答这三个问题：<dfn data-term=\"NET-SCAN-001\">扫描<\/dfn>负责发现，<dfn data-term=\"NET-AUTH-001\">认证<\/dfn>负责准入的第一道门，<dfn data-term=\"NET-ASSOC-001\">关联<\/dfn>负责把你注册为某个 BSS 的正式成员并分配编号（AID）。无线环境比\"插上网线\"多了一步，恰恰是因为介质是开放的：AP 的信号人人可收，所以协议必须显式地走过\"发现—准入—注册\"这三道关卡，而不像以太网那样插上即通。<\/p>\n    <p>教学类比（<strong>仅帮助记忆，不替代正式定义<\/strong>）：扫描像\"环顾有哪些教室\"，认证像\"在门口出示资格\"，关联像\"登记入座拿到座位号\"。类比到此为止——正式机制见下一节；特别提醒：把认证说成\"设备互相打招呼\"，会把开放系统（无校验）与 SAE（真口令认证）混为一谈。<\/p>\n  <\/section>\n\n  <section id=\"formal\">\n    <h2>正式定义<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:120px\">概念<\/th><th>定义（分级标注）<\/th><\/tr>\n      <tr><td><strong>被动扫描<\/strong><br><span class=\"badge verified\">标准机制<\/span><\/td><td>STA 逐信道侦听 AP 周期广播的 <dfn data-term=\"MAC-BEACON-001\">Beacon<\/dfn>（含 SSID、BSSID、能力信息、支持速率、TSF 时间戳、RSN 信息等），据此发现网络。STA 不发送任何帧。（教材 p.293–294，已核对正文）<\/td><\/tr>\n      <tr><td><strong>主动扫描<\/strong><br><span class=\"badge verified\">标准机制<\/span><\/td><td>STA 逐信道广播 <strong>Probe Request<\/strong>（可携目标 SSID，或以通配符/空 SSID 询问全部网络），匹配的 AP 以 <strong>Probe Response<\/strong> 应答，内容与 Beacon 基本一致。（教材 p.295–296，已核对正文）<\/td><\/tr>\n      <tr><td><strong>认证<\/strong><br>（802.11 链路层）<br><span class=\"badge verified\">标准机制<\/span><\/td><td>接入 BSS 的第一步。历史算法有<strong>开放系统<\/strong>（两消息交换，不携带也不校验任何凭据）与<strong>共享密钥<\/strong>（WEP 挑战-应答，已被破解、弃用）；现代受保护网络中 WPA3-Personal 使用 <dfn data-term=\"SEC-SAE-001\">SAE<\/dfn>：对等的口令认证密钥交换，产出 PMK。（教材 p.297–298；WFA WPA3 2018-06-25；SAE 条款级引用待核）<\/td><\/tr>\n      <tr><td><strong>关联<\/strong><br><span class=\"badge verified\">标准机制<\/span><\/td><td>接入 BSS 的第二步。STA 发送 Association Request（能力、SSID、支持速率、RSN 信息元素、侦听间隔等），AP 以 Association Response 应答（接受/拒绝），接受时分配<strong>关联 ID（AID）<\/strong>。STA 必须支持 AP 要求的全部基本速率。（教材 p.299–301，已核对正文）<\/td><\/tr>\n      <tr><td><strong>重新关联<\/strong><br><span class=\"badge verified\">标准机制<\/span><\/td><td>跨 BSS 迁移时，STA 向<strong>新 AP<\/strong> 发送 Reassociation Request，帧中携带<strong>原 AP 的 BSSID<\/strong>；新 AP 应答成功后分配新 AID，关联随之迁移。（教材 p.301–303，已核对正文）<\/td><\/tr>\n      <tr><td><strong>漫游<\/strong><br><span class=\"badge vendor\">厂商实现<\/span><\/td><td>客户端在 ESS 内更换 BSS 的整体过程。IEEE 802.11 <strong>不规定漫游决策算法<\/strong>（何时漫游、阈值多少均由驱动/厂商实现决定；802.11k/v 提供测量与管理辅助）；标准只定义其机制载体——重新关联。（教材 p.301、Ch12；决策算法待核对象为厂商文档）<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"principles\">\n    <h2>工作原理<\/h2>\n\n    <h3>1. 状态机：State 1 / 2 / 3<\/h3>\n    <p>802.11 用两个变量（认证状态 × 关联状态）描述站点的接入进度，形成三个合法状态。教材 p.300 把 State 3 表述为 \"authenticated and associated <em>(pending security mechanisms)<\/em>\"——注意这个括号：受保护网络中关联之后还有安全机制要做。<\/p>\n    <div style=\"overflow-x:auto\">\n    <svg viewBox=\"0 0 720 210\" style=\"min-width:620px;width:100%;height:auto\" role=\"img\" aria-label=\"802.11 站点状态机：State 1/2/3\">\n      <g font-size=\"13\" font-family=\"inherit\">\n        <rect x=\"20\" y=\"70\" width=\"180\" height=\"56\" rx=\"10\" fill=\"var(--bg-soft)\" stroke=\"var(--border)\"/>\n        <text x=\"110\" y=\"93\" text-anchor=\"middle\" font-weight=\"700\" fill=\"var(--text)\">State 1<\/text>\n        <text x=\"110\" y=\"113\" text-anchor=\"middle\" fill=\"var(--text-soft)\" font-size=\"12\">未认证 · 未关联<\/text>\n        <rect x=\"270\" y=\"70\" width=\"180\" height=\"56\" rx=\"10\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/>\n        <text x=\"360\" y=\"93\" text-anchor=\"middle\" font-weight=\"700\" fill=\"var(--accent-strong)\">State 2<\/text>\n        <text x=\"360\" y=\"113\" text-anchor=\"middle\" fill=\"var(--text-soft)\" font-size=\"12\">已认证 · 未关联<\/text>\n        <rect x=\"520\" y=\"70\" width=\"180\" height=\"56\" rx=\"10\" fill=\"var(--ok-soft)\" stroke=\"var(--ok)\"/>\n        <text x=\"610\" y=\"93\" text-anchor=\"middle\" font-weight=\"700\" fill=\"var(--ok)\">State 3<\/text>\n        <text x=\"610\" y=\"113\" text-anchor=\"middle\" fill=\"var(--text-soft)\" font-size=\"12\">已认证 · 已关联<\/text>\n        <line x1=\"200\" y1=\"82\" x2=\"262\" y2=\"82\" stroke=\"var(--accent)\" stroke-width=\"1.6\"/>\n        <polygon points=\"262,78 270,82 262,86\" fill=\"var(--accent)\"/>\n        <text x=\"231\" y=\"72\" text-anchor=\"middle\" fill=\"var(--accent-strong)\" font-size=\"11.5\">认证成功<\/text>\n        <line x1=\"450\" y1=\"82\" x2=\"512\" y2=\"82\" stroke=\"var(--ok)\" stroke-width=\"1.6\"/>\n        <polygon points=\"512,78 520,82 512,86\" fill=\"var(--ok)\"/>\n        <text x=\"481\" y=\"72\" text-anchor=\"middle\" fill=\"var(--ok)\" font-size=\"11.5\">关联/重新关联成功<\/text>\n        <line x1=\"512\" y1=\"118\" x2=\"450\" y2=\"118\" stroke=\"var(--warn)\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n        <polygon points=\"450,114 442,118 450,122\" fill=\"var(--warn)\"/>\n        <text x=\"481\" y=\"136\" text-anchor=\"middle\" fill=\"var(--warn)\" font-size=\"11.5\">解除关联 Disassociation<\/text>\n        <line x1=\"262\" y1=\"118\" x2=\"200\" y2=\"118\" stroke=\"var(--warn)\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n        <polygon points=\"200,114 192,118 200,122\" fill=\"var(--warn)\"/>\n        <text x=\"231\" y=\"136\" text-anchor=\"middle\" fill=\"var(--warn)\" font-size=\"11.5\">解除认证 Deauthentication<\/text>\n        <path d=\"M 610 126 C 560 190 180 190 115 130\" fill=\"none\" stroke=\"var(--bad)\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n        <polygon points=\"120,134 110,128 117,140\" fill=\"var(--bad)\"/>\n        <text x=\"362\" y=\"188\" text-anchor=\"middle\" fill=\"var(--bad)\" font-size=\"11.5\">解除认证（自动连带解除关联）<\/text>\n      <\/g>\n    <\/svg>\n    <\/div>\n    <p style=\"font-size:13px;color:var(--text-soft)\">图解依据：教材 p.300（Figure 9.6，已核对正文）；状态迁移由管理帧触发：认证帧（Auth）、关联帧（Assoc/Reassoc）、解除认证帧（Deauth，会自动连带解除关联）、解除关联帧（Disassoc）。<span class=\"badge simplified\">教学简化：省略 802.1X/FT 等特殊路径<\/span>。<span class=\"badge pending\">条款级引用待核（802.11-2024）<\/span><\/p>\n\n    <h3>2. 扫描：发现候选网络<\/h3>\n    <ul>\n      <li><strong>被动扫描<\/strong>：STA 逐信道侦听 Beacon。优点是不发帧、功耗低；缺点是发现速度受 Beacon 周期约束（常见默认约 100 TU ≈ 102.4 ms，<span class=\"badge vendor\">厂商默认值<\/span>）。<\/li>\n      <li><strong>主动扫描<\/strong>：STA 逐信道广播 Probe Request，匹配 AP 回 Probe Response。发现快、可控；代价是必须发帧。已关联的客户端也常每隔几秒\"离道\"扫描维护漫游候选列表——<strong>扫描频率属厂商专有实现<\/strong>（教材 p.296，已核对正文）。<\/li>\n      <li>两者可并存，STA 可任选或同时使用（教材 p.295）。探测请求不会跨信道传播，AP2 收不到信道 1 上的探测。<\/li>\n    <\/ul>\n\n    <h3>3. 认证 → 关联：进入 BSS<\/h3>\n    <ul>\n      <li>顺序不可颠倒：认证是第一步，关联是第二步（教材 p.297）。开放系统认证的两条消息不带任何凭据；\"准入\"在受保护网络中由后续的密钥协商（802.1X/SAE + 四次握手，单元 14）真正完成。<\/li>\n      <li>关联请求携带能力与速率等信息；AP 检查基本速率（客户端必须全部支持）后决定接受或拒绝，接受时分配 AID。<\/li>\n      <li>关联成功 ≠ 能上网：之后还需四次握手安装密钥（单元 14）与 DHCP 获取 IP（单元 15）。<\/li>\n    <\/ul>\n\n    <h3>4. 漫游：更换 BSS<\/h3>\n    <p>漂移出当前 BSS 的有效覆盖时，客户端按<strong>厂商实现的决策逻辑<\/strong>（阈值、候选列表、按需扫描等）寻找同 ESS 中更好的 BSS，然后通过<strong>重新关联<\/strong>完成迁移。重新关联请求携带原 AP 地址，新 AP 可据此请求上下文/缓存数据交接——但 <strong>AP 之间的通信方式不由 802.11 标准定义<\/strong>（教材 p.302–303 明言属私有实现；控制器/云架构在单元 12 展开）。若重新关联失败，客户端保留与原 AP 的连接。<\/p>\n  <\/section>\n\n  <section id=\"diagrams\">\n    <h2>图解与动画<\/h2>\n    <p>以下五段动画覆盖本单元全部流程。请使用\"下一步\"逐帧阅读旁白，再整体播放一遍。<span class=\"badge simplified\">教学简化模型<\/span>——每段动画的省略项见其底部\"教学简化说明\"。<\/p>\n\n    <div data-anim=\"passive-scan\"><\/div>\n    <div data-anim=\"active-scan\"><\/div>\n    <div data-anim=\"auth-open\"><\/div>\n    <div data-anim=\"auth-sae\"><\/div>\n    <div data-anim=\"roam\"><\/div>\n  <\/section>\n\n  <section id=\"lab\">\n    <h2>交互实验<\/h2>\n    <p>漫游的触发取决于信号衰减。下面的实验室用简化的路径损耗模型展示\"信号 → 决策\"的因果：把 STA 沿走廊从 AP1 移向 AP2，观察何时触发扫描、何时切换。<\/p>\n    <div data-lab=\"roam-rssi\"><\/div>\n    <div class=\"callout plain\">本实验为<strong>纯软件教学仿真<\/strong>，不代表真实无线硬件测量；参数与阈值均为教学/工程参考设定，出处见实验内\"实验假设与公式\"。<\/div>\n  <\/section>\n\n  <section id=\"case\">\n    <h2>工程案例：会议室尽头的视频会议卡顿<\/h2>\n    <p><strong>现象<\/strong>：某公司长走廊尽头会议室里，笔记本从工位走过来后视频会议反复卡顿掉线，重新连接 Wi-Fi 后恢复十几秒又断。<\/p>\n    <p><strong>排查思路<\/strong>（对应本单元知识）：<\/p>\n    <ol>\n      <li>在走廊取点测 RSSI：工位处 −45 dBm，会议室 −78 dBm——信号随距离衰减严重（回看单元 03 的路径损耗）。漫游触发了，但<strong>切换后仍无好目标<\/strong>：会议室是覆盖缝隙，不是\"漫游失败\"。<\/li>\n      <li>抓包（单元 16 展开）看时间线：出现成串 Reassociation Request，且目标在 AP1/AP2 间来回切换——典型的<strong>乒乓漫游<\/strong>（两 AP 信号在交界处接近、且无迟滞余量）。<\/li>\n      <li>对策：在走廊中点补充 AP/调整功率使交界处有清晰的优势 AP；启用厂商的漫游迟滞与 802.11k/v 辅助（延伸阅读）；确认两侧 AP 同属一个 ESS（同 SSID、同安全策略），否则 STA 会当作\"新网络\"而触发完整认证。<\/li>\n      <li>验证：复测走廊 RSSI 分布与漫游点，观察切换后是否仍低于 −70 dBm 量级的工程参考值。<\/li>\n    <\/ol>\n    <div class=\"callout warn\"><span class=\"co-t\">注意<\/span>案例中的 −70 dBm 量级为<strong>工程实践参考值<\/strong>，不是标准规定；具体阈值随厂商与环境而变。<\/div>\n  <\/section>\n\n  <section id=\"pitfalls\">\n    <h2>易错点与概念辨析<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:230px\">易错说法<\/th><th>辨析<\/th><\/tr>\n      <tr><td>\"SSID 和 BSSID 是一回事\"<\/td><td>SSID 是网络<strong>名字<\/strong>（≤32 字节，可被多个 AP 共用）；BSSID 是<strong>地址<\/strong>（48 位，标识一个 AP 的一台射频）。<\/td><\/tr>\n      <tr><td>\"认证成功=验证了我的密码\"<\/td><td>开放系统认证不携带、不校验任何凭据；真正的凭据校验在 SAE（WPA3-Personal）或 802.1X（企业）+ 四次握手阶段完成。<\/td><\/tr>\n      <tr><td>\"关联上了就该能上网\"<\/td><td>关联只是进入 State 3。RSN 网络还需四次握手（单元 14）与 DHCP（单元 15）。<\/td><\/tr>\n      <tr><td>\"漫游=先断开再重连\"<\/td><td>漫游的机制载体是<strong>重新关联<\/strong>；教材 p.303 明确：重新关联失败时客户端保留原连接。先 deauth 再连属于降级行为。<\/td><\/tr>\n      <tr><td>\"Beacon 里没有的安全信息，Probe Response 里也没有\"<\/td><td>Probe Response 携带与 Beacon 基本一致的信息（含 RSN IE），是主动扫描获取安全能力的主要途径。<\/td><\/tr>\n      <tr><td>\"漫游阈值 −70 dBm 是标准规定\"<\/td><td>标准不规定决策算法与阈值；一切阈值都是厂商实现或工程参考值。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"summary\">\n    <h2>知识总结<\/h2>\n    <ul>\n      <li><strong>发现<\/strong>：被动扫描（听 Beacon）/ 主动扫描（问 Probe）；两者可并用。<\/li>\n      <li><strong>准入<\/strong>：802.11 认证是状态门槛，不是凭据校验；开放系统无校验，SAE 才是真正的口令认证。<\/li>\n      <li><strong>注册<\/strong>：关联把 STA 变成 BSS 成员并分配 AID；基本速率必须全部支持。<\/li>\n      <li><strong>状态机<\/strong>：State 1（未认证未关联）→ State 2（已认证未关联）→ State 3（已关联，待安全机制）；Deauth 自动连带 Disassoc。<\/li>\n      <li><strong>漫游<\/strong>：决策在厂商，机制是携带原 AP 地址的重新关联；AP 间交接不受标准约束。<\/li>\n      <li><strong>诚实边界<\/strong>：关联成功 ≠ 有网；阈值 −67/−72 dBm 是工程参考；Beacon 间隔约 100 TU 是厂商默认。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"quiz\">\n    <h2>单元测验<\/h2>\n    <p>共 5 题（第 5 题多选，需全对）。答对 3 题及以上（≥60%）且通读全部小节，本单元自动标记完成。<\/p>\n    <div data-quiz=\"06\"><\/div>\n  <\/section>\n\n  <section id=\"mapping\">\n    <h2>教材章节映射<\/h2>\n    <table class=\"data\">\n      <tr><th>来源<\/th><th>对应位置<\/th><th>状态<\/th><\/tr>\n      <tr><td>CWNA 4th Ed（本地教材）<\/td><td>第 9 章 §Beacon Management Frame / Passive Scanning / Active Scanning / Authentication / Shared Key Authentication / Association / Authentication and Association States / Roaming（书页 293–303）<\/td><td><span class=\"badge verified\">已核实（正文节选已读）<\/span><\/td><\/tr>\n      <tr><td>CWNA 4th Ed（延伸）<\/td><td>第 12 章 §Roaming（漫游排障）；第 5 章 §Defunct Amendments（802.11F/IAPP 已撤销）<\/td><td><span class=\"badge pending\">目录已核，正文待精读<\/span><\/td><\/tr>\n      <tr><td>Sybex 6th Ed<\/td><td>Ch9 \"802.11 MAC\"（章题级）<\/td><td><span class=\"badge unverified\">仅目录可核（未持书）<\/span><\/td><\/tr>\n      <tr><td>CWNA-110 考试域<\/td><td>WLAN Protocols and Devices（D3）<\/td><td><span class=\"badge verified\">已核实（官方目标 PDF）<\/span><\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"sources\">\n    <h2>标准与官方来源<\/h2>\n    <ul>\n      <li><strong>S1-1<\/strong> CWNA Official Study Guide 4th Ed, Ch9 p.283–323（本单元正文引用页：p.293–303 已逐页核对）【一手】<\/li>\n      <li><strong>S2-1<\/strong> IEEE Std 802.11-2024（管理帧/认证/关联/状态机条款级引用待核）【编号已核实】<\/li>\n      <li><strong>S2-2<\/strong> IEEE Std 802.11ax-2021（6 GHz 场景下扫描行为不变；延伸阅读）【编号已核实】<\/li>\n      <li><strong>S3-5<\/strong> Wi-Fi Alliance：Wi-Fi CERTIFIED WPA3（2018-06-25，SAE 用于 Personal）【已核实】<\/li>\n      <li><strong>S4-2<\/strong> CWNA-110 考试目标（2026-09，域 3：WLAN Protocols and Devices）【已核实】<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"reading\">\n    <h2>延伸阅读<\/h2>\n    <ul>\n      <li><strong>802.11k/v/r 与漫游<\/strong>：测量报告（k）、BSS 过渡管理（v）、快速 BSS 切换 FT（r）——三者已并入 802.11-2024 整合版（编号已核实）；将在单元 06/14 延伸讨论（条款待核）。<\/li>\n      <li><strong>MAC 地址随机化<\/strong>：现代操作系统常以随机化 MAC 发送探测帧，影响指纹与定位；IEEE Std 802.11bh-2024 专门规范该行为（编号已核实）。<\/li>\n      <li><strong>按需扫描<\/strong>：只扫描上次连接记住的信道以缩短发现时间（厂商实现实践）。<\/li>\n      <li><strong>下一站<\/strong>：单元 07 拆开这些帧的头部字段；单元 14 讲四次握手与密钥层级；单元 15 讲 DHCP/ARP/DNS。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"audit\">\n    <h2>本单元审核结果（摘要）<\/h2>\n    <table class=\"data\">\n      <tr><th>项目<\/th><th>状态<\/th><th>说明<\/th><\/tr>\n      <tr><td>专业术语<\/td><td><span class=\"badge verified\">已核实<\/span><\/td><td>8 个核心术语全部对照 data/glossary.json；无新增冲突译名<\/td><\/tr>\n      <tr><td>英文全称与缩写<\/td><td><span class=\"badge verified\">已核实<\/span><\/td><td>首现处三件套（全称+缩写+译名）齐全<\/td><\/tr>\n      <tr><td>技术事实<\/td><td><span class=\"badge verified\">已核实<\/span><\/td><td>扫描/认证/关联/状态机/重新关联论断逐条对照教材 p.293–303 正文；WPA3 对照 WFA 官方页<\/td><\/tr>\n      <tr><td>标准版本<\/td><td><span class=\"badge pending\">待核实<\/span><\/td><td>所有 IEEE 条款级引用标注\"待核\"（802.11-2024 正文核对列入待办）<\/td><\/tr>\n      <tr><td>公式与单位<\/td><td><span class=\"badge verified\">已核实（实验）<\/span><\/td><td>路径损耗模型参数为教学设定并已在面板声明<\/td><\/tr>\n      <tr><td>图解与动画<\/td><td><span class=\"badge verified\">已测试<\/span><\/td><td>5 段动画经浏览器实测（播放/步进/旁白一致性）；简化项均在面板声明<\/td><\/tr>\n      <tr><td>测验与答案<\/td><td><span class=\"badge verified\">已核实<\/span><\/td><td>5 题答案逐项对照来源复检；多选计分规则已声明<\/td><\/tr>\n      <tr><td>交互功能<\/td><td><span class=\"badge verified\">已测试<\/span><\/td><td>导航/进度/测验/术语悬浮/实验滑杆/清除确认 实测通过（见 docs/audits/unit-06-audit.md）<\/td><\/tr>\n      <tr><td>来源映射<\/td><td><span class=\"badge verified\">完整<\/span><\/td><td>每条结论可回溯 S1-1/S2-1/S3-5/S4-2<\/td><\/tr>\n    <\/table>\n    <p style=\"font-size:13px;color:var(--text-faint)\">完整审核记录：docs/audits/unit-06-audit.md（按 docs/validation-report.md 模板填写）。<\/p>\n  <\/section>\n<\/article>\n","unit-07":"<article data-unit=\"07\">\n  <h1>单元 07 · 802.11 MAC 帧结构、地址字段与帧类型<\/h1>\n  <p class=\"unit-meta\">阶段二 · 802.11 协议核心 ｜ 教材映射：CWNA 4th Ed 第 7 章 Figure 7.5、第 9 章（正文节选已核对）｜ 编制日期：2026-10-24<\/p>\n\n  <section id=\"goals\">\n    <h2>学习目标<\/h2>\n    <ol>\n      <li>画出 MSDU → MPDU → PPDU 的封装链，并说出 MAC 头/FCS 各自的作用；<\/li>\n      <li>列举 Frame Control 的关键字段并解释 Retry 与序列控制如何丢弃重复帧；<\/li>\n      <li>给出 To DS/From DS 四种组合下 Addr1–4 的角色（RA/TA/DA/SA）；<\/li>\n      <li>区分管理帧/控制帧/数据帧并各举三例；<\/li>\n      <li>解释 802.3 与 802.11 帧在 AP 处如何转换。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"prereqs\">\n    <h2>前置知识<\/h2>\n    <div class=\"callout info\"><span class=\"co-t\">先修<\/span>单元 05（BSSID 等身份）、单元 06（帧交换时序）。本单元是单元 08/14/16 的地基。<\/div>\n  <\/section>\n\n  <section id=\"terms\">\n    <h2>核心术语<\/h2>\n    <div class=\"term-chips\">\n      <dfn data-term=\"NET-MSDU-001\">MSDU/MPDU/PPDU<\/dfn>\n      <dfn data-term=\"NET-FTYPE-001\">三类帧<\/dfn>\n      <dfn data-term=\"NET-FCTRL-001\">Frame Control<\/dfn>\n      <dfn data-term=\"NET-ADDR-001\">四地址字段 RA/TA/DA/SA<\/dfn>\n      <dfn data-term=\"NET-FCS-001\">FCS<\/dfn>\n      <dfn data-term=\"MAC-NAV-001\">NAV<\/dfn>\n      <dfn data-term=\"TOPO-BSSID-001\">BSSID<\/dfn>\n    <\/div>\n  <\/section>\n\n  <section id=\"intuition\">\n    <h2>直观解释：给数据穿三层衣服<\/h2>\n    <p>一段网页数据（MSDU）要从笔记本走到互联网，得像套娃一样穿衣：先套上 <strong>MAC 头+FCS<\/strong> 变成 MPDU（这一层写清\"谁收谁发、这是第几次尝试\"），再套上 <strong>PHY 前导<\/strong>变成 PPDU（这一层是让接收机\"对上频道\"的训练序列）。AP 收到后<strong>脱掉 802.11 的衣服，换上 802.3 的衣服<\/strong>再送上交换机——802.3 与 802.11 帧尺寸都不同（802.3 最大 1518 字节/净荷 1500，见教材 p.289），翻译工作正是集成服务（单元 05）的日常。<\/p>\n  <\/section>\n\n  <section id=\"formal\">\n    <h2>正式定义<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:170px\">概念<\/th><th>定义（分级标注）<\/th><\/tr>\n      <tr><td><dfn data-term=\"NET-MSDU-001\">封装链<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 3–7 层数据=MSDU；加 MAC 头/尾=MPDU；加 PHY 前导=PPDU（教材 p.286–288 Figure 9.2，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"NET-FCS-001\">FCS<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 32 位 CRC，校验帧完整性；FCS 失败则不发 ACK、触发重传（教材 p.287，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"NET-FCTRL-001\">Frame Control<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> MPDU 头部起始的位字段组：协议版本/类型/子类型/To DS/From DS/More Fragments/Retry/Power Mgmt/More Data/Protected/Order（字段清单与教材 Figure 7.5 实例一致；位序细节<span class=\"badge pending\">条款待核<\/span>）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"NET-ADDR-001\">四地址字段<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> RA=接收该无线传输的射频；TA=发送方射频；DA/SA=真正收/发的上层终端；BSSID=AP 射频身份。教材 Figure 7.5（WDS 帧头）与 p.290（RA/BSSID 定义）已核对正文。<\/td><\/tr>\n      <tr><td><dfn data-term=\"NET-FTYPE-001\">三类帧<\/dfn><\/td><td><span class=\"badge verified\">标准正
