 factLevel（事实分级）与 sourceRef（来源可回溯）。多选题需全对才计分。","questionSchema":{"id":"字符串，如 q-06-001","unitId":"单元编号","type":"single | multiple","knowledgeTermId":["关联术语库 ID"],"factLevel":"standard-definition | standard-mechanism | wfa-cert | vendor | engineering | teaching-simplification | inference | pending","sourceRef":["S2-1","S1-1:Ch9"],"prompt":"题干","options":[{"key":"A","text":"选项"}],"answer":["B"],"explanation":"逐项解析，说明每个选项对/错的依据与来源","difficulty":1},"quizzes":[{"id":"q-01-001","unitId":"01","type":"single","knowledgeTermId":["STD-IEEE-001","STD-WFA-001"],"factLevel":"wfa-cert","sourceRef":["S1-1:Ch1(p.12)","S3-1"],"prompt":"下列关于 IEEE 与 Wi-Fi Alliance 的说法，正确的是：","options":[{"key":"A","text":"两者是同一组织的两个部门"},{"key":"B","text":"IEEE 定义 WLAN 技术标准，Wi-Fi Alliance 定义互操作性认证——两者相互独立"},{"key":"C","text":"Wi-Fi Alliance 制定 802.11 标准的 MAC 层"},{"key":"D","text":"IEEE 负责给设备颁发 Wi-Fi 商标授权"}],"answer":["B"],"explanation":"B 正确且为教材原意（p.12：IEEE 802.11 任务组定义 WLAN 标准，Wi-Fi Alliance 定义互操作性认证项目，是两个独立组织）。A/C 把职能说反或合并；D 错：Wi-Fi 商标归 Wi-Fi Alliance。","difficulty":1},{"id":"q-01-002","unitId":"01","type":"single","knowledgeTermId":["STD-AMEND-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch1(p.8)"],"prompt":"802.11 修正案的字母指派规则中，下列哪一项符合实际？","options":[{"key":"A","text":"字母按序全部指派，o 与 l 均已使用"},{"key":"B","text":"o 与 l 不指派以避免与数字 0/1 混淆；802.11x 未指派以避免与 802.1X 混淆"},{"key":"C","text":"x 已指派给 802.11ax"},{"key":"D","text":"大写字母用于 MAC 层，小写字母用于 PHY 层"}],"answer":["B"],"explanation":"B 与教材 p.8 一致（已核对正文）。A 错：o/l 特意跳过。C 错：ax 是已指派字母，但 '802.11x' 从未指派——民间用它泛指 802.11 家族。D 错：无此规则。","difficulty":2},{"id":"q-01-003","unitId":"01","type":"single","knowledgeTermId":["STD-ITUR-001","STD-FCC-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch1(p.5-7)"],"prompt":"关于频谱监管层级，正确的是：","options":[{"key":"A","text":"FCC 直接为全球划分频段"},{"key":"B","text":"ITU-R 以国际条约形式划分区域与频段，各国监管机构（如 FCC）在其框架内管理本国频谱"},{"key":"C","text":"IEEE 负责分配 Wi-Fi 频段"},{"key":"D","text":"Wi-Fi Alliance 规定各国最大发射功率"}],"answer":["B"],"explanation":"B 与教材 p.5–7 一致：ITU-R 无线电规则属国际条约，区域内各国机构管理本国频谱（教材列举了澳/美等多国机构）。A 错：FCC 只管美国。C/D 错：IEEE 定技术标准、WFA 做认证，都不分配频段或定功率法规。","difficulty":1},{"id":"q-01-004","unitId":"01","type":"multiple","knowledgeTermId":["STD-WFA-001","STD-IETF-001","STD-ROLLUP-001"],"factLevel":"standard-mechanism","sourceRef":["S1-1:Ch1(p.10,12)","S2-1","S3-1"],"prompt":"下列说法正确的有：（多选，需全对）","options":[{"key":"A","text":"IEEE Std 802.11-2024 是现行整合版标准"},{"key":"B","text":"Wi-Fi Alliance 拥有 Wi-Fi 商标并运行 Wi-Fi CERTIFIED 认证"},{"key":"C","text":"IETF 的 RFC 编号在文档作废后可以被复用"},{"key":"D","text":"Wi-Fi CERTIFIED 6 认证基于 IEEE 802.11ax 技术"}],"answer":["A","B","D"],"explanation":"A 正确（IEEE 官方页：802.11-2024 于 2025-04-28 发布，取代 -2020）。B 正确（WFA 官方）。C 错：教材 p.10 明言 RFC 编号永不复用（已核对正文）。D 正确（WFA 2019-09-16 启动 Wi-Fi CERTIFIED 6，基于 802.11ax）。","difficulty":2},{"id":"q-02-001","unitId":"02","type":"single","knowledgeTermId":["RF-WAVE-001","RF-FREQ-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch2(p.40)"],"prompt":"取 c ≈ 3×10⁸ m/s，2.437 GHz（信道 6）的波长约为：","options":[{"key":"A","text":"12.3 cm"},{"key":"B","text":"5.2 cm"},{"key":"C","text":"24.6 cm"},{"key":"D","text":"1.23 m"}],"answer":["A"],"explanation":"λ = c/f = 3×10⁸ ÷ 2.437×10⁹ ≈ 0.123 m = 12.3 cm。B 是 5.8 GHz 附近的波长量级；C 多算一倍；D 是 243.7 MHz 的波长。公式与反比关系见教材 p.40（已核对正文）。","difficulty":1},{"id":"q-02-002","unitId":"02","type":"single","knowledgeTermId":["RF-DB-001","RF-DBM-001"],"factLevel":"engineering","sourceRef":["S1-1:Ch3(p.78)"],"prompt":"发射功率从 100 mW 调整到 200 mW，用 10s & 3s 规则相当于增加：","options":[{"key":"A","text":"约 +3 dB"},{"key":"B","text":"约 +10 dB"},{"key":"C","text":"约 +2 dB"},{"key":"D","text":"约 +23 dB"}],"answer":["A"],"explanation":"200/100 = 2 倍 → +3 dB（精确 +3.01 dB）。教材 p.78 强调 10s & 3s 是近似法（已核对正文）。+10 dB 对应 ×10；+23 dB 对应 ×200。","difficulty":1},{"id":"q-02-003","unitId":"02","type":"single","knowledgeTermId":["RF-DBM-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch3(p.71-75)"],"prompt":"0 dBm 等于多少功率？","options":[{"key":"A","text":"0 mW"},{"key":"B","text":"1 mW"},{"key":"C","text":"1 W"},{"key":"D","text":"10 mW"}],"answer":["B"],"explanation":"dBm 以 1 mW 为基准：0 dBm = 1 mW（10·lg(1)=0）。1 W=30 dBm，10 mW=10 dBm。dBm 是绝对功率单位，dB 是比较单位（教材 p.72–75）。","difficulty":1},{"id":"q-02-004","unitId":"02","type":"single","knowledgeTermId":["RF-DB-001"],"factLevel":"engineering","sourceRef":["S1-1:Ch3(p.72-73)"],"prompt":"信号 A 功率为 4 mW，信号 B 为 1 mW，A 比 B 高：","options":[{"key":"A","text":"3 dB"},{"key":"B","text":"4 dB"},{"key":"C","text":"6 dB"},{"key":"D","text":"10 dB"}],"answer":["C"],"explanation":"10·lg(4/1) = 10·lg4 ≈ 6.02 dB ≈ 6 dB（4 = 2×2 → +3+3）。dB 是比值：10·lg(P₁/P₂)（教材 p.72–73）。","difficulty":2},{"id":"q-02-005","unitId":"02","type":"multiple","knowledgeTermId":["RF-DB-001","RF-DBM-001","RF-DBI-001","RF-AMPL-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch3(p.72-75)","S1-1:Ch2(p.40)"],"prompt":"下列说法正确的有：（多选，需全对）","options":[{"key":"A","text":"dB 是比较单位，不是功率单位"},{"key":"B","text":"dBm 是以 1 mW 为基准的绝对功率单位"},{"key":"C","text":"dBi 以半波偶极子天线为 0 基准"},{"key":"D","text":"振幅降低意味着功率降低"},{"key":"E","text":"频率越高，波长越长"}],"answer":["A","B","D"],"explanation":"A 正确（教材 p.72 原文 'a unit of comparison, not a unit of power'）。B 正确。C 错：dBi 基准是各向同性辐射体；半波偶极子基准是 dBd（0 dBd≈2.14 dBi）。D 正确：功率与振幅平方成正比。E 错：λ=c/f 为反比（教材 p.40）。","difficulty":2},{"id":"q-03-001","unitId":"03","type":"single","knowledgeTermId":["RF-FSPL-001"],"factLevel":"standard-mechanism","sourceRef":["S1-1:Ch2(p.51-52)"],"prompt":"距离不变，把工作频率从 2.4 GHz 换到 5.8 GHz，自由空间路径损耗将：","options":[{"key":"A","text":"减小，因为高频穿透更好"},{"key":"B","text":"增大，约 +7 dB 左右"},{"key":"C","text":"不变，FSPL 只与距离有关"},{"key":"D","text":"先增大后减小"}],"answer":["B"],"explanation":"FSPL 公式含 20·lg(f)：20·lg(5800/2412) ≈ 6.6 dB，故同距下 5.8 GHz 比 2.4 GHz 大约 7 dB。A 错：高频吸收/穿透损失更大而非更好；C 错：FSPL 同时依赖距离与频率。","difficulty":2},{"id":"q-03-002","unitId":"03","type":"single","knowledgeTermId":["RF-FSPL-001"],"factLevel":"engineering","sourceRef":["S1-1:Ch2(p.52)"],"prompt":"教材介绍的 6 dB 规则指的是：","options":[{"key":"A","text":"距离每翻一倍，FSPL 约增加 6 dB"},{"key":"B","text":"每 6 dB 损耗需要一堵墙的余量"},{"key":"C","text":"频率每提高 6 GHz，损耗加 6 dB"},{"key":"D","text":"SNR 低于 6 dB 时必须重传"}],"answer":["A"],"explanation":"教材 p.52 介绍 6 dB rule：距离（或频率）翻倍，FSPL 约增加 6 dB（20·lg2≈6.02）。其余选项均为杜撰。","difficulty":1},{"id":"q-03-003","unitId":"03","type":"single","knowledgeTermId":["RF-MP-001","SS-MIMO-001"],"factLevel":"standard-mechanism","sourceRef":["S1-1:Ch2(p.46,53-55)"],"prompt":"关于多径传播，下列说法正确的是：","options":[{"key":"A","text":"多径对一切 802.11 设备都只有坏处"},{"key":"B","text":"多径的时延扩展会造成符号间干扰（ISI），但 MIMO/DSP 技术可以利用多径"},{"key":"C","text":"多径只发生在室外环境"},{"key":"D","text":"多径信号到达接收端的路径长度必然完全相同"}],"answer":["B"],"explanation":"B 与教材一致：p.53–55 讲 ISI 与 CRC 检错/重传，p.46 明确 802.11n/ac 用 MIMO 与 DSP 利用多径（已核对正文）。A 错：MIMO 时代多径是增益来源。C 错：室内反射面更多。D 错：路径不同正是多径的定义。","difficulty":2},{"id":"q-03-004","unitId":"03","type":"single","knowledgeTermId":["RF-SNR-001","RF-SINR-001"],"factLevel":"engineering","sourceRef":["S1-1:Ch3(p.89-90)"],"prompt":"某客户端 SNR 为 25 dB。开启一个同频干扰源后，接收端的\"干扰+噪声\"总功率抬高了 10 dB。此时 SINR 约为：","options":[{"key":"A","text":"25 dB"},{"key":"B","text":"15 dB"},{"key":"C","text":"35 dB"},{"key":"D","text":"10 dB"}],"answer":["B"],"explanation":"SINR = 信号/(干扰+噪声)。干扰+噪声抬高 10 dB 意味着分母 ×10，SINR = 25 − 10 = 15 dB。这正是同频部署中 SINR 与 SNR 差异巨大的典型场景（概念见教材 p.89–90 与 Ch12）。","difficulty":3},{"id":"q-03-005","unitId":"03","type":"multiple","knowledgeTermId":["RF-ABSP-001","RF-DIFF-001","RF-SCAT-001","RF-NF-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch2(p.44-48)","S1-1:Ch3(p.94)"],"prompt":"下列说法正确的有：（多选，需全对）","options":[{"key":"A","text":"吸收把射频能量转化为热等其他形式"},{"key":"B","text":"绕射是波绕过障碍物边缘继续传播"},{"key":"C","text":"散射主要由大于波长的光滑表面引起"},{"key":"D","text":"测量噪声底的正确工具是高质量便携频谱仪"},{"key":"E","text":"折射只发生在室内环境"}],"answer":["A","B","D"],"explanation":"A 正确（吸收定义，p.44）。B 正确（p.48，且教材特别提醒与折射区分）。C 错：散射由与波长相当或更小的粗糙表面/颗粒引起；大于波长的光滑表面引起反射。D 正确（p.94：AP 不是测量噪声底的最佳工具）。E 错：折射多由大气条件引起，常见于室外。","difficulty":2},{"id":"q-04-001","unitId":"04","type":"single","knowledgeTermId":["RF-DBI-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch3(p.74-75)"],"prompt":"教材取半波偶极子 = 2.14 dBi。那么 3 dBd 的天线等于：","options":[{"key":"A","text":"2.14 dBi"},{"key":"B","text":"5.14 dBi"},{"key":"C","text":"6.00 dBi"},{"key":"D","text":"1.5 dBi"}],"answer":["B"],"explanation":"dBd 与 dBi 只差基准：教材 p.75 示例 \"2.14 + 3 = 5.14 dBi\"（已核对正文）。注意换算时先统一基准再加减。","difficulty":1},{"id":"q-04-002","unitId":"04","type":"single","knowledgeTermId":["ANT-HIGHDIR-001","ANT-SEMI-001","ANT-OMNI-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch4(p.118-127)"],"prompt":"为两栋楼之间的点对点室外桥接选择天线，最合适的是：","options":[{"key":"A","text":"全向天线"},{"key":"B","text":"高定向天线（抛物面碟/栅格）"},{"key":"C","text":"吸顶全向 rubber duck"},{"key":"D","text":"任何天线都可以，增益无所谓"}],"answer":["B"],"explanation":"教材 p.123：高定向天线严格用于点对点通信（楼宇桥接），波束最窄、增益最高（已核对正文）。全向天线把能量撒向 360°，对桥接是浪费且易受干扰。","difficulty":1},{"id":"q-04-003","unitId":"04","type":"single","knowledgeTermId":["RF-POL-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch4(p.135)"],"prompt":"发射天线为垂直极化，接收天线被误装成水平极化。最可能的后果是：","options":[{"key":"A","text":"没有影响，Wi-Fi 会自动纠偏"},{"key":"B","text":"显著的极化失配损耗，链路质量明显劣化"},{"key":"C","text":"吞吐率提升一倍"},{"key":"D","text":"只有加密会受影响"}],"answer":["B"],"explanation":"教材 p.135：极化匹配极其重要，失配造成显著损耗（已核对正文）；正交极化理论上近似完全失配。极化与加密无关。","difficulty":1},{"id":"q-04-004","unitId":"04","type":"single","knowledgeTermId":["RF-EIRP-001","RF-LB-001","RF-FSPL-001"],"factLevel":"engineering","sourceRef":["S1-1:Ch3(p.94-97)","S1-1:Ch2(p.52)"],"prompt":"链路预算：发射 20 dBm，发端馈线损耗 1 dB，天线 23 dBi（两端同型、收端馈损忽略），距离 1 km，频率 5800 MHz（FSPL = 20·lg(1) + 20·lg(5800) + 32.44 ≈ 107.7 dB）。接收电平约为：","options":[{"key":"A","text":"−63.7 dBm"},{"key":"B","text":"−42.7 dBm"},{"key":"C","text":"−87.7 dBm"},{"key":"D","text":"−107.7 dBm"}],"answer":["B"],"explanation":"EIRP = 20 − 1 + 23 = 42 dBm；接收电平 = EIRP − FSPL + 收端天线增益 = 42 − 107.7 + 23 = −42.7 dBm。A 漏加收端增益；C 多扣了一次馈损；D 忘了两端天线增益。","difficulty":3},{"id":"q-04-005","unitId":"04","type":"multiple","knowledgeTermId":["ANT-OMNI-001","RF-BW-001","RF-AG-001","SS-MIMO-001","ANT-DIV-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch4(p.112-118,136-138)"],"prompt":"下列说法正确的有：（多选，需全对）","options":[{"key":"A","text":"全向天线在水平面 360° 近似均匀辐射"},{"key":"B","text":"波束宽度按增益下降 3 dB 的角度范围定义"},{"key":"C","text":"无源天线通过放大电路提高增益"},{"key":"D","text":"MIMO 天线数量等于空间流数量"},{"key":"E","text":"天线分集利用多天线接收的独立性对抗多径衰落"}],"answer":["A","B","E"],"explanation":"A 正确（p.118，垂直面收窄）。B 正确（p.114–116）。C 错：无源天线靠能量重新聚焦，教材 p.69 以手电筒类比（已核对正文）。D 错：记法如 4×4:3——流数可少于天线数。E 正确（p.136–137）。","difficulty":2},{"id":"q-06-001","unitId":"06","type":"single","knowledgeTermId":["NET-SCAN-001","MAC-BEACON-001"],"factLevel":"standard-mechanism","sourceRef":["S1-1:Ch9(p.293-296)","S2-1(条款待核)"],"prompt":"关于主动扫描与被动扫描，下列说法正确的是：","options":[{"key":"A","text":"被动扫描要求 STA 在每个信道上发送探测请求帧"},{"key":"B","text":"被动扫描通过在各信道侦听 AP 周期广播的 Beacon 帧来发现网络"},{"key":"C","text":"主动扫描必须携带具体 SSID，否则无法发现任何网络"},{"key":"D","text":"Beacon 帧由客户端 STA 周期发送，AP 负责侦听"}],"answer":["B"],"explanation":"B 正确：被动扫描=STA 逐信道侦听 Beacon（Beacon 由 AP 发送；仅 IBSS 中由成员 STA 轮流发送，见教材 p.293-294）。A 错：那是主动扫描的行为，被动扫描只听不发。C 错：主动扫描可用通配符 SSID（SSID 字段置空）询问所有网络（p.295）。D 错：把收发双方说反了，IBSS 是唯一例外。","difficulty":1},{"id":"q-06-002","unitId":"06","type":"single","knowledgeTermId":["NET-AUTH-001","NET-ASSOC-001","SEC-4WH-001","NET-DHCP-001"],"factLevel":"standard-mechanism","sourceRef":["S1-1:Ch9(p.297-300)","S2-1(条款待核)"],"prompt":"一台支持 WPA3 的 STA 接入企业无线网络，下列哪组顺序正确描述了从发现网络到获得 IP 地址的全过程？","options":[{"key":"A","text":"关联 → 认证（SAE）→ 四次握手 → DHCP"},{"key":"B","text":"扫描 → 认证（SAE）→ 关联 → 四次握手 → DHCP"},{"key":"C","text":"认证（SAE）→ DHCP → 关联 → 四次握手"},{"key":"D","text":"扫描 → 关联 → 四次握手 → 认证（SAE）→ DHCP"}],"answer":["B"],"explanation":"B 正确：先扫描发现，再认证（SAE 属 802.11 认证阶段，产出 PMK）、后关联（教材 p.297：认证是连接 BSS 的第一步，关联是第二步，顺序不可颠倒），RSN 下关联后进行四次握手（单元 14），最后 DHCP 获取 IP（单元 15）。A 错：关联不能在认证之前。C/D 错：把认证、关联、DHCP 的顺序打乱；DHCP 是三层过程，与 802.11 关联无关。","difficulty":2},{"id":"q-06-003","unitId":"06","type":"single","knowledgeTermId":["NET-ASSOC-001","SEC-4WH-001","NET-DHCP-001"],"factLevel":"standard-mechanism","sourceRef":["S1-1:Ch9(p.299-300)","S2-1(条款待核)"],"prompt":"STA 收到 Association Response（状态=成功）后，下列说法最准确的是：","options":[{"key":"A","text":"STA 已成为 BSS 成员并分配到 AID；在受保护网络中还需完成密钥协商并获取 IP 才能传业务数据"},{"key":"B","text":"STA 已可访问互联网，因为关联即完成全部准入"},{"key":"C","text":"STA 的 IP 地址由 AP 在该响应帧中一并分配"},{"key":"D","text":"STA 已认证完成，可以开始无线传帧，但不能再发起任何管理帧交换"}],"answer":["A"],"explanation":"A 正确：关联成功=进入 State 3（教材 p.300 称之为 authenticated and associated (pending security mechanisms)），获得 AID；RSN 下需四次握手安装密钥（单元 14），IP 经 DHCP 获取（单元 15）。B 错：混淆二层关联与三层连通。C 错：IP 不在 802.11 帧中分配。D 错：关联后管理帧交换仍然存在（如解除关联、资源协商等）。","difficulty":2},{"id":"q-06-004","unitId":"06","type":"single","knowledgeTermId":["NET-ROAM-001","NET-ASSOC-001"],"factLevel":"vendor","sourceRef":["S1-1:Ch9(p.301-303)","S1-1:Ch12"],"prompt":"关于\"漫游\"与 IEEE 802.11 标准的关系，正确的是：","options":[{"key":"A","text":"标准规定了统一的漫游触发阈值：RSSI 低于 −70 dBm 即必须漫游"},{"key":"B","text":"标准未规定漫游决策算法；何时漫游由厂商/驱动实现决定，机制上通过重新关联（Reassociation）完成"},{"key":"C","text":"漫游由 AP 集中决策，STA 只能被动接受切换"},{"key":"D","text":"漫游时 STA 必须先向原 AP 发送解除认证帧再连接新 AP"}],"answer":["B"],"explanation":"B 正确：教材 p.301-303 及第 12 章均把漫游定位为客户端行为，阈值与算法属厂商实现（802.11k/v 提供辅助信息）；其标准机制是向新 AP 发送携带原 AP 地址的重新关联请求。A 错：不存在标准统一阈值（−67/−72 dBm 是工程实践参考值）。C 错：与教材表述相反（决策在客户端侧，控制器可施加影响但那是厂商架构）。D 错：漫游不需要先 deauth——重新关联本身就是迁移过程，教材 p.303 指出重新关联失败时客户端保留原连接。","difficulty":2},{"id":"q-06-005","unitId":"06","type":"multiple","knowledgeTermId":["TOPO-SSID-001","TOPO-BSSID-001","NET-AUTH-001","SEC-SAE-001","MAC-BEACON-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch7","S1-1:Ch9","S3-5","S2-1(条款待核)"],"prompt":"下列说法正确的有：（多选，需全对）","options":[{"key":"A","text":"同一 ESS 中的不同 AP 可以使用相同的 SSID"},{"key":"B","text":"基础设施 BSS 中，BSSID 通常就是该 AP 无线接口的 MAC 地址"},{"key":"C","text":"开放系统认证会校验用户名与口令"},{"key":"D","text":"WPA3-Personal 使用 SAE 作为认证与密钥交换机制"},{"key":"E","text":"Probe Response 帧是广播帧，与 Beacon 完全相同"}],"answer":["A","B","D"],"explanation":"A 正确：ESS 内多个 BSS 共用同一 SSID 是其典型形态（单元 05）。B 正确：BSSID 标识一个 BSS，通常为 AP 该射频的 MAC（单元 05；多 BSSID 机制下另有规则，条款待核）。C 错：开放系统认证不携带、不校验任何凭据（教材 p.297-298）。D 正确：WFA WPA3（2018-06-25）Personal 以 SAE 替代 PSK 认证（S3-5）。E 错：Probe Response 是发给请求 STA 的（单播）应答，与广播的 Beacon 是不同帧（内容相近但用途与收件方不同；教材 p.295-296）。","difficulty":3},{"id":"q-05-001","unitId":"05","type":"single","knowledgeTermId":["TOPO-BSSID-001","TOPO-AP-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch7(p.249)"],"prompt":"教材对 BSSID 的定义是：","options":[{"key":"A","text":"AP 的管理 IP 地址"},{"key":"B","text":"每个 BSS 的二层标识符，最常见即 AP 无线接口的 MAC 地址"},{"key":"C","text":"ESS 的网络名称"},{"key":"D","text":"客户端 STA 的 MAC 地址"}],"answer":["B"],"explanation":"教材 p.249：BSSID 是每个 BSS 的二层标识符，最常见为 AP 无线网络接口的 MAC（已核对正文）。A 混淆有线口管理地址；C 是 SSID；D 是终端身份。","difficulty":1},{"id":"q-05-002","unitId":"05","type":"single","knowledgeTermId":["TOPO-BSS-001","TOPO-ESS-001","TOPO-DS-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch7(p.243-253)"],"prompt":"若干台 AP 由有线以太网互连并共用同一 SSID，对上层表现为一个逻辑网络。这个整体叫：","options":[{"key":"A","text":"IBSS"},{"key":"B","text":"ESS"},{"key":"C","text":"BSA"},{"key":"D","text":"WDS"}],"answer":["B"],"explanation":"ESS=由分布式系统（此处为以太网）互连的多个 BSS 的集合。A 是无 AP 的独立拓扑；C 是单个 BSS 的物理覆盖区；D 是 AP 间无线桥接的厂商语义。","difficulty":1},{"id":"q-05-003","unitId":"05","type":"single","knowledgeTermId":["TOPO-MBSS-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch7(p.255)"],"prompt":"关于 802.11 Mesh（MBSS）的路由，教材的说法是：","options":[{"key":"A","text":"三层 IP 路由"},{"key":"B","text":"二层操作、基于 MAC 地址，默认路径选择协议为 HWMP"},{"key":"C","text":"由 Wi-Fi Alliance 规定，与 IEEE 无关"},{"key":"D","text":"必须使用有线回程"}],"answer":["B"],"explanation":"教材 p.255：Mesh 路由是二层操作、按 MAC 地址而非 IP；HWMP 为默认路径选择协议（已核对正文）。","difficulty":2},{"id":"q-05-004","unitId":"05","type":"multiple","knowledgeTermId":["TOPO-SSID-001","TOPO-BSSID-001","TOPO-AP-001","TOPO-IBSS-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch7(p.242-253)"],"prompt":"下列说法正确的有：（多选，需全对）","options":[{"key":"A","text":"AP 是半双工设备，因为 RF 介质是半双工的"},{"key":"B","text":"IBSS 中没有 AP，Beacon 由成员 STA 轮流发送"},{"key":"C","text":"隐藏 SSID 是 802.11 标准定义的安全机制"},{"key":"D","text":"双频 AP 通常同时存在两个 BSS，各有自己的 BSSID"}],"answer":["A","B","D"],"explanation":"A 与教材 p.242 原文一致。B 见 p.253 与 Ch9 p.293（IBSS 无 AP，Beacon 轮流）。C 错：教材 p.248 称隐藏 SSID 为标准未定义的弱安全尝试（已核对正文）。D 正确：每射频一个 BSS/BSSID。","difficulty":2},{"id":"q-07-001","unitId":"07","type":"single","knowledgeTermId":["NET-MSDU-001","NET-FCS-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch9(p.286-287)"],"prompt":"从上层载荷到可在 RF 上发送的 PPDU，正确的封装顺序是：","options":[{"key":"A","text":"MSDU → 加 MAC 头/FCS 成 MPDU → 加 PHY 前导成 PPDU"},{"key":"B","text":"MSDU → 加 PHY 前导成 MPDU → 加 MAC 头成 PPDU"},{"key":"C","text":"MPDU → MSDU → PPDU"},{"key":"D","text":"PPDU 直接承载 MSDU，无需 MAC 头"}],"answer":["A"],"explanation":"教材 p.286–288：3–7 层数据=MSDU，加 MAC 头/尾=MPDU，再加 PLCP 前导=PPDU（已核对正文）。","difficulty":1},{"id":"q-07-002","unitId":"07","type":"single","knowledgeTermId":["NET-ADDR-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch9(p.290)","S1-1:Ch7(p.247)"],"prompt":"STA→AP 的数据帧（To DS=1，From DS=0）中，Addr1 的角色是：","options":[{"key":"A","text":"DA（目的终端）"},{"key":"B","text":"BSSID（=RA，接收本次无线传输的射频）"},{"key":"C","text":"SA"},{"key":"D","text":"TA"}],"answer":["B"],"explanation":"STA→AP：Addr1=BSSID（同时是 RA）——无线传输的接收者是 AP 的射频；Addr2=SA（=TA），Addr3=DA。四地址组合与教材 p.290 的 RA 定义、Figure 7.5 实例一致。","difficulty":2},{"id":"q-07-003","unitId":"07","type":"single","knowledgeTermId":["NET-FCS-001","MAC-ACK-001"],"factLevel":"standard-mechanism","sourceRef":["S1-1:Ch9(p.287,305)"],"prompt":"接收方收到的单播数据帧 FCS 校验失败，接下来会发生：","options":[{"key":"A","text":"照常回复 ACK，仅丢弃载荷"},{"key":"B","text":"不回复 ACK；发送方超时后重传"},{"key":"C","text":"接收方立即回 Deauth"},{"key":"D","text":"帧被缓存等待上层修复"}],"answer":["B"],"explanation":"FCS（32 位 CRC）失败→不发 ACK（教材 p.287、305：未收到 ACK 即重传，已核对正文）。","difficulty":1},{"id":"q-07-004","unitId":"07","type":"single","knowledgeTermId":["NET-FCTRL-001","SEC-CCMP-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch9(p.287)"],"prompt":"启用 WPA2（CCMP）加密时，802.11 帧中哪一部分仍是明文？","options":[{"key":"A","text":"Frame Control 与地址字段等 MAC 头"},{"key":"B","text":"帧体"},{"key":"C","text":"FCS"},{"key":"D","text":"全部加密"}],"answer":["A"],"explanation":"加密保护的是帧体（MSDU 层）；MAC 头必须明文，否则其他电台无法解读 Duration/地址来维护 NAV（教材 p.287：MSDU 被加密保护，已核对正文）。","difficulty":2},{"id":"q-07-005","unitId":"07","type":"multiple","knowledgeTermId":["NET-FTYPE-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch9(p.289-292)"],"prompt":"下列帧中属于控制帧的有：（多选，需全对）","options":[{"key":"A","text":"ACK"},{"key":"B","text":"Beacon"},{"key":"C","text":"RTS"},{"key":"D","text":"PS-Poll"},{"key":"E","text":"Association Response"}],"answer":["A","C","D"],"explanation":"ACK/RTS/PS-Poll 是控制帧（无帧体）；Beacon 与 Association Response 是管理帧。","difficulty":1},{"id":"q-08-001","unitId":"08","type":"single","knowledgeTermId":["MAC-CSMA-001","MAC-ACK-001"],"factLevel":"standard-mechanism","sourceRef":["S1-1:Ch8(p.265-266)"],"prompt":"802.11 的 CSMA/CA 如何\"发现\"碰撞？","options":[{"key":"A","text":"发送时监测电压异常（像 CSMA/CD）"},{"key":"B","text":"不主动检测；单播帧未收到 ACK 即视为发生冲突（碰撞假设）"},{"key":"C","text":"由 AP 广播碰撞通知"},{"key":"D","text":"靠 FCS 字段标记碰撞"}],"answer":["B"],"explanation":"教材 p.266：该过程不判定碰撞是否发生，未收到 ACK 即为碰撞假设（已核对正文）。半双工 RF 下无法边发边检测。","difficulty":1},{"id":"q-08-002","unitId":"08","type":"single","knowledgeTermId":["MAC-NAV-001","MAC-CCA-001"],"factLevel":"standard-mechanism","sourceRef":["S1-1:Ch8(p.267-270)"],"prompt":"一台 STA 无法解读他人数据帧的内容，但仍能正确退避。它依赖的是：","options":[{"key":"A","text":"物理载波侦听 CCA 与 MAC 头中的 Duration/ID（NAV）"},{"key":"B","text":"解密帧体后读取退避字段"},{"key":"C","text":"AP 的逐时隙轮询"},{"key":"D","text":"运气（随机抖动）"}],"answer":["A"],"explanation":"MAC 头永远明文：CCA 检测能量/前导，Duration/ID 让任何听到的站设置 NAV 虚拟载波侦听（教材 p.267–270，已核对正文）。","difficulty":2},{"id":"q-08-003","unitId":"08","type":"single","knowledgeTermId":["MAC-CSMA-001"],"factLevel":"standard-mechanism","sourceRef":["S1-1:Ch8(p.270-271)"],"prompt":"关于随机退避计时器，正确的是：","options":[{"key":"A","text":"无论介质忙闲，每个时隙都递减"},{"key":"B","text":"介质空闲的时隙才递减；其他站发送时冻结；减到 0 且介质空闲才发送"},{"key":"C","text":"退避值固定为 15"},{"key":"D","text":"冲突后 CW 缩小以加快重传"}],"answer":["B"],"explanation":"教材 p.270–271：无介质活动的时隙才递减；减到 0 且介质空闲发送；冲突后竞争窗口翻倍重取（已核对正文）。D 错：CW 是增大不是缩小。","difficulty":2},{"id":"q-08-004","unitId":"08","type":"single","knowledgeTermId":["MAC-RTS-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch9(p.310-311)"],"prompt":"RTS/CTS 四帧交换中，RTS 帧的 Duration 值覆盖的时间是：","options":[{"key":"A","text":"仅 ACK 的传输时间"},{"key":"B","text":"CTS/Data/ACK 交换加 3 个 SIFS"},{"key":"C","text":"0（交换已结束）"},{"key":"D","text":"整个 Beacon 间隔"}],"answer":["B"],"explanation":"教材 p.310–311 Figure 9.11 的 Duration 链：RTS=CTS/Data/ACK+3×SIFS，CTS=Data/ACK+2×SIFS，DATA=ACK，ACK=0（已核对正文）。","difficulty":2},{"id":"q-08-005","unitId":"08","type":"multiple","knowledgeTermId":["MAC-HN-001","MAC-RTS-001","MAC-EDCA-001","MAC-WMM-001"],"factLevel":"standard-mechanism","sourceRef":["S1-1:Ch8(p.272-276)","S1-1:Ch12(p.414)"],"prompt":"下列说法正确的有：（多选，需全对）","options":[{"key":"A","text":"隐藏节点指互相听不到的发送方在接收方处产生碰撞"},{"key":"B","text":"RTS/CTS 能缓解隐藏节点，但引入固定开销"},{"key":"C","text":"EDCA 是 WFA 的营销名，IEEE 无对应机制"},{"key":"D","text":"WMM 按 AC（接入类别）提供差异化竞争参数"}],"answer":["A","B","D"],"explanation":"A/B 正确（隐藏节点机制与 RTS/CTS 权衡，教材 Ch9/Ch12）。C 错：EDCA 是 802.11e 标准机制，WMM 才是 WFA 认证名。D 正确（教材 p.275）。","difficulty":2},{"id":"q-09-001","unitId":"09","type":"single","knowledgeTermId":["MAC-AGG-001","MAC-BA-001"],"factLevel":"standard-mechanism","sourceRef":["S1-1:Ch18(p.623)","S1-1:Ch8(p.274)"],"prompt":"A-MPDU 聚合的主要收益与代价是：","options":[{"key":"A","text":"收益=摊薄固定开销；代价=出错时更大块的重传"},{"key":"B","text":"收益=降低误码率；代价=无"},{"key":"C","text":"收益=加密更强；代价=时延更高"},{"key":"D","text":"收益=省电；代价=不能与 Block Ack 同用"}],"answer":["A"],"explanation":"聚合把前导/IFS/ACK 等固定开销摊到更多净荷上；一次传输块越大，出错重传代价越大。Block Ack 正是 A-MPDU 的配套确认机制（教材 Ch8 §Block Ack、Ch18）。","difficulty":2},{"id":"q-09-002","unitId":"09","type":"single","knowledgeTermId":["MAC-PM-001","MAC-RTX-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch9(p.312-314)"],"prompt":"STA 通知 AP \"我要开始省电\"的标准动作是：","options":[{"key":"A","text":"发送 Deauth 帧后重新关联"},{"key":"B","text":"发送 Null 数据帧，置 Power Management 位=1"},{"key":"C","text":"停止发送任何帧即可"},{"key":"D","text":"向 AP 发送 DHCP Release"}],"answer":["B"],"explanation":"教材 p.312：客户端用空函数帧（null function frame）改变 Power Save 状态（已核对正文）。静默消失会触发 AP 的不活动计时器而非有序省电。","difficulty":2},{"id":"q-09-003","unitId":"09","type":"single","knowledgeTermId":["MAC-TIM-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch9(p.313-315)"],"prompt":"打盹中的 STA 如何得知 AP 为自己缓存了单播帧？","options":[{"key":"A","text":"AP 逐个私发短信帧"},{"key":"B","text":"Beacon 中的 TIM 位图中自己的位被置 1"},{"key":"C","text":"ARP 广播"},{"key":"D","text":"DS 栏目公告"}],"answer":["B"],"explanation":"TIM（流量指示图）在 Beacon 中逐 STA 指示缓存状态；组播则靠 DTIM 时刻全员苏醒（教材 p.313–315，已核对正文）。","difficulty":1},{"id":"q-09-004","unitId":"09","type":"single","knowledgeTermId":["MAC-TIM-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch9(p.315)"],"prompt":"关于 DTIM，教材指出：","options":[{"key":"A","text":"DTIM 只通知单个 STA 取件"},{"key":"B","text":"TIM 中的 DTIM 值为 0 表示当前 Beacon 即 DTIM，随后 AP 立即发送组播/广播帧"},{"key":"C","text":"DTIM 越小越省电"},{"key":"D","text":"DTIM 仅在 IBSS 中使用"}],"answer":["B"],"explanation":"教材 p.315 原文：DTIM 值为 0 表示当前 TIM 即 DTIM；所有 STA 在 DTIM 时刻醒来接收组播（已核对正文）。C 反了：DTIM 间隔越大越省电、组播时延越大。D 错：IBSS 用 ATIM。","difficulty":2},{"id":"q-09-005","unitId":"09","type":"multiple","knowledgeTermId":["MAC-RTX-001","NET-UAPSD-001","MAC-ATIM-001","MAC-AGG-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch9(p.305-315)"],"prompt":"下列说法正确的有：（多选，需全对）","options":[{"key":"A","text":"单播帧未被 ACK 就会重传，直到重传上限"},{"key":"B","text":"U-APSD/WMM-PS 用按需的服务间隔取件减少 PS-Poll 往返"},{"key":"C","text":"ATIM 用于基础设施 BSS 中 AP 向 STA 通告缓存帧"},{"key":"D","text":"打盹（doze）状态下 STA 既不能收也不能发"}],"answer":["A","B","D"],"explanation":"A 正确（p.305）。B 正确（U-APSD 方向，p.315–318）。C 错：ATIM 是 IBSS 中 STA 之间的通告帧；基础设施模式用 TIM。D 正确（p.314 原文：doze 状态无法收发帧）。","difficulty":2},{"id":"q-10-001","unitId":"10","type":"single","knowledgeTermId":["SP-OFDM-001","SP-SC-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch6(p.219)"],"prompt":"802.11a/g 的 20 MHz OFDM 信道中，52 个子载波的分工是：","options":[{"key":"A","text":"52 个全部承载数据"},{"key":"B","text":"48 个承载数据，4 个（±7/±21）作导频供相位/幅度同步"},{"key":"C","text":"26 个数据、26 个导频"},{"key":"D","text":"全部作导频"}],"answer":["B"],"explanation":"教材 p.219：52 个子载波编号 -26 到 +26，48 个承载数据，-21/-7/+7/+21 四个为导频子载波，供解调器做相位/幅度参考与同步（已核对正文）。","difficulty":1},{"id":"q-10-002","unitId":"10","type":"single","knowledgeTermId":["SP-QAM-001","SP-CC-001","SP-OFDM-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch6(p.220)"],"prompt":"802.11a 的 54 Mb/s 由哪些参数构成？（48 数据子载波、符号时长 4 µs）","options":[{"key":"A","text":"64-QAM（6 bit/子载波）× 码率 3/4"},{"key":"B","text":"16-QAM（4 bit/子载波）× 码率 1/2"},{"key":"C","text":"BPSK × 码率 5/6"},{"key":"D","text":"256-QAM × 码率 5/6"}],"answer":["A"],"explanation":"48 子载波 × 6 bit × 3/4 = 216 数据比特/符号 ÷ 4 µs = 54 Mb/s，与教材 p.220 速率表一致（已核对正文）。16-QAM×1/2 对应 24 Mb/s。","difficulty":2},{"id":"q-10-003","unitId":"10","type":"single","knowledgeTermId":["SP-OFDM-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch18(p.635)"],"prompt":"相比 802.11a/g，802.11n（HT）在 20 MHz 信道中的子载波用法变化是：","options":[{"key":"A","text":"减少 4 个数据子载波"},{"key":"B","text":"额外使用 4 个子载波承载数据（48→52）"},{"key":"C","text":"子载波数量不变但符号翻倍"},{"key":"D","text":"取消导频子载波"}],"answer":["B"],"explanation":"教材 p.635：HT 射机多用 4 个附加子载波承载数据，更高效利用 20 MHz 频谱（已核对正文）。","difficulty":2},{"id":"q-10-004","unitId":"10","type":"multiple","knowledgeTermId":["PERF-MCS-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch18(p.641)"],"prompt":"决定最终数据速率的因素包括：（多选，需全对）","options":[{"key":"A","text":"调制方式"},{"key":"B","text":"保护间隔"},{"key":"C","text":"空间流数"},{"key":"D","text":"仅由 MCS 索引一个数字决定，与其他参数无关"}],"answer":["A","B","C"],"explanation":"教材 p.641：调制类型、保护间隔与空间流数共同决定最终数据速率（已核对正文）。D 错：MCS 索引正是这些参数的组合编码，还须结合带宽换算。","difficulty":2},{"id":"q-10-005","unitId":"10","type":"single","knowledgeTermId":["PERF-DRS-001"],"factLevel":"vendor","sourceRef":["S1-1:Ch7(p.250)","S1-1:Ch12"],"prompt":"客户端在 BSA 内不同数据速率区间之间切换（动态速率切换），决策者是：","options":[{"key":"A","text":"主要在客户端驱动（厂商实现），802.11k/v 可辅助"},{"key":"B","text":"IEEE 标准规定的统一算法"},{"key":"C","text":"始终由 AP 强制下发"},{"key":"D","text":"由 DHCP 服务器决定"}],"answer":["A"],"explanation":"DRS 算法属厂商/客户端实现（教材 p.250 提出、Ch12 展开）；802.11k/v 提供测量与管理辅助。标准不规定统一算法。","difficulty":2},{"id":"q-11-001","unitId":"11","type":"single","knowledgeTermId":["SS-MIMO-001","SS-STR-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch18(p.629)"],"prompt":"3×3:2 MIMO 系统的含义是：","options":[{"key":"A","text":"3 根天线、3 条空间流"},{"key":"B","text":"3 发 3 收，但只有 2 条独立数据流"},{"key":"C","text":"3 个用户、2 个 AP"},{"key":"D","text":"3 频段 × 2 信道"}],"answer":["B"],"explanation":"教材 p.629 原文：3×3:2 用三个发射机与三个接收机，但只用两条独立数据流；3×3:3 才是三条流（已核对正文）。天线数≠流数。","difficulty":1},{"id":"q-11-002","unitId":"11","type":"single","knowledgeTermId":["SS-MU-001"],"factLevel":"standard-definition","sourceRef":["S2-4","S2-2"],"prompt":"MU-MIMO 的上行方向（UL MU-MIMO）由哪个修正案引入？","options":[{"key":"A","text":"802.11n"},{"key":"B","text":"802.11ac"},{"key":"C","text":"802.11ax"},{"key":"D","text":"802.11be"}],"answer":["C"],"explanation":"下行 MU-MIMO 由 802.11ac-2013 引入，上行由 802.11ax-2021 引入（standards-matrix.md 已核实编号）。802.11be 的 MLO 是多链路，勿混淆。","difficulty":2},{"id":"q-11-003","unitId":"11","type":"single","knowledgeTermId":["SP-CH-001","ARCH-MCA-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch18(p.638)"],"prompt":"教材对 2.4 GHz 部署 40 MHz 信道的评价是：","options":[{"key":"A","text":"推荐：速率翻倍"},{"key":"B","text":"在多信道架构中无法扩展——3 个非重叠 20 MHz 绑定后频谱更紧张"},{"key":"C","text":"只在 DFS 信道可用"},{"key":"D","text":"与 20 MHz 无任何差异"}],"answer":["B"],"explanation":"教材 p.638：2.4 GHz 部署 40 MHz 在多信道架构中无法扩展——14 个信道里只有 3 个非重叠 20 MHz（已核对正文）。","difficulty":2},{"id":"q-11-004","unitId":"11","type":"single","knowledgeTermId":["PERF-TP-001"],"factLevel":"engineering","sourceRef":["S1-1:Ch6(p.230)","S1-1:Ch18"],"prompt":"一台标称 867 Mb/s（2 流 80 MHz）的 AP，客户端实测应用层吞吐通常：","options":[{"key":"A","text":"等于 867 Mb/s"},{"key":"B","text":"明显低于标称值（MAC 开销/竞争/重传折扣，常约一半量级）"},{"key":"C","text":"高于标称值"},{"key":"D","text":"恒定为 54 Mb/s"}],"answer":["B"],"explanation":"标称 PHY 速率要经 MAC 开销（前导/IFS/ACK/退避）、竞争与重传折损才是应用层吞吐；折扣幅度随环境浮动，属工程经验。教材多处区分 throughput vs bandwidth（p.230）。","difficulty":1},{"id":"q-11-005","unitId":"11","type":"multiple","knowledgeTermId":["SS-MU-001","SP-CH-001","SS-MIMO-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch19(p.666,674)","S2-2"],"prompt":"下列说法正确的有：（多选，需全对）","options":[{"key":"A","text":"160 MHz 信道由两个 80 MHz 信道组成"},{"key":"B","text":"802.11ac 把空间流上限提高到 8"},{"key":"C","text":"MU-MIMO 只需 AP 支持，与客户端无关"},{"key":"D","text":"带宽翻倍时吞吐必然精确翻倍"}],"answer":["A","B"],"explanation":"A 正确（教材 p.666：160=两个 80 MHz）。B 正确（p.674：ac 支持最多 8 条空间流）。C 错：MU 需要客户端参与（波束成形反馈、同时刻流量、信道可分）。D 错：有开销/竞争/重传折扣。","difficulty":2},{"id":"q-12-001","unitId":"12","type":"single","knowledgeTermId":["ARCH-PLANE-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch10(p.337-339)"],"prompt":"AP 之间协同（如动态信道调整、负载均衡）属于哪个平面？","options":[{"key":"A","text":"管理平面"},{"key":"B","text":"控制平面"},{"key":"C","text":"数据平面"},{"key":"D","text":"应用平面"}],"answer":["B"],"explanation":"教材 p.337–339：管理=配置/监控，控制=AP 间协同策略，数据=用户流量转发（已核对正文）。注意：具体功能在厂商实现中可归入管理产品（WNMS）或控制器。","difficulty":2},{"id":"q-12-002","unitId":"12","type":"single","knowledgeTermId":["TOPO-VLAN-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch13(p.486)"],"prompt":"关于一台射频广播 16 个 SSID，教材的评价是：","options":[{"key":"A","text":"厂商能力上限，应尽量用满"},{"key":"B","text":"坏实践——多余 SSID 带来二层开销（Beacon 挤占空口）"},{"key":"C","text":"IEEE 强制要求"},{"key":"D","text":"与性能无关"}],"answer":["B"],"explanation":"教材 p.486：多数厂商允许一射频广播多至 16 个 SSID，但广播 16 个 SSID 因二层开销是坏实践（已核对正文）。业务隔离应优先用 VLAN 映射而非堆 SSID。","difficulty":1},{"id":"q-12-003","unitId":"12","type":"single","knowledgeTermId":["NET-ROAM-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch12(p.426-428)"],"prompt":"客户端漫游跨越三层边界（不同子网）时：","options":[{"key":"A","text":"与二层漫游无任何区别"},{"key":"B","text":"IP 失效，需要隧道或 Mobile IP（家乡代理/外地代理/转交地址）等机制"},{"key":"C","text":"标准自动改写客户端 IP"},{"key":"D","text":"只需重新关联即可保持 TCP 连接"}],"answer":["B"],"explanation":"教材 p.426–428：Wi-Fi 与漫游本质是二层过程；跨三层边界需隧道/Mobile IP 机制（已核对正文）。","difficulty":2},{"id":"q-12-004","unitId":"12","type":"multiple","knowledgeTermId":["ARCH-AC-001","ARCH-CLOUD-001","TOPO-VLAN-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch10(p.339-343)","S1-1:Ch13(p.486)"],"prompt":"下列说法正确的有：（多选，需全对）","options":[{"key":"A","text":"自主架构不提供重要的无线控制功能，AP 各自独立"},{"key":"B","text":"云管理把管理/监控功能以 SaaS 方式提供"},{"key":"C","text":"WLAN 路由器与 AP 是同一种设备的不同叫法"},{"key":"D","text":"Captive Portal 会把访客的网页访问重定向到登录页"}],"answer":["A","B","D"],"explanation":"A 与教材 p.340 原文一致。B 见 p.343（SaaS）。C 错：WLAN 路由器含 NAT/路由，AP 是桥接虚拟接口（p.358）。D 正确（p.486）。","difficulty":2},{"id":"q-13-001","unitId":"13","type":"single","knowledgeTermId":["ARCH-MCA-001","NET-ROAM-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch12(p.430)"],"prompt":"信道复用设计的核心原则是：","options":[{"key":"A","text":"覆盖与频率都重叠，保证信号最强"},{"key":"B","text":"漫游需要重叠的覆盖，但必须避免重叠的频率"},{"key":"C","text":"覆盖与频率都不重叠"},{"key":"D","text":"频率必须重叠才能漫游"}],"answer":["B"],"explanation":"教材 p.430：为避免同频/邻频干扰需要信道复用；漫游需要重叠的 RF 覆盖单元，但重叠的频率必须避免（已核对正文）。","difficulty":1},{"id":"q-13-002","unitId":"13","type":"single","knowledgeTermId":["SP-CH-001","RF-ACI-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch6(p.229)","S1-1:Ch12(p.430)"],"prompt":"2.4 GHz ISM 频段的非重叠信道是：","options":[{"key":"A","text":"1、6、11（间隔 5 个编号=25 MHz 中心频率间距）"},{"key":"B","text":"1 到 13 任选"},{"key":"C","text":"1、5、9、13"},{"key":"D","text":"只有信道 1"}],"answer":["A"],"explanation":"教材 p.229：HR-DSSS/ERP 信道中心频率需 25 MHz 间距才不重叠 → 1/6/11（已核对正文）。其他组合（如 1/5/9）构成邻频干扰。","difficulty":1},{"id":"q-13-003","unitId":"13","type":"single","knowledgeTermId":["ARCH-SCA-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch12(p.440)"],"prompt":"关于单信道架构（SCA），教材的解释是：","options":[{"key":"A","text":"同频干扰不会发生"},{"key":"B","text":"同频干扰确实存在，只是由控制器集中调度彼此在范围内的 AP 传输"},{"key":"C","text":"SCA 是 IEEE 强制架构"},{"key":"D","text":"SCA 无需任何协调"}],"answer":["B"],"explanation":"教材 p.440 原文：同频干扰确实发生，只是由 WLAN 控制器集中调度（已核对正文）；SCA 属特定厂商架构。","difficulty":2},{"id":"q-13-004","unitId":"13","type":"single","knowledgeTermId":["MAC-RTX-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch16(p.565)"],"prompt":"教材给出的重传率量化红线是：","options":[{"key":"A","text":"干扰导致重传率超过约 10% 时，WLAN 性能/吞吐将受损"},{"key":"B","text":"重传率 50% 才需要处理"},{"key":"C","text":"重传率与吞吐无关"},{"key":"D","text":"标准规定重传率必须为 0"}],"answer":["A"],"explanation":"教材 p.565：若微波炉等干扰设备导致重传率超过约 10%，性能/吞吐将受损（已核对正文）。这是验收与巡检的量化抓手。","difficulty":1},{"id":"q-13-005","unitId":"13","type":"multiple","knowledgeTermId":["ARCH-CAPCOV-001","SP-UNII-001","ARCH-MCA-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch12(p.434,440-443)","S1-1:Ch15"],"prompt":"下列说法正确的有：（多选，需全对）","options":[{"key":"A","text":"现代 WLAN 设计更多按容量而非信号覆盖布点"},{"key":"B","text":"加大发射功率是高密度场景的首要解药"},{"key":"C","text":"不支持 DFS 的客户端只能使用 U-NII-1/3 的信道"},{"key":"D","text":"勘测就是用软件画覆盖热图"}],"answer":["A","C"],"explanation":"A 正确（Ch12 容量 vs 覆盖）。B 错：大功率造成同频对打与粘滞，高密度靠小功率密复用。C 正确（p.434：非 DFS 客户端限于 U-NII-1/3）。D 错：勘测=访谈+设计+验证+交付（Ch15/16），热图只是产物之一。","difficulty":2},{"id":"q-14-001","unitId":"14","type":"single","knowledgeTermId":["SEC-PMK-001","SEC-PTK-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch13(p.481)"],"prompt":"PMK（成对主密钥）由什么产生？","options":[{"key":"A","text":"由四次握手在空中传输给对方"},{"key":"B","text":"可由 802.1X/EAP 或 PSK 认证产生，作为派生最终动态密钥（PTK/GTK）的种子材料"},{"key":"C","text":"由 CCMP 加算法自生成"},{"key":"D","text":"由 DHCP 服务器下发"}],"answer":["B"],"explanation":"教材 p.481 原文：PMK 可由 802.1X/EAP 或 PSK 认证创建，是派生最终动态密钥的种子材料（已核对正文）。PMK 永不上线传输。","difficulty":2},{"id":"q-14-002","unitId":"14","type":"single","knowledgeTermId":["SEC-4WH-001"],"factLevel":"standard-mechanism","sourceRef":["S1-1:Ch13(p.481-482)","S2-1(条款待核)"],"prompt":"四次握手过程中，以下哪一项从不在空中明文传输？","options":[{"key":"A","text":"ANonce 与 SNonce（随机数）"},{"key":"B","text":"PTK"},{"key":"C","text":"MIC"},{"key":"D","text":"EAPOL-Key 消息头"}],"answer":["B"],"explanation":"握手只交换随机数与 MIC；PTK 由 PMK+随机数+地址在两端各自派生，从不传输。猜错口令的端无法派生出正确 PTK、过不了 MIC 校验（密钥层级已核对教材；消息字段条款待核）。","difficulty":2},{"id":"q-14-003","unitId":"14","type":"single","knowledgeTermId":["SEC-SAE-001","SEC-PSK-001","SEC-WPA3-001"],"factLevel":"wfa-cert","sourceRef":["S3-5","S2-1(条款待核)"],"prompt":"WPA3-Personal 相比 WPA2-Personal 的实质改进是：","options":[{"key":"A","text":"加密算法从 AES 换成了新算法"},{"key":"B","text":"认证与密钥交换改用 SAE，抵抗离线字典攻击"},{"key":"C","text":"取消了四次握手"},{"key":"D","text":"只允许 6 GHz 频段使用"}],"answer":["B"],"explanation":"WFA（2018-06-25）：WPA3-Personal 以 SAE 替代 PSK 认证，抗离线字典攻击；数据加密仍是 CCMP/GCMP（SAE 不是加密算法）。四次握手依然存在。","difficulty":2},{"id":"q-14-004","unitId":"14","type":"single","knowledgeTermId":["SEC-WPA2-001","SEC-CCMP-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch13(p.473)","S1-1:Ch13(p.482)"],"prompt":"教材对 WPA（初代）与 TKIP 的表述是：","options":[{"key":"A","text":"WPA 是 802.11i 定稿前的过渡快照，仅支持 TKIP/RC4 动态密钥"},{"key":"B","text":"WPA 与 WPA2 完全等价"},{"key":"C","text":"TKIP 是比 CCMP 更强的加密"},{"key":"D","text":"TKIP 的问题出在 RC4 算法本身不可救药"}],"answer":["A"],"explanation":"教材 p.473：WFA 在 802.11i 批准前推出 WPA 作为过渡快照，仅 TKIP/RC4 动态密钥（已核对正文）。教材 p.482 同时指出：TKIP 的问题不在 RC4 算法，而在密钥生成方式——但 TKIP 仍已被淘汰。","difficulty":2},{"id":"q-14-005","unitId":"14","type":"multiple","knowledgeTermId":["SEC-1X-001","SEC-EAP-001","SEC-CCMP-001","SEC-GCMP-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch13(p.473-480)","S3-5"],"prompt":"下列说法正确的有：（多选，需全对）","options":[{"key":"A","text":"802.1X 含申请者/认证者/认证服务器三种角色"},{"key":"B","text":"EAP-TLS 使用数字证书（客户端与服务器）"},{"key":"C","text":"GCMP 用于高吞吐场景，开销低于 CCMP"},{"key":"D","text":"企业 PSK 认证的安全性与 802.1X 完全相同"}],"answer":["A","B","C"],"explanation":"A 正确（教材 Ch13）。B 正确（Table 13.2：EAP-TLS 双证书，已核对正文）。C 正确（单元 10/11 语境）。D 错：PSK 口令共享、不可审计可撤销，教材 p.484 提醒企业慎用。","difficulty":2},{"id":"q-15-001","unitId":"15","type":"single","knowledgeTermId":["NET-DHCP-001"],"factLevel":"standard-definition","sourceRef":["RFC2131"],"prompt":"DHCP 获取地址的四步（DORA）正确顺序是：","options":[{"key":"A","text":"Offer → Discover → Request → Ack"},{"key":"B","text":"Discover → Offer → Request → Ack"},{"key":"C","text":"Request → Offer → Discover → Ack"},{"key":"D","text":"Discover → Request → Offer → Ack"}],"answer":["B"],"explanation":"DORA：客户端广播 Discover → 服务器 Offer → 客户端广播 Request → 服务器 Ack 确认租约（RFC 2131，rfc-editor.org 已核实）。","difficulty":1},{"id":"q-15-002","unitId":"15","type":"single","knowledgeTermId":["NET-ARP-001"],"factLevel":"standard-definition","sourceRef":["RFC826"],"prompt":"STA 要把包发给其他子网的服务器，ARP 解析得到的是：","options":[{"key":"A","text":"远端服务器的 MAC"},{"key":"B","text":"默认网关的 MAC"},{"key":"C","text":"DNS 服务器的 IP"},{"key":"D","text":"DHCP 服务器的 MAC"}],"answer":["B"],"explanation":"跨网段时帧的目的 MAC 是网关（默认网关的 MAC），目的 IP 才是远端服务器——ARP 解析的是下一跳（RFC 826）。","difficulty":2},{"id":"q-15-003","unitId":"15","type":"single","knowledgeTermId":["NET-DHCP-001","PERF-JIT-001"],"factLevel":"standard-definition","sourceRef":["RFC2131"],"prompt":"客户端地址显示为 169.254.x.x，最直接的含义是：","options":[{"key":"A","text":"DHCP 失败后的自动配置地址——DHCP 环节失败"},{"key":"B","text":"正常的企业内网地址"},{"key":"C","text":"DNS 配置错误"},{"key":"D","text":"加密密钥错误"}],"answer":["A"],"explanation":"169.254/16 是链路本地自动配置地址（DHCP 不可达时的回退）——直接指向 DHCP 环节失败，与加密无关。","difficulty":1},{"id":"q-15-004","unitId":"15","type":"single","knowledgeTermId":["NET-DNS-001","PERF-JIT-001"],"factLevel":"engineering","sourceRef":["RFC1035","S1-1:Ch12(p.451)"],"prompt":"\"能 ping 通 8.8.8.8 但打不开任何网站\"最可能指向：","options":[{"key":"A","text":"Wi-Fi 关联失败"},{"key":"B","text":"DHCP 失败"},{"key":"C","text":"DNS 解析失败"},{"key":"D","text":"加密失败"}],"answer":["C"],"explanation":"IP 与路由都正常（能 ping 公网 IP），域名无法解析 → DNS 环节问题。排障阶梯：二层→DHCP→网关→DNS（教材 Ch12 上层排障思路）。","difficulty":1},{"id":"q-15-005","unitId":"15","type":"multiple","knowledgeTermId":["NET-DHCP-001","NET-ASSOC-001","SEC-4WH-001"],"factLevel":"standard-mechanism","sourceRef":["RFC2131","S1-1:Ch9"],"prompt":"下列说法正确的有：（多选，需全对）","options":[{"key":"A","text":"DHCP Discover 是广播帧（802.11 中发往广播地址）"},{"key":"B","text":"关联成功后客户端立即拥有 IP 地址"},{"key":"C","text":"广播帧不能为单个打盹 STA 缓存，须在 DTIM 时刻投递"},{"key":"D","text":"DHCP 属于 802.11 标准的一部分"}],"answer":["A","C"],"explanation":"A 正确（Discover 广播）。B 错：关联≠IP。C 正确（单元 09 的 DTIM 机制）。D 错：DHCP 是 IETF 协议（RFC 2131），与 802.11 无关。","difficulty":2},{"id":"q-16-001","unitId":"16","type":"single","knowledgeTermId":["MAC-RTX-001","RF-SNR-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch16(p.565)"],"prompt":"抓包显示同一序列号的数据帧反复重传且无碰撞迹象，该 STA 的 RSSI 为 −78 dBm。最可能的诊断是：","options":[{"key":"A","text":"隐藏节点碰撞"},{"key":"B","text":"低 SNR 导致 FCS 失败→重传"},{"key":"C","text":"Deauth 攻击"},{"key":"D","text":"DHCP 故障"}],"answer":["B"],"explanation":"同序列号反复重传=帧到达但损坏（FCS 挂、无 ACK）；RSSI −78 dBm→低 SNR→高阶调制解调失败。隐藏节点的指纹是\"同一时隙多帧碰撞\"。教材 p.565：重传率超约 10% 性能受损。","difficulty":2},{"id":"q-16-002","unitId":"16","type":"single","knowledgeTermId":["DIAG-SPECTRUM-001","DIAG-WIPS-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch3(p.94)","S1-1:Ch14(p.518-522)"],"prompt":"怀疑茶水间微波炉干扰 Wi-Fi，应使用的工具是：","options":[{"key":"A","text":"协议分析仪（抓帧）"},{"key":"B","text":"频谱分析仪（看非编码 RF 能量）"},{"key":"C","text":"ping 网关"},{"key":"D","text":"更换 SSID"}],"answer":["B"],"explanation":"微波炉是非 Wi-Fi 干扰源——频谱仪测量非编码 RF 能量（教材 p.94：测噪声底的正确工具；p.522 频谱分析专节）。协议分析仪只能看到由此产生的重传后果。","difficulty":1},{"id":"q-16-003","unitId":"16","type":"single","knowledgeTermId":["DIAG-ROGUE-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch14(p.501-503)"],"prompt":"符合 \"rogue AP\" 定义的设备是：","options":[{"key":"A","text":"邻居家里可见的家用路由器"},{"key":"B","text":"未经授权接入本方有线网络的无线 AP"},{"key":"C","text":"临时关闭的访客 AP"},{"key":"D","text":"6 GHz 频段的任何 AP"}],"answer":["B"],"explanation":"rogue 的关键是\"未经授权接入受保护的有线网络\"——给内网开了无线后门（教材 Ch14）。邻居网络只是可见的无关网络。","difficulty":1},{"id":"q-16-004","unitId":"16","type":"single","knowledgeTermId":["SEC-MFP-001"],"factLevel":"standard-mechanism","sourceRef":["S1-1:Ch9(p.304)","S2-4"],"prompt":"缓解伪造 Deauth 泛洪（二层 DoS）的标准机制是：","options":[{"key":"A","text":"更长的 WPA2 口令"},{"key":"B","text":"802.11w 管理帧保护（MIC 保护 Deauth/Disassoc）"},{"key":"C","text":"增大发射功率"},{"key":"D","text":"隐藏 SSID"}],"answer":["B"],"explanation":"Deauth 是\"无法拒绝的通知\"（教材 p.304）——传统上无保护可被伪造；802.11w 用 MIC 保护管理帧（单元 14）。隐藏 SSID 与此无关（单元 05）。","difficulty":2},{"id":"q-16-005","unitId":"16","type":"multiple","knowledgeTermId":["DIAG-WIPS-001","DIAG-SPECTRUM-001","DIAG-ROGUE-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch14(p.518-522)","S1-1:Ch16(p.562-569)"],"prompt":"下列说法正确的有：（多选，需全对）","options":[{"key":"A","text":"WIDS 传感器是常听模式的被动射频设备"},{"key":"B","text":"协议分析仪与频谱仪的分工是：帧内容 vs 射频能量"},{"key":"C","text":"WIPS 传感器必须像 AP 一样广播 Beacon 才能工作"},{"key":"D","text":"多信道漫游问题需要多信道捕获能力"}],"answer":["A","B","D"],"explanation":"A 正确（p.518：传感器被动常听，硬件似 AP）。B 正确（p.94/522 分工）。C 错：传感器是被动设备，不广播。D 正确（p.426：漫游分析需多信道监控）。","difficulty":2},{"id":"q-17-001","unitId":"17","type":"single","knowledgeTermId":["EVOL-HE-001","S3-3"],"factLevel":"wfa-cert","sourceRef":["S3-3"],"prompt":"关于 Wi-Fi 6E 认证的官方定位，正确的是：","options":[{"key":"A","text":"独立于 Wi-Fi CERTIFIED 6 的新一代认证"},{"key":"B","text":"6E 认证是 Wi-Fi CERTIFIED 6 的一部分（针对 6 GHz 频段扩展）"},{"key":"C","text":"由 IEEE 直接颁发的认证"},{"key":"D","text":"仅面向企业设备"}],"answer":["B"],"explanation":"WFA 原话：Wi-Fi 6E 认证是 Wi-Fi CERTIFIED 6 的一部分（2021-01-07 可用）——不是独立认证项目【已核实】。认证由 WFA 而非 IEEE 颁发。","difficulty":2},{"id":"q-17-002","unitId":"17","type":"single","knowledgeTermId":["SP-6GHZ-001"],"factLevel":"standard-definition","sourceRef":["S6-1"],"prompt":"中国大陆对 6 GHz 频段（5925–7125 MHz）的规划现状是：","options":[{"key":"A","text":"整段开放给 Wi-Fi 6E/7"},{"key":"B","text":"工信部 2023 版《无线电频率划分规定》率先将 6425–7125 MHz 划分给 IMT（5G/6G）"},{"key":"C","text":"全部保留给军用"},{"key":"D","text":"与 2.4 GHz 规则相同"}],"answer":["B"],"explanation":"2023 年 6 月工信部发布新版《中华人民共和国无线电频率划分规定》，率先在全球将 6425–7125 MHz 划分用于 IMT（含 5G/6G）【已核实（工信部文件公开报道）】。故境内公众 Wi-Fi 无法使用 6 GHz 上半段；部署前须以最新监管为准。","difficulty":2},{"id":"q-17-003","unitId":"17","type":"single","knowledgeTermId":["EVOL-VHT-001"],"factLevel":"standard-definition","sourceRef":["S1-1:Ch19(p.663)"],"prompt":"802.11ac（Wi-Fi 5）的频段支持是：","options":[{"key":"A","text":"2.4 GHz 与 5 GHz"},{"key":"B","text":"仅 5 GHz"},{"key":"C","text":"仅 2.4 GHz"},{"key":"D","text":"2.4/5/6 GHz"}],"answer":["B"],"explanation":"教材 p.663：VHT 面向 5 GHz（已核对正文）。2.4 GHz 上 802.11ac 无定义；6 GHz 属 6E 时代。","difficulty":1},{"id":"q-17-004","unitId":"17","type":"single","knowledgeTermId":["EVOL-320M-001","SP-6GHZ-001"],"factLevel":"standard-definition","sourceRef":["S3-4","S6-1"],"prompt":"Wi-Fi 7 的 320 MHz 信道在中国大陆公众部署的可用性：","options":[{"key":"A","text":"与欧美完全相同"},{"key":"B","text":"基本无频谱可落——320 MHz 依赖 6 GHz 连续频谱，而上半段已划归 IMT"},{"key":"C","text":"2.4 GHz 即可开 320 MHz"},{"key":"D","text":"5 GHz 有四个 320 MHz 信道"}],"answer":["B"],"explanation":"320 MHz 需要连续超宽频谱、实践上绑定 6 GHz（单元 19）；中国大陆 6 GHz 上半段已划给 IMT（已核实）。设备可保留 320 MHz 能力用于监管开放地区。","difficulty":2},{"id":"q-17-005","unitId":"17","type":"multiple","knowledgeTermId":["EVOL-HE-001","EVOL-VHT-001","EVOL-HT-001"],"factLevel":"standard-definition","sourceRef":["S3-1","S2-4"],"prompt":"下列对应关系正确的有：（多选，需全对）","options":[{"key":"A","text":"Wi-Fi 4 = 802.11n（HT）"},{"key":"B","text":"Wi-Fi 5 = 802.11ac（VHT）"},{"key":"C","text":"Wi-Fi 6 = 802.11be（EHT）"},{"key":"D","text":"Wi-Fi 7 = 802.11be（EHT）"}],"answer":["A","B","D"],"explanation":"WFA 2018-10-03 命名：Wi-Fi 4=n、Wi-Fi 5=ac、Wi-Fi 6=ax；Wi-Fi 7=be（CERTIFIED 7，2024-01-08）。C 错：ax≠be，这是最常见的代际张冠李戴。","difficulty":2},{"id":"q-18-001","unitId":"18","type":"single","knowledgeTermId":["PERF-OFDMA-001","SS-MU-001"],"factLevel":"standard-definition","sourceRef":["S2-2"],"prompt":"OFDMA 与 MU-MIMO 的切分维度分别是：","options":[{"key":"A","text":"都是空间维度"},{"key":"B","text":"OFDMA 切频率资源（RU）；MU-MIMO 切空间资源（流）"},{"key":"C","text":"OFDMA 切时间；MU-MIMO 切频率"},{"key":"D","text":"两者完全相同可互换"}],"answer":["B"],"explanation":"OFDMA 把信道划成 RU 在频率维度分给多用户；MU-MIMO 用空间流在空间维度分给多用户（802.11ax-2021 引入 UL；编号已核实）。两者可叠加。","difficulty":2},{"id":"q-18-002","unitId":"18","type":"single","knowledgeTermId":["PERF-OFDMA-001"],"factLevel":"standard-mechanism","sourceRef":["S2-2","S3-2"],"prompt":"OFDMA 上行传输的发起方式是：","options":[{"key":"A","text":"各 STA 自由竞争、先到先得"},{"key":"B","text":"AP 通过触发帧（Trigger Frame）调度 STA 在指定 RU 上同时上行"},{"key":"C","text":"STA 随机选择 RU 发送"},{"key":"D","text":"由 DHCP 服务器协调"}],"answer":["B"],"explanation":"OFDMA 上下行均由 AP 调度：下行直接分配 RU，上行经触发帧集合多 STA 同时发送（802.11ax 机制；调度策略属厂商实现）。","difficulty":2},{"id":"q-18-003","unitId":"18","type":"single","knowledgeTermId":["MAC-TWT-001","MAC-TIM-001"],"factLevel":"standard-mechanism","sourceRef":["S2-2","S1-1:Ch9(p.313-315)"],"prompt":"TWT 与传统省电模式的关键区别是：","options":[{"key":"A","text":"TWT 传输更快"},{"key":"B","text":"TWT 是 STA 与 AP 协商的预约式唤醒计划，不绑定 Beacon 节奏"},{"key":"C","text":"TWT 只用于下载"},{"key":"D","text":"TWT 取消了加密"}],"answer":["B"],"explanation":"传统 PS 绑定 Beacon/TIM 节奏（单元 09）；TWT 让 STA 与 AP 协商唤醒时刻，IoT 可长睡降功耗（802.11ax 机制）。","difficulty":2},{"id":"q-18-004","unitId":"18","type":"single","knowledgeTermId":["MAC-BC-001"],"factLevel":"standard-mechanism","sourceRef":["S2-2"],"prompt":"关于 BSS Coloring（空间复用），正确的是：","options":[{"key":"A","text":"给相邻 AP 自动分配不同信道"},{"key":"B","text":"为 BSS 打\"颜色\"标记，STA 识别他 BSS 帧后按阈值判断可否并行传输"},{"key":"C","text":"一种跳频扩频技术"},{"key":"D","text":"用于加密邻区流量"}],"answer":["B"],"explanation":"BSS Coloring 不改频率： STA 识别他 BSS 的帧并判断\"信号够弱即并行\"，减少不必要的退避（802.11ax 空间复用；判定细则条款待核）。","difficulty":2},{"id":"q-18-005","unitId":"18","type":"multiple","knowledgeTermId":["PERF-OFDMA-001","EVOL-QAM4K-001","MAC-TWT-001"],"factLevel":"standard-definition","sourceRef":["S3-4","S2-2"],"prompt":"下列说法正确的有：（多选，需全对）","options":[{"key":"A","text":"Wi-Fi 6 在 2.4/5 GHz 频段均可运行"},{"key":"B","text":"OFDMA 的收益主要在多用户小流量并发场景"},{"key":"C","text":"1024-QAM 由 802.11ax 引入（MCS10/11）"},{"key":"D","text":"TWT 强制所有设备同一时刻唤醒"}],"answer":["A","B","C"],"explanation":"A 正确（HE 覆盖 2.4/5/6 GHz）。B 正确（OFDMA 拼桌效应）。C 正确（HE 引入 MCS10/11 的 1024-QAM）。D 错：TWT 恰恰是各自协商、错峰唤醒。","difficulty":2},{"id":"q-19-001","unitId":"19","type":"single","knowledgeTermId":["EVOL-MLO-001"],"factLevel":"wfa-cert","sourceRef":["S3-4","S2-3"],"prompt":"WFA 对 MLO 的官方定义是：","options":[{"key":"A","text":"在两条链路间快速切换（同一时刻只用一条）"},{"key":"B","text":"允许设备通过多条链路同时收发数据"},{"key":"C","text":"把多个 SSID 绑定到一个网卡"},{"key":"D","text":"聚合多个 ISP 宽带"}],"answer":["B"],"explanation":"WFA CERTIFIED 7 官方措辞：MLO \"allows devices to transmit and receive data simultaneously over multiple links\"【已核实】。A 是传统双频/快速切换语义。","difficulty":1},{"id":"q-19-002","unitId":"19","type":"single","knowledgeTermId":["EVOL-QAM4K-001"],"factLevel":"wfa-cert","sourceRef":["S3-4"],"prompt":"关于 4096-QAM，WFA 的表述是：","options":[{"key":"A","text":"称为 4K QAM，较 1024-QAM 提高约 20% 传输速率"},{"key":"B","text":"称为 40K QAM，速率翻四倍"},{"key":"C","text":"只用于 2.4 GHz"},{"key":"D","text":"取代了 OFDMA"}],"answer":["A"],"explanation":"WFA 官方写法 4K QAM：\"achieves 20% higher transmission rates than 1024 QAM\"【已核实】。IEEE 语境写 4096-QAM——术语库采用 IEEE 名称并注明 WFA 写法。","difficulty":1},{"id":"q-19-003","unitId":"19","type":"single","knowledgeTermId":["EVOL-320M-001","SP-6GHZ-001"],"factLevel":"standard-definition","sourceRef":["S3-4","S6-1"],"prompt":"320 MHz 信道落地的前提条件是：","options":[{"key":"A","text":"任何频段都可开"},{"key":"B","text":"需要连续超宽频谱，实践上绑定 6 GHz，且受当地监管约束"},{"key":"C","text":"只需固件升级，与频谱无关"},{"key":"D","text":"只在 2.4 GHz 可用"}],"answer":["B"],"explanation":"320 MHz 是 CERTIFIED 7 特性【已核实】；可用性取决于 6 GHz 连续频谱与当地监管（中国大陆上半段划归 IMT，已核实）。","difficulty":2},{"id":"q-19-004","unitId":"19","type":"multiple","knowledgeTermId":["EVOL-EHT-001","EVOL-MLO-001","S2-6"],"factLevel":"standard-definition","sourceRef":["S3-4","S2-3","S2-6"],"prompt":"下列说法正确的有：（多选，需全对）","options":[{"key":"A","text":"Wi-Fi CERTIFIED 7 于 2024-01-08 启动，基于 802.11be（EHT）"},{"key":"B","text":"官方特性还包括 512 压缩 Block Ack 与 Multiple RUs to a single STA"},{"key":"C","text":"802.11bn（UHR/Wi-Fi 8 方向）已是发布标准"},{"key":"D","text":"MLO 的收益包括聚合吞吐、低时延与可靠性"}],"answer":["A","B","D"],"explanation":"A/B/D 均与 WFA CERTIFIED 7 官方材料一致【已核实】。C 错：802.11bn 仍是草案（预计 ~2028 批准），不得当标准引用。","difficulty":2}]},"data/source-map.json":{"schemaVersion":"1.0","updated":"2026-10-24","note":"来源映射的机器可读版。完整说明与使用规则见 docs/source-map.md。","sources":[{"id":"S1-1","type":"book-local","title":"CWNA: Certified Wireless Network Administrator Official Study Guide, Fourth Edition","authors":["David A. Westcott","David D. Coleman"],"publisher":"Wiley/Sybex","year":2014,"isbn":"978-1-118-89370-8","exam":"CWNA-106","localPath":"D:/Superfly/AI/WIFI/CWNA.pdf","pages":915,"verification":"verified-primary","scope":"书名页/版权页/全书目录已一手提取；正文按单元逐章精读前不得直接引用"},{"id":"S2-1","type":"standard","title":"IEEE Std 802.11-2024","role":"current rollup","approved":"2024-09-26","published":"2025-04-28","url":"https://standards.ieee.org/ieee/802.11/10548","freeAccess":"IEEE GET Program","verification":"verified-official-page"},{"id":"S2-2","type":"standard","title":"IEEE Std 802.11ax-2021","role":"amendment: HE","approved":"2021-02-09","published":"2021-05-19","url":"https://standards.ieee.org/standard/802_11ax-2021.html","verification":"verified-official-page"},{"id":"S2-3","type":"standard","title":"IEEE Std 802.11be-2024","role":"amendment: EHT","approved":"2024-09-26","published":"2025-07-22","url":"https://standards.ieee.org/standard/802_11be-2024.html","verification":"verified-official-page"},{"id":"S2-4","type":"standard","title":"IEEE Std 802.11n-2009 / 802.11ac-2013 / 802.11-2012","role":"historical anchors","verification":"verified-official-page"},{"id":"S2-5","type":"standard","title":"IEEE Std 802.11bh-2024 / 802.11bk-2025 / 802.11bf-2025","verification":"verified-official-page"},{"id":"S2-6","type":"draft","title":"P802.11bn (UHR)","status":"draft, predicted approval ~2028-05","verification":"verified-official-page","restriction":"不得作为标准引用"},{"id":"S2-7","type":"website","title":"IEEE 802.11 Working Group","url":"https://www.ieee802.org/11/","verification":"verified-official-page"},{"id":"S2-8","type":"program","title":"IEEE GET Program (free 802 access, copyright retained)","url":"https://standards.ieee.org/about/get/","verification":"verified-official-page"},{"id":"S3-1","type":"wfa","title":"Wi-Fi generational naming (Wi-Fi 4/5/6)","date":"2018-10-03","url":"https://www.wi-fi.org/news-events/newsroom/wi-fi-alliance-introduces-wi-fi-6","verification":"verified-official-page"},{"id":"S3-2","type":"wfa","title":"Wi-Fi CERTIFIED 6 launch","date":"2019-09-16","verification":"verified-official-page"},{"id":"S3-3","type":"wfa","title":"Wi-Fi 6E (named 2020-01-03; certification 2021-01-07)","verification":"verified-official-page"},{"id":"S3-4","type":"wfa","title":"Wi-Fi CERTIFIED 7 launch","date":"2024-01-08","url":"https://www.wi-fi.org/news-events/newsroom/wi-fi-alliance-introduces-wi-fi-certified-7","verification":"verified-official-page"},{"id":"S3-5","type":"wfa","title":"Wi-Fi CERTIFIED WPA3","date":"2018-06-25","verification":"verified-official-page"},{"id":"S3-6","type":"wfa","title":"Wi-Fi Enhanced Open","date":"2018","verification":"verified-official-page"},{"id":"S3-7","type":"wfa","title":"WMM / WMM-Power Save","verification":"verified-official-page"},{"id":"S3-8","type":"wfa","title":"Regulations Enabling 6 GHz Wi-Fi","url":"https://www.wi-fi.org/regulations-enabling-6-ghz-wi-fi","verification":"verified-official-page"},{"id":"S3-9","type":"wfa","title":"WPA2 launch year","verification":"unverified","note":"2004 说未在 wi-fi.org 核实"},{"id":"S4-1","type":"cwnp","title":"CWNA certification page (CWNA-110 current)","url":"https://www.cwnp.com/certifications/cwna","verification":"verified-official-page"},{"id":"S4-2","type":"cwnp","title":"CWNA-110 Exam Objectives (Sept 2026)","url":"https://www.cwnp.com/uploads/cwna-110-objectives-2026.pdf","verification":"verified-official-page","note":"官方文档内部 10%/20% 权重矛盾已记录"},{"id":"S4-3","type":"cwnp","title":"CWNA-110 Study and Reference Guide: Digital Edition","price":"$74.99","url":"https://www.cwnp.com/product/cwnadigitalstudyguide110de","verification":"verified-official-page (bibliographic); content unverified"},{"id":"S4-4","type":"cwnp","title":"CWNA-109 Exam Objectives (Sept 2023)","verification":"verified-official-page"},{"id":"S5-1","type":"book","title":"CWNA Study Guide, 6th Edition (Exam CWNA-108)","year":2021,"isbn":"978-1-119-73450-5","tocSource":"https://media.wiley.com/product_data/excerpt/09/11197345/1119734509-9.pdf","verification":"TOC verified; content unverified"},{"id":"S5-2","type":"book","title":"CWNA Study Guide, 5th Edition (Exam CWNA-107)","year":2018,"isbn":"978-1-119-54940-6","verification":"verified-official-page (bibliographic)"},{"id":"S6-1","type":"regulation","title":"工信部 2023 版《中华人民共和国无线电频率划分规定》（6425–7125 MHz → IMT）","date":"2023-06","urls":["https://gxt.fujian.gov.cn/jdhy/zxzcfg/gjzcfg/202306/t20230628_6194431.htm"],"verification":"verified-public-record (2026-10-24)"}],"unitSourceMap":{"00":["S4-2"],"01":["S1-1:Ch1","S2-1","S2-7","S3-1"],"02":["S1-1:Ch2","S1-1:Ch3","S2-1"],"03":["S1-1:Ch2","S1-1:Ch3","S2-1"],"04":["S1-1:Ch4","S2-1"],"05":["S1-1:Ch7","S2-1","S2-5"],"06":["S1-1:Ch9","S2-1","S4-2"],"07":["S2-1","S1-1:Ch9"],"08":["S1-1:Ch8","S1-1:Ch9","S1-1:Ch12","S2-1"],"09":["S1-1:Ch9","S1-1:Ch18","S2-1"],"10":["S1-1:Ch6","S1-1:Ch18","S1-1:Ch19","S2-2","S2-4"],"11":["S1-1:Ch4","S1-1:Ch6","S1-1:Ch18","S1-1:Ch19","S2-2"],"12":["S1-1:Ch10","S1-1:Ch12","S1-1:Ch13","S5-1(目录)"],"13":["S1-1:Ch12","S1-1:Ch15","S1-1:Ch16","S4-2"],"14":["S1-1:Ch13","S2-1","S3-5"],"15":["S1-1:Ch10","S1-1:Ch11","课程自补(RFC待核)"],"16":["S1-1:Ch12","S1-1:Ch14","S1-1:Ch16"],"17":["S2-1","S2-2","S2-4","S3-1","S3-3","S3-8","S1-1:Ch5","S1-1:Ch18","S1-1:Ch19"],"18":["S2-2","S3-2","S3-3","S5-1:Ch19(仅章题)"],"19":["S2-3","S3-4"]}},"data/animations.json":{"passive-scan":{"title":"动画 1 · 被动扫描（Passive Scanning）","subtitle":"STA 只听不发，靠 AP 周期广播的 Beacon 发现网络","simplification":"省略了各信道驻留时长的具体取值、扫描调度策略（各厂商不同）、Beacon 内全部信息元素，以及扫描缓存机制；Beacon 间隔取常见默认值约 100 TU 仅作示意（厂商默认，标准取值待核）。","actors":["STA（站点）","AP1 · BSS1（信道 1）","AP2 · BSS2（信道 6）"],"steps":[{"kind":"state","label":"STA：未认证、未关联（State 1）","state":"未认证、未关联","narration":"接入前的初始状态。802.11 用状态机（State 1/2/3）描述接入进度，见正文状态机图解。"},{"kind":"note","label":"信道 1：静默侦听","narration":"STA 调谐到信道 1 并等待。被动扫描不发送任何帧，只收听。"},{"kind":"bcast","from":1,"label":"Beacon（广播）","state":"已记录 BSS1（SSID、BSSID、能力、速率、时间戳）","narration":"AP1 周期性广播信标帧：携带 SSID、BSSID、能力信息、支持速率、TSF 时间戳等。STA 记录 BSS1。Beacon 由 AP 发送（IBSS 中由成员 STA 轮流发送）。"},{"kind":"note","label":"切换到信道 6：继续侦听","narration":"在一个信道驻留一段时间后，STA 切换到下一个信道。Beacon 只出现在 AP 所在信道，因此必须逐信道侦听。"},{"kind":"bcast","from":2,"label":"Beacon（广播）","state":"已记录 BSS1、BSS2","narration":"AP2 在信道 6 广播 Beacon，STA 记录 BSS2。"},{"kind":"note","label":"汇总扫描结果，形成候选网络列表","narration":"一轮被动扫描结束。STA 汇总信息供用户或系统选择要加入的网络。扫描可以反复进行，也可以与连接后的后台扫描并存。"},{"kind":"state","label":"STA：仍未关联，但已掌握候选网络","state":"未认证、未关联（已完成一轮扫描）","narration":"被动扫描优点：STA 不发帧、功耗低；缺点：发现速度受 Beacon 周期限制（常见默认约 100 TU≈102.4 ms，厂商默认）。"}]},"active-scan":{"title":"动画 2 · 主动扫描（Active Scanning）","subtitle":"STA 广播 Probe Request，匹配的 AP 以 Probe Response 应答","simplification":"省略了信道驻留时间、Probe Response 发送前的信道竞争/退避（多 AP 同信道应答时需要）、以及按需扫描的调度细节；“通配符 SSID”即 SSID 字段置空（null）的探测请求。","actors":["STA（站点）","AP1（信道 1）","AP2（信道 6）"],"steps":[{"kind":"state","label":"STA：未认证、未关联（State 1）","state":"未认证、未关联","narration":"与被动扫描相同的起点。"},{"kind":"note","label":"信道 1：广播 Probe Request","narration":"STA 主动发送探测请求帧。可携带目标 SSID（定向询问），也可将 SSID 字段置空（通配符，询问所有网络）。"},{"kind":"msg","from":1,"to":0,"label":"Probe Response（单播）","state":"已记录 BSS1","narration":"信道 1 上的 AP1 以探测响应帧应答，内容与 Beacon 基本一致（SSID、BSSID、能力、速率、RSN 信息等）。"},{"kind":"note","label":"AP2 收不到信道 1 的探测请求","narration":"探测请求不会跨信道传播。AP2 工作在信道 6，因此保持沉默——这就是主动扫描必须逐信道发送的原因。"},{"kind":"note","label":"信道 6：广播 Probe Request","narration":"STA 顺序切换到信道 6 再次广播。"},{"kind":"msg","from":2,"to":0,"label":"Probe Response（单播）","state":"已记录 BSS1、BSS2","narration":"AP2 应答。若同一信道有多个 AP，各 AP 的响应需先经信道竞争（本动画未画出退避过程）。"},{"kind":"note","label":"多个响应时按信号强度与质量择优","narration":"收到多个探测响应时，客户端通常按信号强度/质量等特征选择目标 AP（教材第 9 章表述，属客户端实现行为）。"},{"kind":"state","label":"候选列表更新完成；连接后也可周期性离道扫描","state":"未认证、未关联（已完成一轮扫描）","narration":"主动扫描发现速度快。已关联的客户端也常每隔几秒离道主动扫描以维护可漫游 AP 列表——频率高低属厂商专有实现（教材第 9 章）。现代系统常用“按需扫描”：仅扫描上次连接记住的信道以缩短耗时。"}]},"auth-open":{"title":"动画 3 · 开放系统认证 → 关联（Open System Authentication → Association）","subtitle":"认证是进入 BSS 的第一步，关联是第二步；顺序不可颠倒","simplification":"省略了帧重传、能力协商失败与状态码非 0 的分支、基本速率不匹配导致关联被拒的分支；RSN（WPA）网络中认证阶段之后、传输业务数据之前还需四次握手（单元 14）——本动画不展开。","actors":["STA（站点）","AP1"],"steps":[{"kind":"state","label":"State 1：未认证、未关联","state":"State 1：未认证、未关联","narration":"站点必须先认证、后关联，才能经 AP 转发流量。"},{"kind":"msg","from":0,"to":1,"label":"Authentication Request（算法=开放系统）","state":"State 1 → State 2 中","narration":"STA 发送认证请求（认证算法字段=开放系统）。开放系统认证不携带口令、不进行任何校验——任何请求都会被“成功”。"},{"kind":"msg","from":1,"to":0,"label":"Authentication Response（状态=成功）","state":"State 2：已认证、未关联","narration":"AP 回应认证响应（状态码=成功）。进入 State 2。真正的准入控制在 RSN 网络中由后续密钥协商/802.1X/SAE 完成（单元 14）。"},{"kind":"note","label":"对照：共享密钥认证（WEP）已弃用","narration":"教材指出：开放系统与共享密钥（WEP 挑战-应答）两种传统认证都不足以支撑企业安全；WEP 已被破解。现代安全见单元 14。"},{"kind":"msg","from":0,"to":1,"label":"Association Request（能力、SSID、支持速率、RSN IE、侦听间隔…）","state":"State 2 → State 3 中","narration":"STA 请求加入 BSS。AP 还会检查基本速率：客户端必须支持 AP 要求的全部基本速率才可能关联成功。"},{"kind":"msg","from":1,"to":0,"label":"Association Response（成功，AID=3）","state":"State 3：已关联（待安全机制）","narration":"AP 接受请求并分配关联 ID（AID）。进入 State 3：已关联。"},{"kind":"state","label":"State 3：链路层接入完成","state":"State 3：已关联","narration":"此时 STA 是 BSS 成员。但在 RSN 网络中还需四次握手安装密钥（单元 14），再经 DHCP 获取 IP（单元 15）才能访问互联网。关联成功 ≠ 能上网。"},{"kind":"note","label":"反向过程：Disassociation / Deauthentication","narration":"解除关联与解除认证都是“通知”而非请求，任一方可发送且无法被拒绝（启用 802.11w 管理帧保护且 MIC 校验失败时除外）。Deauth 会连带解除关联。"}]},"auth-sae":{"title":"动画 4 · 认证机制对比：开放系统 vs SAE（WPA3-Personal）","subtitle":"“认证”不是一种机制：开放系统无校验，SAE 是真正的口令认证+密钥交换","simplification":"省略了 SAE/Dragonfly 的群运算细节、commit/confirm 的确切轮次、anti-clogging 令牌与 MAC 加密保护；SAE 产出的 PMK 如何用于四次握手见单元 14。SAE 由 IEEE 802.11-2016 引入（条款级引用待核），WFA 于 2018-06-25 发布 WPA3 认证（已核实）。","actors":["STA（站点）","AP1"],"steps":[{"kind":"phase","label":"对比一：开放系统认证（两条消息，无口令校验）","state":"—","narration":"动画 3 已演示：请求/响应各一条，任何 STA 都能“认证成功”。它只完成状态迁移，不验证身份。"},{"kind":"note","label":"开放系统：Auth Req → Auth Resp（成功）","narration":"适用于开放网络，或作为 RSN 接入的状态迁移步骤（真实准入在密钥协商阶段完成）。"},{"kind":"phase","label":"对比二：SAE（WPA3-Personal 采用）","state":"—","narration":"SAE=Simultaneous Authentication of Equals（对等同时认证）：双方对等地互相证明知道同一口令，并协商出 PMK。"},{"kind":"msg","from":0,"to":1,"label":"SAE Commit","state":"SAE 交换中","narration":"STA 提交基于口令的椭圆曲线群元素（运算细节简化）。"},{"kind":"msg","from":1,"to":0,"label":"SAE Commit","state":"SAE 交换中","narration":"AP 侧同样提交——对等意味着双方执行同样的证明，不存在“服务端单方面发挑战”的旧模型。"},{"kind":"msg","from":0,"to":1,"label":"SAE Confirm","state":"SAE 交换中","narration":"确认消息往返。完成后双方各自导出 PMK。口令错误的一方推不出正确 PMK；攻击者也难以实施离线字典攻击（这是 SAE 相对 PSK 的核心安全收益）。"},{"kind":"msg","from":1,"to":0,"label":"SAE Confirm","state":"认证完成：双方持有 PMK","narration":"认证完成后进入关联，再以四次握手基于 PMK 安装会话密钥。注意：SAE 是认证与密钥交换机制，不是数据加密算法——加密仍由 CCMP/GCMP 承担。"},{"kind":"state","label":"结论：认证机制不同，后续流程（关联→四次握手）一致","state":"State 2 → 后续关联","narration":"无论开放系统还是 SAE，之后都要关联；RSN 下四次握手紧随其后。把“认证成功”当成“验证过口令”是最常见误区。"}]},"roam":{"title":"动画 5 · 漫游：重新关联（Roaming = Reassociation）","subtitle":"同一 ESS 内从 AP1 的 BSS 迁移到 AP2 的 BSS","simplification":"省略了扫描细节（复用动画 1/2）、AP2 与 AP1 之间经分布式系统的上下文交接（802.11 标准未规定 AP 间协议，教材明确其属厂商/控制器私有实现；IAPP/802.11F 已撤销）、以及密钥在漫游中的处理（RSN 与 802.11r FT 的差异见单元 14 延伸）。","actors":["STA（移动中）","AP1 · 原 BSS","AP2 · 同一 ESS"],"steps":[{"kind":"state","label":"初始：已关联 AP1（State 3）","state":"已关联 AP1","narration":"STA 在 AP1 的 BSS 中正常通信。"},{"kind":"note","label":"STA 远离 AP1，信号逐渐衰减","state":"已关联 AP1（信号下降）","narration":"漫游的常见推动力是射频条件变化；负载均衡等策略也可触发（厂商实现）。"},{"kind":"note","label":"RSSI 低于漫游触发阈值 → 决定漫游","state":"漫游决策（厂商实现）","narration":"IEEE 802.11 不规定漫游决策算法与阈值——何时漫游由驱动/厂商实现决定（教材第 9/12 章）；802.11k/v 提供测量与管理辅助。可运行下方“漫游决策实验室”观察。"},{"kind":"note","label":"扫描候选信道（主动/被动/按需扫描）","state":"扫描中","narration":"STA 在候选信道上寻找同一 ESS（同 SSID）中信号更好的 BSS。"},{"kind":"msg","from":0,"to":2,"label":"Reassociation Request（携带原 AP 的 BSSID）","state":"重新关联中","narration":"STA 向 AP2 发送重新关联请求，帧中包含当前 AP1 的地址——这让 AP2 知道该向谁请求该客户端的上下文。"},{"kind":"note","label":"AP2 ⇄ AP1 经分布式系统交接（标准未规定）","state":"上下文交接（简化）","narration":"新 AP 尝试通知原 AP 并请求转发缓存数据；这类 AP 间通信不由 802.11 标准定义，属厂商/控制器/云平面实现（单元 12）。"},{"kind":"msg","from":2,"to":0,"label":"Reassociation Response（成功，新 AID）","state":"已关联 AP2（State 3）","narration":"AP2 接受并分配新的 AID。STA 的关联从 BSS1 迁移到 BSS2，二层漫游完成。若重新关联失败，STA 保留与原 AP 的连接（教材表述）。"},{"kind":"state","label":"漫游完成；IP 是否变化取决于是否同一子网","state":"已关联 AP2","narration":"同一子网内 IP 通常保持（二层漫游）；跨子网涉及三层问题（单元 12/15）。加密密钥在漫游中的处理依机制而异（单元 14 延伸）。"}]},"power-save":{"title":"动画 6 · 省电模式与 TIM/DTIM（Power Save）","subtitle":"STA 打盹、AP 缓存，Beacon 里的 TIM 是取件通知","simplification":"省略了 PS-Poll 重试与 More Data 位、U-APSD 的服务间隔协商、802.11n 的 PS 增强；IBSS 场景改用 ATIM（本动画只演示基础设施模式）；缓存帧的实际下发顺序依实现而异。","actors":["STA（省电）","AP"],"steps":[{"kind":"state","label":"STA 活跃（Active mode）","state":"Active mode","narration":"传统 802.11 两种省电模式之一；另一为 Power Save 模式（教材 p.313）。"},{"kind":"msg","from":0,"to":1,"label":"Null 帧（Power Mgmt 位=1）","state":"STA 进入打盹（doze）","narration":"STA 用空函数帧（null function frame）把 Power Management 位置 1，通知 AP 自己要省电（教材 p.312，已核对正文）。打盹期间 STA 无法收发。"},{"kind":"note","label":"单播帧到达 AP → 被缓存","state":"AP 缓存中 1 帧","narration":"AP 知道 STA 在打盹，为其缓存单播流量。"},{"kind":"bcast","from":1,"label":"Beacon（含 TIM 位图）","state":"TIM 指示：有缓存帧","narration":"AP 周期广播的 Beacon 携带流量指示图（TIM）：位图中该 STA 的位=1，表示\"有你的缓存帧\"（教材 p.313-314）。"},{"kind":"msg","from":0,"to":1,"label":"PS-Poll","state":"STA 短暂苏醒","narration":"STA 在 Beacon 时刻醒来、读到自己的 TIM 位后，发送 PS-Poll 请求取帧（简化：省略重试与 More Data）。"},{"kind":"msg","from":1,"to":0,"label":"缓存的数据帧","state":"取件完成","narration":"AP 下发缓存帧，STA 确认后继续打盹。这就是\"省电换时延\"的基本权衡。"},{"kind":"phase","label":"广播/组播怎么办：DTIM","state":"—","narration":"组播/广播帧不能为单个 STA 缓存——所有打盹的 STA 都必须在 DTIM 时刻醒来。"},{"kind":"bcast","from":1,"label":"Beacon（TIM 位即 DTIM）","state":"全组苏醒","narration":"TIM 计数到 DTIM 间隔（TIM 中的 DTIM 值为 0 表示本 Beacon 即 DTIM，教材 p.315），随后 AP 立即发送组播/广播帧（教材 p.315）。DTIM 间隔越大越省电，但组播时延越大。"},{"kind":"state","label":"收尾：省电模式的关键参数都在 Beacon 里","state":"回到打盹","narration":"Beacon 周期与 DTIM 间隔共同决定打盹设备的唤醒节奏；VoWiFi 等时延敏感业务对 DTIM 敏感。WMM-PS/U-APSD 提供按需的更高效机制（延伸）。"}]},"4wh":{"title":"动画 7 · 四次握手（4-Way Handshake）——会话密钥的安装","subtitle":"在 PMK 之上派生并安装 PTK/GTK（RSN 网络关联之后进行）","simplification":"消息级细节（ANonce/SNonce/MIC 的精确字段与重试规则）条款级引用待核（802.11-2024）；密钥层级本身（PMK→PTK/GTK）已对照教材 p.481；组密钥握手（GTK 更新）未演示；FT（802.11r）的漫游中握手变体未演示。","actors":["STA（申请者）","AP（认证者）"],"steps":[{"kind":"phase","label":"前提：双方已各自持有 PMK","state":"PMK 已就绪","narration":"PMK 来自哪里？PSK 认证直接由口令派生；802.1X/EAP 认证在认证结束时生成；WPA3-Personal 则来自 SAE 交换（教材 p.481：PMK 可由 802.1X/EAP 或 PSK 认证产生，已核对正文）。"},{"kind":"note","label":"触发：关联完成（State 3，待安全机制）","state":"关联后","narration":"单元 06 的状态机里，State 3 标注\"待安全机制\"——就是指现在这一步。"},{"kind":"msg","from":1,"to":0,"label":"消息 1：ANonce","state":"协商随机数","narration":"AP 发出自己的随机数 ANonce（明文）。随机数保证每次会话派生出的密钥都不同（防重放）。"},{"kind":"msg","from":0,"to":1,"label":"消息 2：SNonce + MIC","state":"STA 侧已装 PTK","narration":"STA 回送自己的随机数 SNonce。此时 STA 已用 PMK+两个随机数+双方地址派生出 PTK（其中 KCK 用于计算 MIC 保护后续握手消息）。"},{"kind":"msg","from":1,"to":0,"label":"消息 3：GTK（经 PTK 加密）+ MIC","state":"AP 侧已装 PTK；下发组密钥","narration":"AP 同样派生 PTK，验证消息 2 的 MIC（证明对方持有 PMK），随后把组密钥 GTK 加密下发——让 STA 能收组播/广播。"},{"kind":"msg","from":0,"to":1,"label":"消息 4：MIC（确认安装）","state":"四次握手完成","narration":"STA 确认 GTK 已装并回复 MIC——AP 据此确认双方密钥一致。相互密钥确认完成。"},{"kind":"state","label":"PTK/GTK 安装完成 → 开始加密通信","state":"受保护通信可用","narration":"PTK 中的 TK 用于单播数据加密（CCMP/GCMP），GTK 保护组播/广播。从此帧体的 Protected 位=1（单元 07）。"},{"kind":"note","label":"安全要点：口令错误=派生不出正确 PTK","state":"—","narration":"四次握手并不传输口令或 PMK 本身；猜错口令的 STA 无法算出正确 PTK、过不了 MIC 校验。WPA3 的 SAE 在此之前先行认证（单元 06 动画 4），让离线字典攻击失效。"}]},"ip-boot":{"title":"动画 8 · 关联之后：DHCP / ARP / DNS（拿到 IP 并上网）","subtitle":"关联成功只是二层的事——三层与互联网还在后面","simplification":"省略了 DHCP 中继、租期续约（T1/T2）、ARP 缓存老化、DNS 递归层级与 TLS 等上层细节；AP 的桥接与 VLAN 打标（单元 12）简化为直通；IPv6 全程未画。","actors":["STA","AP/交换机","DHCP/ DNS 服务器","互联网"],"steps":[{"kind":"state","label":"关联完成、四次握手已装密钥（二层就绪）","state":"L2 就绪，无 IP","narration":"此刻 STA 尚无 IP 地址——没有 IP 就无法与互联网对话（单元 06 的核心结论）。"},{"kind":"msg","from":0,"to":1,"label":"DHCP Discover（广播）","state":"寻找 DHCP 服务器","narration":"STA 广播 DHCPDISCOVER（0.0.0.0 → 255.255.255.255）。广播帧不会被 AP 缓存——这也解释了 DTIM 的意义（单元 09）。"},{"kind":"msg","from":2,"to":0,"label":"DHCP Offer","state":"收到地址提议","narration":"服务器提议一个 IP（如 10.1.10.51）与租期、网关、DNS 等（RFC 2131）。"},{"kind":"msg","from":0,"to":2,"label":"DHCP Request（广播确认）","state":"请求该地址","narration":"STA 广播 REQUEST 正式申请该地址（同时告知其他服务器放弃）。"},{"kind":"msg","from":2,"to":0,"label":"DHCP ACK","state":"L3 就绪：10.1.10.51","narration":"服务器确认租约。STA 现在有 IP、掩码、网关与 DNS——三层世界的大门打开。"},{"kind":"note","label":"第一次出网前：ARP 解析网关 MAC","state":"ARP 网关","narration":"要把包发给默认网关（10.1.10.1），STA 需先 ARP 得到其 MAC（RFC 826）。"},{"kind":"msg","from":0,"to":2,"label":"DNS 查询：example.com","state":"解析域名","narration":"应用发起域名解析（RFC 1035）。没有 DNS，\"能上网\"也只是能ping IP 而已。"},{"kind":"msg","from":0,"to":3,"label":"TCP/HTTP(S) → 互联网","state":"业务流量上线","narration":"终于：用户数据经网关路由/NAT 出互联网。任何一环失败（DHCP/网关/DNS），现象都不同——单元 16 排障的第一课就是分层定位。"},{"kind":"state","label":"总结：关联 ≠ 上网","state":"全链路打通","narration":"从扫描到上网：扫描→认证→关联→四次握手→DHCP→ARP/DNS→业务。八个环节，任何一环都有专属故障模式。"}]}},"data/search-index.json":{"schemaVersion":"1.0","updated":"2026-10-24","entries":[{"type":"unit","id":"00","title":"单元 00 · 课程导航与基础测评","text":"00 课程导航与基础测评  "},{"type":"unit","id":"01","title":"单元 01 · Wi-Fi 的发展、标准组织与技术体系","text":"01 Wi-Fi 的发展、标准组织与技术体系 Ch1 "},{"type":"unit","id":"02","title":"单元 02 · 电磁波、频率、波长、功率与 dBm","text":"02 电磁波、频率、波长、功率与 dBm Ch2 Ch3 "},{"type":"unit","id":"03","title":"单元 03 · 无线传播、衰减、多径、干扰和信噪比","text":"03 无线传播、衰减、多径、干扰和信噪比 Ch2 Ch3 "},{"type":"unit","id":"04","title":"单元 04 · 天线、增益、极化、MIMO 基础和链路预算","text":"04 天线、增益、极化、MIMO 基础和链路预算 Ch4 "},{"type":"unit","id":"05","title":"单元 05 · STA、AP、BSS、ESS、SSID、BSSID 与无线网络拓扑","text":" ":"19 知识总结 summary"},{"type":"unit","id":"19","title":"单元 19 · 单元测验","text":"19 单元测验 quiz"},{"type":"unit","id":"19","title":"单元 19 · 教材章节映射","text":"19 教材章节映射 mapping"},{"type":"unit","id":"19","title":"单元 19 · 标准与官方来源","text":"19 标准与官方来源 sources"},{"type":"unit","id":"19","title":"单元 19 · 延伸阅读","text":"19 延伸阅读 reading"},{"type":"unit","id":"19","title":"单元 19 · 本单元审核结果（摘要）","text":"19 本单元审核结果（摘要） audit"},{"type":"term","id":"RF-DBM-001","title":"以1毫瓦为基准的分贝（decibel relative to one milliwatt · dBm）","text":"RF-DBM-001 以1毫瓦为基准的分贝 decibel relative to one milliwatt dBm 以1mW为参考的对数功率单位：P[dBm]=10·lg(P[mW])；0 dBm=1 mW，+30 dBm=1 W。"},{"type":"term","id":"RF-DBI-001","title":"各向同性基准分贝／半波偶极子基准分贝（decibels relative to isotropic / half-wave dipole · dBi/dBd）","text":"RF-DBI-001 各向同性基准分贝／半波偶极子基准分贝 decibels relative to isotropic / half-wave dipole dBi/dBd 天线增益参考基准：dBi以理想点源为0；dBd以半波偶极子为0；0 dBd=2.15 dBi。"},{"type":"term","id":"RF-FSPL-001","title":"自由空间路径损耗（Free Space Path Loss · FSPL）","text":"RF-FSPL-001 自由空间路径损耗 Free Space Path Loss FSPL 直视无遮挡下球面波扩散导致的损耗：FSPL[dB]=20·lg(d_km)+20·lg(f_MHz)+32.44。"},{"type":"term","id":"RF-RSSI-001","title":"接收信号强度指示（Received Signal Strength Indicator · RSSI）","text":"RF-RSSI-001 接收信号强度指示 Received Signal Strength Indicator RSSI 802.11对所收帧信号强度的可选指示参数，整数刻度；标准未规定与dBm的换算，刻度由厂商实现定义。"},{"type":"term","id":"RF-SNR-001","title":"信噪比（Signal-to-Noise Ratio · SNR）","text":"RF-SNR-001 信噪比 Signal-to-Noise Ratio SNR 信号功率与噪声功率之比：SNR[dB]=10·lg(Ps/Pn)；工程上常以接收电平减噪声底估算。"},{"type":"term","id":"RF-SINR-001","title":"信号与干扰加噪声比（Signal-to-Interference-plus-Noise Ratio · SINR）","text":"RF-SINR-001 信号与干扰加噪声比 Signal-to-Interference-plus-Noise Ratio SINR 信号功率与(干扰+噪声)总功率之比。"},{"type":"term","id":"RF-FREQ-001","title":"频率（frequency · f）","text":"RF-FREQ-001 频率 frequency f 单位时间内波形完整周期的数量，单位Hz。"},{"type":"term","id":"RF-WAVE-001","title":"波长（wavelength · λ）","text":"RF-WAVE-001 波长 wavelength λ 波形一个周期传播的距离：λ=c/f。"},{"type":"term","id":"RF-PHASE-001","title":"相位（phase · φ）","text":"RF-PHASE-001 相位 phase φ 波形在周期内的时间/角度位置。"},{"type":"term","id":"RF-AMPL-001","title":"振幅（amplitude）","text":"RF-AMPL-001 振幅 amplitude  波形偏离零点的最大值，与信号功率相关。"},{"type":"term","id":"RF-MW-001","title":"毫瓦（milliwatt · mW）","text":"RF-MW-001 毫瓦 milliwatt mW 功率线性单位，1/1000瓦。"},{"type":"term","id":"RF-DB-001","title":"分贝（decibel · dB）","text":"RF-DB-001 分贝 decibel dB 两个功率比值以10为底的对数：dB=10·lg(P1/P2)，无量纲。"},{"type":"term","id":"RF-EIRP-001","title":"等效全向辐射功率（Equivalent Isotropically Radiated Power · EIRP）","text":"RF-EIRP-001 等效全向辐射功率 Equivalent Isotropically Radiated Power EIRP 发射功率与天线增益的合成指标：EIRP[dBm]=Tx功率[dBm]+天线增益[dBi]−线缆损耗[dB]。"},{"type":"term","id":"RF-NF-001","title":"噪声底（noise floor）","text":"RF-NF-001 噪声底 noise floor  信道内噪声与环境干扰的总功率电平，单位dBm。"},{"type":"term","id":"RF-LB-001","title":"链路预算（link budget）","text":"RF-LB-001 链路预算 link budget  从发射到接收全部增益与损耗的代数和，用于判定链路可行性。"},{"type":"term","id":"RF-FM-001","title":"衰落余量／系统运行裕量（fade margin / System Operating Margin · SOM）","text":"RF-FM-001 衰落余量／系统运行裕量 fade margin / System Operating Margin SOM 接收电平高于接收灵敏度所需余量的部分，用于吸收时变衰落。"},{"type":"term","id":"RF-REFL-001","title":"反射（reflection）","text":"RF-REFL-001 反射 reflection  波遇到大于其波长的物体表面时改变方向返回的现象。"},{"type":"term","id":"RF-SCAT-001","title":"散射（scattering）","text":"RF-SCAT-001 散射 scattering  波遇到与波长相当或更小的粗糙表面/颗粒时向多个方向散开。"},{"type":"term","id":"RF-DIFF-001","title":"绕射（diffraction）","text":"RF-DIFF-001 绕射 diffraction  波绕过障碍物边缘继续传播的现象（亦译衍射）。"},{"type":"term","id":"RF-ABSP-001","title":"吸收（absorption）","text":"RF-ABSP-001 吸收 absorption  波能量被介质吸收转化为热等形式的损耗。"},{"type":"term","id":"RF-REFR-001","title":"折射（refraction）","text":"RF-REFR-001 折射 refraction  波穿过不同密度介质时传播方向发生弯折。"},{"type":"term","id":"RF-MP-001","title":"多径（multipath）","text":"RF-MP-001 多径 multipath  信号经多条路径到达接收端，产生幅度/相位/时间上的叠加效应（衰落、码间干扰等）。"},{"type":"term","id":"RF-FZ-001","title":"菲涅尔区（Fresnel zone）","text":"RF-FZ-001 菲涅尔区 Fresnel zone  视距链路周围由相位差决定的椭圆区域；第一菲涅尔区遮挡超过约40%会显著劣化链路。"},{"type":"term","id":"RF-POL-001","title":"极化（polarization）","text":"RF-POL-001 极化 polarization  电场矢量的振荡方向；收发天线极化失配造成额外损耗。"},{"type":"term","id":"RF-AG-001","title":"天线增益（antenna gain）","text":"RF-AG-001 天线增益 antenna gain  天线在最大辐射方向相对参考天线(dBi/dBd)的功率集中程度。"},{"type":"term","id":"RF-BW-001","title":"波束宽度（beamwidth）","text":"RF-BW-001 波束宽度 beamwidth  方向图中增益下降3 dB的角度范围（水平/垂直）。"},{"type":"term","id":"RF-BF-001","title":"波束成形（beamforming）","text":"RF-BF-001 波束成形 beamforming  利用多天线相位/幅度控制把能量导向特定接收方的技术。"},{"type":"term","id":"SP-ISM-001","title":"工业、科学、医疗频段（Industrial, Scientific, and Medical band · ISM）","text":"SP-ISM-001 工业、科学、医疗频段 Industrial, Scientific, and Medical band ISM 免许可使用的频段总称，Wi-Fi使用其中的900 MHz、2.4 GHz、5.8 GHz等。"},{"type":"term","id":"SP-UNII-001","title":"U-NII频段(免许可国家信息基础设施频段)（Unlicensed National Information Infrastructure · U-NII）","text":"SP-UNII-001 U-NII频段(免许可国家信息基础设施频段) Unlicensed National Information Infrastructure U-NII 美国划定的5 GHz免许可频段分组(U-NII-1/2/2e/3等)；6 GHz对应U-NII-5至U-NII-8(监管细节按地区核实)。"},{"type":"term","id":"SP-DSSS-001","title":"直接序列扩频（Direct Sequence Spread Spectrum · DSSS）","text":"SP-DSSS-001 直接序列扩频 Direct Sequence Spread Spectrum DSSS 以扩频码扩展信号带宽的调制体制；802.11b(CCK/HR-DSSS)与原802.11 DSSS的基础。"},{"type":"term","id":"SP-OFDM-001","title":"正交频分复用（Orthogonal Frequency Division Multiplexing · OFDM）","text":"SP-OFDM-001 正交频分复用 Orthogonal Frequency Division Multiplexing OFDM 把信道划分为大量正交子载波并行传输的多载波调制方式；802.11a/g/n/ac/ax/be 的基础。"},{"type":"term","id":"SP-GI-001","title":"保护间隔（Guard Interval · GI）","text":"SP-GI-001 保护间隔 Guard Interval GI OFDM符号间的保护时间，用于抵抗多径造成的符号间干扰；常用800/400 ns(HE引入更短间隔)。"},{"type":"term","id":"SP-QAM-001","title":"正交幅度调制（Quadrature Amplitude Modulation · QAM）","text":"SP-QAM-001 正交幅度调制 Quadrature Amplitude Modulation QAM 同时以幅度与相位承载信息的调制方式；阶数越高每符号比特越多、对SNR要求越高。"},{"type":"term","id":"SP-CH-001","title":"信道／信道宽度／中心频率（channel / channel width / center frequency）","text":"SP-CH-001 信道／信道宽度／中心频率 channel / channel width / center frequency  信道=频段内以中心频率标识的工作子带；宽度=其占用带宽(20/40/80/160/320 MHz)。"},{"type":"term","id":"SP-SC-001","title":"子载波（subcarrier）","text":"SP-SC-001 子载波 subcarrier  OFDM中并行承载符号的正交载波单元(数据/导频/空置)。"},{"type":"term","id":"SP-RU-001","title":"资源单元（Resource Unit · RU）","text":"SP-RU-001 资源单元 Resource Unit RU 802.11ax把OFDM子载波分组为RU，可分配给不同STA实现OFDMA多用户传输。"},{"type":"term","id":"SS-STR-001","title":"空间流（spatial stream）","text":"SS-STR-001 空间流 spatial stream  MIMO系统中并行独立的空间数据通道；速率与流数成正比。"},{"type":"term","id":"SS-MIMO-001","title":"多输入多输出（Multiple-Input Multiple-Output · MIMO）","text":"SS-MIMO-001 多输入多输出 Multiple-Input Multiple-Output MIMO 利用多收发天线在空间维度传输的技术总称：空间复用/分集/波束成形。"},{"type":"term","id":"SS-SU-001","title":"单用户MIMO（Single-User MIMO · SU-MIMO）","text":"SS-SU-001 单用户MIMO Single-User MIMO SU-MIMO 全部空间流在同一时刻服务于一个STA的MIMO传输。"},{"type":"term","id":"SS-MU-001","title":"多用户MIMO（Multi-User MIMO · MU-MIMO）","text":"SS-MU-001 多用户MIMO Multi-User MIMO MU-MIMO 同一时刻空间流分属多个STA：下行802.11ac引入，上行802.11ax引入。"},{"type":"term","id":"MAC-BEACON-001","title":"信标帧（Beacon frame）","text":"MAC-BEACON-001 信标帧 Beacon frame  由 AP（IBSS 中由成员 STA 轮流）周期广播的管理帧，携带 SSID、BSSID、能力信息、支持速率、TSF 时间戳、参数集（RSN/DTIM 周期等），用于被动扫描发现与参数通告。"},{"type":"term","id":"MAC-CSMA-001","title":"载波侦听多路访问／冲突避免（Carrier Sense Multiple Access with Collision Avoidance · CSMA/CA）","text":"MAC-CSMA-001 载波侦听多路访问／冲突避免 Carrier Sense Multiple Access with Collision Avoidance CSMA/CA 发送前经物理载波侦听(CCA)与虚拟载波侦听(NAV)确认信道空闲，再经随机退避后发送，并以ACK确认、未确认重传的分布式介质访问方式。"},{"type":"term","id":"MAC-CCA-001","title":"空闲信道评估（Clear Channel Assessment · CCA）","text":"MAC-CCA-001 空闲信道评估 Clear Channel Assessment CCA PHY判断信道是否被占用的机制(能量检测/前导检测)，是物理载波侦听的实现。"},{"type":"term","id":"MAC-NAV-001","title":"网络分配向量（Network Allocation Vector · NAV）","text":"MAC-NAV-001 网络分配向量 Network Allocation Vector NAV 依据所收帧Duration/ID字段维护的虚拟载波侦听计时器，让STA即便听不懂对方数据也能知悉信道占用。"},{"type":"term","id":"MAC-IFS-001","title":"帧间间隔（Interframe Space · IFS）","text":"MAC-IFS-001 帧间间隔 Interframe Space IFS 帧序列之间的强制时间间隔(SIFS/DIFS/AIFS/EIFS等)，不同间隔构成访问优先级。"},{"type":"term","id":"MAC-ACK-001","title":"确认帧（Acknowledgment frame · ACK）","text":"MAC-ACK-001 确认帧 Acknowledgment frame ACK 接收方对成功收到的单播帧立即返回的控制帧；未收到ACK触发重传。"},{"type":"term","id":"MAC-RTS-001","title":"请求发送／允许发送（Request To Send / Clear To Send · RTS/CTS）","text":"MAC-RTS-001 请求发送／允许发送 Request To Send / Clear To Send RTS/CTS 发送前先以RTS(CTS)短帧预约信道并使邻站设置NAV的信道预约机制，用于缓解隐藏节点；引入额外开销。"},{"type":"term","id":"MAC-HN-001","title":"隐藏节点／暴露节点（hidden node / exposed node）","text":"MAC-HN-001 隐藏节点／暴露节点 hidden node / exposed node  隐藏节点=互相听不到的两个发送方在接收方处冲突；暴露节点=因误听而不必要地退避。"},{"type":"term","id":"MAC-AGG-001","title":"帧聚合(A-MSDU/A-MPDU)（A-MSDU / A-MPDU aggregation）","text":"MAC-AGG-001 帧聚合(A-MSDU/A-MPDU) A-MSDU / A-MPDU aggregation  把多个MSDU聚合进一个MSDU(A-MSDU)或把多个MPDU聚合为一次传输机会(A-MPDU)以摊薄固定开销。"},{"type":"term","id":"MAC-RTX-001","title":"重传（retransmission）","text":"MAC-RTX-001 重传 retransmission  未收到ACK的帧按重传计数器与重传限制重新发送的机制。"},{"type":"term","id":"MAC-TIM-001","title":"流量指示图／投递流量指示图（Traffic Indication Map / Delivery TIM · TIM/DTIM）","text":"MAC-TIM-001 流量指示图／投递流量指示图 Traffic Indication Map / Delivery TIM TIM/DTIM Beacon中指示AP是否缓存了某STA单播流量(TIM)或广播/组播流量(DTIM)的位图元素。"},{"type":"term","id":"MAC-PM-001","title":"省电模式／活跃模式（Power Save mode / Active mode）","text":"MAC-PM-001 省电模式／活跃模式 Power Save mode / Active mode  STA在Beacon间休眠、由AP缓存流量的省电机制(U-APSD/WMM-PS为后续增强)。"},{"type":"term","id":"MAC-TWT-001","title":"目标唤醒时间（Target Wake Time · TWT）","text":"MAC-TWT-001 目标唤醒时间 Target Wake Time TWT STA与AP协商特定唤醒时段、按计划收发的省电机制(802.11ax完善并扩展广播TWT)。"},{"type":"term","id":"MAC-EDCA-001","title":"增强分布式信道访问（Enhanced Distributed Channel Access · EDCA）","text":"MAC-EDCA-001 增强分布式信道访问 Enhanced Distributed Channel Access EDCA 802.11e定义的按接入类别(AC)区分竞争参数(AIFS/CWmin/CWmax/TXOP)的QoS信道访问。"},{"type":"term","id":"MAC-WMM-001","title":"WMM(Wi-Fi多媒体)（Wi-Fi Multimedia · WMM）","text":"MAC-WMM-001 WMM(Wi-Fi多媒体) Wi-Fi Multimedia WMM WFA对基于EDCA的QoS功能的认证项目名；含WMM-Power Save。"},{"type":"term","id":"MAC-BC-001","title":"BSS着色(空间复用)（BSS Coloring (spatial reuse)）","text":"MAC-BC-001 BSS着色(空间复用) BSS Coloring (spatial reuse)  802.11ax为BSS标色、使STA能识别他BSS帧并依据阈值判断可否并发传输的空间复用机制。"},{"type":"term","id":"TOPO-STA-001","title":"站点（Station · STA）","text":"TOPO-STA-001 站点 Station STA 包含符合802.11的MAC与PHY的可独立寻址实体；AP本身也是STA。"},{"type":"term","id":"TOPO-AP-001","title":"(无线)接入点（Access Point · AP）","text":"TOPO-AP-001 (无线)接入点 Access Point AP 具备STA功能并通过分布式系统(DS)中转流量的实体。"},{"type":"term","id":"TOPO-BSS-001","title":"基本服务集（Basic Service Set · BSS）","text":"TOPO-BSS-001 基本服务集 Basic Service Set BSS 一组同步并(基础设施模式下)关联到同一AP的STA集合；另有IBSS与MBSS；覆盖区称BSA。"},{"type":"term","id":"TOPO-BSSID-001","title":"基本服务集标识符（Basic Service Set Identifier · BSSID）","text":"TOPO-BSSID-001 基本服务集标识符 Basic Service Set Identifier BSSID 标识一个特定BSS的48位地址；基础设施BSS中通常为AP无线接口MAC；多BSSID机制下另有规则(待核)。"},{"type":"term","id":"TOPO-SSID-001","title":"服务集标识符（Service Set Identifier · SSID）","text":"TOPO-SSID-001 服务集标识符 Service Set Identifier SSID 标识ESS或IBSS的网络名称，最长32字节，由管理帧携带。"},{"type":"term","id":"TOPO-ESS-001","title":"扩展服务集（Extended Service Set · ESS）","text":"TOPO-ESS-001 扩展服务集 Extended Service Set ESS 由一个分布式系统互连的一个或多个BSS的集合，对上层表现为一个逻辑网络。"},{"type":"term","id":"TOPO-IBSS-001","title":"独立基本服务集（Independent Basic Service Set · IBSS）","text":"TOPO-IBSS-001 独立基本服务集 Independent Basic Service Set IBSS 无AP、STA直接对等互联的BSS(常称ad hoc模式)。"},{"type":"term","id":"TOPO-DS-001","title":"分布式系统（Distribution System · DS）","text":"TOPO-DS-001 分布式系统 Distribution System DS 互连多个BSS(构成ESS)的系统；由AP的DS服务接入；无线实现称WDS。"},{"type":"term","id":"NET-SCAN-001","title":"被动扫描／主动扫描（passive / active scanning）","text":"NET-SCAN-001 被动扫描／主动扫描 passive / active scanning  被动=在各信道听Beacon；主动=广播Probe Request并接收Probe Response。"},{"type":"term","id":"NET-AUTH-001","title":"(开放系统／共享密钥)认证（(Open System / Shared Key) authentication）","text":"NET-AUTH-001 (开放系统／共享密钥)认证 (Open System / Shared Key) authentication  802.11链路层认证：开放系统仅交换序列号、无实际校验；共享密钥基于WEP(已弃用)；WPA3-Personal采用SAE。"},{"type":"term","id":"NET-ASSOC-001","title":"关联／重新关联（association / reassociation）","text":"NET-ASSOC-001 关联／重新关联 association / reassociation  STA经Association Request/Response加入BSS并获得AID；跨BSS移动时以Reassociation迁移(漫游的实现步骤)。"},{"type":"term","id":"NET-ROAM-001","title":"漫游（roaming）","text":"NET-ROAM-001 漫游 roaming  STA在ESS内从一个AP的BSS迁移到另一个AP的BSS的过程；802.11标准本身不含漫游决策算法(厂商实现)。"},{"type":"term","id":"NET-FTYPE-001","title":"管理帧／控制帧／数据帧（Management / Control / Data frames）","text":"NET-FTYPE-001 管理帧／控制帧／数据帧 Management / Control / Data frames  802.11帧三大类：管理帧(Beacon/Probe/Auth/Assoc…)、控制帧(RTS/CTS/ACK…)、数据帧。"},{"type":"term","id":"NET-MSDU-001","title":"MAC服务数据单元／MAC协议数据单元／PLCP服务数据单元／PLCP协议数据单元（MSDU / MPDU / PSDU / PPDU）","text":"NET-MSDU-001 MAC服务数据单元／MAC协议数据单元／PLCP服务数据单元／PLCP协议数据单元 MSDU / MPDU / PSDU / PPDU  自上而下：MSDU(上层净荷)→加MAC头尾=MPDU→加PHY前导=PPDU。"},{"type":"term","id":"SEC-PSK-001","title":"预共享密钥（Pre-Shared Key · PSK）","text":"SEC-PSK-001 预共享密钥 Pre-Shared Key PSK 由口令(通常经PBKDF派生)在双方预置的对称密钥，直接充当PMK来源；同一口令的所有用户共享。"},{"type":"term","id":"SEC-SAE-001","title":"对等同时认证（Simultaneous Authentication of Equals · SAE）","text":"SEC-SAE-001 对等同时认证 Simultaneous Authentication of Equals SAE 基于Dragonfly的口令认证密钥交换，双方对等互相证明知晓口令并协商出PMK；抗离线字典攻击；WPA3-Personal采用。"},{"type":"term","id":"SEC-4WH-001","title":"四次握手（4-Way Handshake）","text":"SEC-4WH-001 四次握手 4-Way Handshake  RSN中申请者与认证者基于PMK以4条EAPOL-Key消息交换随机数、派生并安装PTK、加密下发GTK并相互确认的过程。"},{"type":"term","id":"SEC-1X-001","title":"802.1X(端口级认证框架)（IEEE 802.1X）","text":"SEC-1X-001 802.1X(端口级认证框架) IEEE 802.1X  基于端口的网络访问控制框架，含申请者(Supplicant)/认证者(Authenticator)/认证服务器(AS)三角色。"},{"type":"term","id":"SEC-EAP-001","title":"可扩展认证协议（Extensible Authentication Protocol · EAP）","text":"SEC-EAP-001 可扩展认证协议 Extensible Authentication Protocol EAP 认证方法框架；WLAN企业认证经EAP承载(如EAP-TLS/PEAP等，WFA另有认证清单)。"},{"type":"term","id":"SEC-RSN-001","title":"强健安全网络（Robust Security Network · RSN）","text":"SEC-RSN-001 强健安全网络 Robust Security Network RSN 802.11i定义的安全网络体系(RSNA为关联到RSN的过程)；Beacon/Probe中以RSN信息元素通告。"},{"type":"term","id":"SEC-WEP-001","title":"有线等效保密（Wired Equivalent
