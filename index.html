式定义<\/span> 管理帧（Beacon/Probe/Auth/Assoc…）、控制帧（RTS/CTS/ACK/PS-Poll…）、数据帧（含 QoS/Null 变体）（教材 p.289–290，已核对正文）。<\/td><\/tr>\n      <tr><td>序列控制<\/td><td><span class=\"badge verified\">标准正式定义<\/span> 序列号+分片号；与 Retry 位配合识别重复帧（教材 Figure 7.5 中 Seq Number 126/Frag 0 实例）。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"principles\">\n    <h2>工作原理<\/h2>\n\n    <h3>1. 封装链（原创示意）<\/h3>\n    <div style=\"overflow-x:auto\">\n    <svg viewBox=\"0 0 720 120\" style=\"min-width:560px;width:100%;height:auto\" role=\"img\" aria-label=\"MSDU 到 PPDU 的封装链\">\n      <g font-size=\"12.5\">\n        <rect x=\"20\" y=\"40\" width=\"120\" height=\"34\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/>\n        <text x=\"80\" y=\"61\" text-anchor=\"middle\" fill=\"var(--accent-strong)\">MSDU（3–7 层数据）<\/text>\n        <polygon points=\"142,57 158,57 150,47\" fill=\"var(--text-faint)\"/><polygon points=\"142,57 158,57 150,67\" fill=\"var(--text-faint)\"/>\n        <rect x=\"162\" y=\"40\" width=\"70\" height=\"34\" rx=\"6\" fill=\"var(--warn-soft)\" stroke=\"var(--warn)\"/>\n        <text x=\"197\" y=\"61\" text-anchor=\"middle\" fill=\"var(--warn)\">MAC 头<\/text>\n        <rect x=\"232\" y=\"40\" width=\"110\" height=\"34\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/>\n        <text x=\"287\" y=\"61\" text-anchor=\"middle\" fill=\"var(--accent-strong)\">帧体（MSDU）<\/text>\n        <rect x=\"342\" y=\"40\" width=\"70\" height=\"34\" rx=\"6\" fill=\"var(--warn-soft)\" stroke=\"var(--warn)\"/>\n        <text x=\"377\" y=\"61\" text-anchor=\"middle\" fill=\"var(--warn)\">FCS/CRC<\/text>\n        <text x=\"440\" y=\"61\" fill=\"var(--ok)\" font-weight=\"600\">= MPDU<\/text>\n        <polygon points=\"472,57 488,57 480,47\" fill=\"var(--text-faint)\"/><polygon points=\"472,57 488,57 480,67\" fill=\"var(--text-faint)\"/>\n        <rect x=\"492\" y=\"40\" width=\"90\" height=\"34\" rx=\"6\" fill=\"var(--bg-soft)\" stroke=\"var(--border)\"/>\n        <text x=\"537\" y=\"61\" text-anchor=\"middle\" fill=\"var(--text-soft)\">PHY 前导（PLCP）<\/text>\n        <text x=\"600\" y=\"61\" fill=\"var(--ok)\" font-weight=\"600\">= PPDU<\/text>\n        <text x=\"20\" y=\"102\" fill=\"var(--text-faint)\" font-size=\"11\">加密发生在\"帧体\"这一层（教材 p.287：MSDU 被加密保护）——MAC 头永远是明文。<\/text>\n      <\/g>\n    <\/svg>\n    <\/div>\n\n    <h3>2. Frame Control 与地址字段<\/h3>\n    <p>用\"帧头解码器\"实验（见下方\"交互实验\"节）逐字段点击学习，并切换 To DS/From DS 四种组合观察 Addr1–4 的角色变化——这是抓包分析（单元 16）的基本功。<\/p>\n\n    <h3>3. 三类帧与常见成员<\/h3>\n    <table class=\"data\">\n      <tr><th>类型<\/th><th>常见成员<\/th><th>一句话职责<\/th><\/tr>\n      <tr><td>管理帧<\/td><td>Beacon、Probe Req/Resp、Auth、Assoc/Reassoc Req/Resp、Deauth、Disassoc<\/td><td>发现、准入、状态迁移（单元 06 全流程）<\/td><\/tr>\n      <tr><td>控制帧<\/td><td>RTS、CTS、ACK、PS-Poll、BlockAck<\/td><td>信道预约与确认，无帧体<\/td><\/tr>\n      <tr><td>数据帧<\/td><td>数据、QoS 数据、Null（无数据）<\/td><td>传 MSDU；Null 帧专门用于状态通知（如省电位，教材 p.312）<\/td><\/tr>\n    <\/table>\n    <p style=\"font-size:13px;color:var(--text-soft)\">三类帧与\"状态机（State 1/2/3）决定哪些帧合法\"相关——超出当前状态的帧会被丢弃（细节延伸至 CWAP 级）。<\/p>\n  <\/section>\n\n  <section id=\"diagrams\">\n    <h2>图解<\/h2>\n    <p>封装链 SVG 见上文；逐字段交互见实验；时序动画（ACK/RTS/CTS）在单元 08 的仿真与单元 06 动画中呈现。<\/p>\n  <\/section>\n\n  <section id=\"lab\">\n    <h2>交互实验<\/h2>\n    <div data-lab=\"frame-decoder\"><\/div>\n  <\/section>\n\n  <section id=\"case\">\n    <h2>工程案例：重传风暴的\"指纹\"<\/h2>\n    <p>某客户端投诉\"时快时慢\"。抓包（单元 16）发现同一序列号的帧反复出现、Retry 位=1，且其 MAC 头 Protected 位=1——说明是受保护数据帧在反复重传。结合信号侧证据（该位置 RSSI −73 dBm、邻频干扰源），定位为低 SNR 导致 FCS 失败。修复：调整信道复用并补一只 AP（单元 13）。看懂 Retry/序列号/Protected 三个字段，是这起排障的起点。<\/p>\n  <\/section>\n\n  <section id=\"pitfalls\">\n    <h2>易错点与概念辨析<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:250px\">易错说法<\/th><th>辨析<\/th><\/tr>\n      <tr><td>\"MAC 头也会被加密\"<\/td><td>加密只保护帧体（MSDU）；MAC 头必须明文，否则别的电台无法解读 Duration/地址（单元 08 的 NAV 依赖它）。<\/td><\/tr>\n      <tr><td>\"Addr1 一定是接收方终端\"<\/td><td>Addr1=RA（收本次无线传输的射频）——可能是 AP 射频（BSSID）也可能是终端，取决于 To DS/From DS。<\/td><\/tr>\n      <tr><td>\"802.11 帧就是 802.3 帧加个头\"<\/td><td>两者尺寸/字段不同（802.3 max 1518/1522 字节），AP 要做完整翻译（p.289）。<\/td><\/tr>\n      <tr><td>\"FCS 失败=帧被丢弃后丢失\"<\/td><td>FCS 失败→无 ACK→发送方重传；对上层表现为时延/重传率上升，而非静默丢失（单元 08/09）。<\/td><\/tr>\n      <tr><td>\"控制帧也有帧体\"<\/td><td>控制帧（RTS/CTS/ACK）无帧体；只有管理/数据帧携带字段数据或 MSDU。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"summary\">\n    <h2>知识总结<\/h2>\n    <ul>\n      <li>MSDU+MAC 头/尾=MPDU；MPDU+PHY 前导=PPDU；FCS=32 位 CRC；<\/li>\n      <li>Frame Control 位字段：类型/子类型、To/From DS、Retry、Power Mgmt、Protected…；<\/li>\n      <li>四地址：RA/TA 是\"射频世界\"的收发者，DA/SA 是\"终端世界\"的收发者；To DS/From DS 决定组合；<\/li>\n      <li>三类帧：管理/控制/数据；Null 数据帧用于状态通知；<\/li>\n      <li>AP 在 802.11↔802.3 之间做翻译（IS 的职责）。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"quiz\">\n    <h2>单元测验<\/h2>\n    <div data-quiz=\"07\"><\/div>\n  <\/section>\n\n  <section id=\"mapping\">\n    <h2>教材章节映射<\/h2>\n    <table class=\"data\">\n      <tr><th>来源<\/th><th>对应位置<\/th><th>状态<\/th><\/tr>\n      <tr><td>CWNA 4th Ed<\/td><td>第 9 章 §Packets, Frames, and Bits / §Data-Link Layer / §802.11 and 802.3 Interoperability / §Three 802.11 Frame Types（书页 285–292）；第 7 章 Figure 7.5（WDS 四地址帧头实例，p.247）<\/td><td><span class=\"badge verified\">已核实（正文节选已读）<\/span><\/td><\/tr>\n      <tr><td>IEEE 802.11-2024<\/td><td>帧格式章节（MAC 头位序、To/From DS 组合表）——<strong>正文未核对<\/strong><\/td><td><span class=\"badge pending\">条款级引用待核<\/span><\/td><\/tr>\n      <tr><td>Sybex 6th Ed<\/td><td>Ch9（章题级）<\/td><td><span class=\"badge unverified\">仅目录可核<\/span><\/td><\/tr>\n      <tr><td>CWNA-110 考试域<\/td><td>WLAN Protocols and Devices（D3）<\/td><td><span class=\"badge verified\">已核实<\/span><\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"sources\">\n    <h2>标准与官方来源<\/h2>\n    <ul>\n      <li><strong>S1-1<\/strong> CWNA 4th Ed Ch9 p.285–292 + Ch7 p.247（已逐页核对）【一手】<\/li>\n      <li><strong>S2-1<\/strong> IEEE Std 802.11-2024【编号已核实；帧格式条款号待核】<\/li>\n      <li><strong>S4-2<\/strong> CWNA-110 考试目标 D3 域【已核实】<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"reading\">\n    <h2>延伸阅读<\/h2>\n    <ul>\n      <li>教材 p.244：DS/DSS 细节属 CWAP 级——帧分析深水区在 CWAP 认证；<\/li>\n      <li>802.11ax/be 引入的新帧（Trigger Frame、EHT 变体）在单元 18/19 呈现（条款待核）；<\/li>\n      <li>下一站：单元 08——这些帧如何在半双工介质上排队上车（CSMA/CA）。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"audit\">\n    <h2>本单元审核结果（摘要）<\/h2>\n    <p style=\"font-size:14px\">术语 7 条对照术语库<span class=\"badge verified\">已核实<\/span>；封装链/FCS/三类帧/四地址（含 Figure 7.5 实例）逐条对照教材正文<span class=\"badge verified\">已核实<\/span>；Frame Control 位序与 To/From DS 组合表的条款号<span class=\"badge pending\">待核<\/span>（内容为公认稳定知识，未给具体条款号）。详见 <code>docs/audits/unit-07-audit.md<\/code>。<\/p>\n  <\/section>\n<\/article>\n","unit-08":"<article data-unit=\"08\">\n  <h1>单元 08 · CSMA/CA、CCA、退避、ACK、RTS/CTS 与隐藏节点<\/h1>\n  <p class=\"unit-meta\">阶段二 · 802.11 协议核心 ｜ 教材映射：CWNA 4th Ed 第 8、9 章（正文节选已核对）｜ 编制日期：2026-10-24<\/p>\n\n  <section id=\"goals\">\n    <h2>学习目标<\/h2>\n    <ol>\n      <li>解释无线为何用 CSMA/CA 而非 CSMA/CD，并说明\"ACK 缺席=冲突假设\"；<\/li>\n      <li>区分物理载波侦听（CCA）与虚拟载波侦听（NAV/Duration）；<\/li>\n      <li>完整口述一次退避：CW 取值、递减条件、复位与翻倍；<\/li>\n      <li>说明 RTS/CTS 的 Duration 递减链条与 CTS-to-Self 的取舍；<\/li>\n      <li>演示隐藏节点成因并用仿真验证 RTS/CTS 的代价与收益。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"prereqs\">\n    <h2>前置知识<\/h2>\n    <div class=\"callout info\"><span class=\"co-t\">先修<\/span>单元 05（AP 半双工）、单元 07（MAC 头 Duration 字段）。<\/div>\n  <\/section>\n\n  <section id=\"terms\">\n    <h2>核心术语<\/h2>\n    <div class=\"term-chips\">\n      <dfn data-term=\"MAC-CSMA-001\">CSMA/CA<\/dfn>\n      <dfn data-term=\"MAC-CCA-001\">CCA<\/dfn>\n      <dfn data-term=\"MAC-NAV-001\">NAV<\/dfn>\n      <dfn data-term=\"MAC-IFS-001\">帧间间隔 IFS<\/dfn>\n      <dfn data-term=\"MAC-ACK-001\">ACK<\/dfn>\n      <dfn data-term=\"MAC-RTS-001\">RTS/CTS<\/dfn>\n      <dfn data-term=\"MAC-CTSS-001\">CTS-to-Self<\/dfn>\n      <dfn data-term=\"MAC-HN-001\">隐藏节点<\/dfn>\n      <dfn data-term=\"MAC-EDCA-001\">EDCA<\/dfn>\n      <dfn data-term=\"MAC-WMM-001\">WMM<\/dfn>\n      <dfn data-term=\"MAC-BA-001\">Block Ack<\/dfn>\n      <dfn data-term=\"MAC-PCF-001\">PCF<\/dfn>\n    <\/div>\n  <\/section>\n\n  <section id=\"intuition\">\n    <h2>直观解释：一间不许插话的会议室<\/h2>\n    <p>有线以太网（CSMA/CD）像一桌人开会：两人同时开口能<strong>当场听见冲突<\/strong>（电压异常），立即闭嘴重来。无线的会议室里没人能在自己喊话时听见别人——自己的声音淹耳朵（半双工，教材 p.242）。所以 802.11 改了三招：<strong>先举手预约<\/strong>（载波侦听+退避）、<strong>发言后等回应<\/strong>（ACK，没回应就当作撞车）、<strong>必要时请主持人点名<\/strong>（RTS/CTS 预约信道）。碰撞没有消失，而是被\"确认缺席\"间接暴露出来（教材 p.266：无碰撞检测，未收到 ACK 即为碰撞假设，已核对正文）。<\/p>\n  <\/section>\n\n  <section id=\"formal\">\n    <h2>正式定义<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:170px\">概念<\/th><th>定义（分级标注）<\/th><\/tr>\n      <tr><td><dfn data-term=\"MAC-CSMA-001\">CSMA/CA<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 载波侦听+退避+ACK 确认的分布式访问方式；\"不判定冲突是否发生，而以未收到 ACK 作为冲突假设\"（教材 p.265–266，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"MAC-CCA-001\">CCA<\/dfn> / <dfn data-term=\"MAC-NAV-001\">NAV<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> CCA=PHY 的物理载波侦听；NAV=依据所收帧 Duration/ID 字段维持的虚拟载波侦听——\"听不懂对方数据也能知道信道要忙多久\"（教材 p.267–268、270，已核对正文；ACK 的 Duration/ID=0）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"MAC-IFS-001\">IFS<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 帧间间隔构成优先级：SIFS（最高）＜PIFS＜DIFS（最低优先级）；QoS 站点用 AIFS；收坏帧后用 EIFS（教材 p.267 原文列举，已核对正文）。<\/td><\/tr>\n      <tr><td>随机退避<\/td><td><span class=\"badge verified\">标准正式定义<\/span> 竞争窗口内取随机退避值；每个空闲时隙减 1；减到 0 且介质空闲才发送；冲突后 CW 翻倍重取（教材 p.270–271 Figure 8.6，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"MAC-RTS-001\">RTS/CTS<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 四帧交换预约：RTS 的 Duration=CTS/Data/ACK+3×SIFS，CTS 的=Data/ACK+2×SIFS，DATA 的=ACK，ACK 的=0；听到 RTS 或 CTS 的第三站都设置 NAV（教材 p.310–311 Figure 9.11，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"MAC-CTSS-001\">CTS-to-Self<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 只发 CTS 不发 RTS 的单边预约：开销更低、无确认收益，适合 AP 等单播往返代价高的场景（教材 p.310 一带）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"MAC-EDCA-001\">EDCA<\/dfn> / <dfn data-term=\"MAC-WMM-001\">WMM<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 802.11e 为时敏业务定义的 QoS 信道访问（AC 优先级差异）；WFA 认证名 WMM（教材 p.275，已核对正文；WMM 为 WFA 认证名已核实）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"MAC-PCF-001\">PCF<\/dfn> / <dfn data-term=\"MAC-HCF-001\">HCF<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> PCF：AP 轮询的无竞争期（CFP），需双方支持、与 DCF 交替；HCF：HC 以更高优先级分配 TXOP 构成受控访问期 CAP（教材 p.271–274，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"MAC-BA-001\">Block Ack<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 以一个管理动作建立、用一张位图批量确认多个 MPDU（教材 Ch8 §Block Ack；与单元 09 的 A-MPDU 配套）。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"principles\">\n    <h2>工作原理<\/h2>\n\n    <h3>1. 一次完整发送的六步<\/h3>\n    <ol>\n      <li><strong>听<\/strong>：CCA（能量/前导检测）+ NAV 双重侦听；<\/li>\n      <li><strong>等<\/strong>：DIFS（或 AIFS）无活动；<\/li>\n      <li><strong>抽签<\/strong>：CW 内随机退避值，空闲时隙逐个递减（其他站发送则冻结）；<\/li>\n      <li><strong>发<\/strong>：减到 0 且介质空闲 → 发送（可先 RTS 预约）；<\/li>\n      <li><strong>等 ACK<\/strong>：SIFS 内对方回 ACK；<\/li>\n      <li><strong>复盘<\/strong>：无 ACK → 冲突假设 → CW 翻倍重新抽签。<\/li>\n    <\/ol>\n\n    <h3>2. 隐藏节点与 RTS/CTS<\/h3>\n    <p>两台互相听不见的 STA 同时向 AP 发送 → 在 AP 处碰撞（彼此的 CCA/NAV 都帮不上忙）。RTS/CTS 的解法是\"让<strong>接收方<\/strong>喊一声\"：CTS 从 AP 发出，所有能听到 AP 的站都被 NAV 挡住。代价是四帧交换的额外开销——流量小、无隐藏节点时反而更慢。亲手在下方\"交互实验\"节的仿真器里验证。<\/p>\n\n    <h3>3. 保护机制的历史包袱<\/h3>\n    <p>混合 802.11b/g 环境中，ERP（g）必须提供保护：老设备听不懂 OFDM 帧、也就读不到 Duration，需以可解码的 RTS/CTS 或 CTS-to-Self 为其\"报站\"（教材 p.307–309，已核对正文）。教材还澄清一个误区：<strong>保护机制下数据仍以 OFDM 高速率发送<\/strong>，变慢是因为开销与退避，不是速率回落（p.309）。<\/p>\n  <\/section>\n\n  <section id=\"diagrams\">\n    <h2>图解与动画<\/h2>\n    <p>RTS/CTS 四帧交换的 Duration 递减已写入上方定义表（Figure 9.11 已核对）；竞争时序的动态呈现见仿真器的时隙图。<\/p>\n  <\/section>\n\n  <section id=\"lab\">\n    <h2>交互实验<\/h2>\n    <div data-lab=\"csma-sim\"><\/div>\n  <\/section>\n\n  <section id=\"case\">\n    <h2>工程案例：\"打印机一打印全办公室都卡\"<\/h2>\n    <p>一台老式 802.11b 打印服务器加入网络后，办公室吞吐骤降。用本单元知识拆解：老设备触发保护机制 → 每次发送前多一轮 RTS/CTS 或 CTS-to-Self → 开销上升；且其低速率发送占用信道时间远长于现代设备（速率差 100 倍）。处置：为打印机单独划 SSID 限速与时段、升级固件、或用有线口接入（打印机通常有网口）。验证：升级前后抓包对比重传率与保护帧占比（单元 16）。<\/p>\n  <\/section>\n\n  <section id=\"pitfalls\">\n    <h2>易错点与概念辨析<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:250px\">易错说法<\/th><th>辨析<\/th><\/tr>\n      <tr><td>\"802.11 完全没有碰撞\"<\/td><td>碰撞存在，只是<strong>无法当场检测<\/strong>，靠 ACK 缺席事后发现（p.266）。<\/td><\/tr>\n      <tr><td>\"NAV 就是 CCA\"<\/td><td>NAV=虚拟载波侦听（读 Duration 字段）；CCA=物理层能量/前导检测。两道闸门缺一不可。<\/td><\/tr>\n      <tr><td>\"退避计时器在别的站发送时继续倒数\"<\/td><td>冻结！只有介质空闲的时隙才递减（p.270–271）。<\/td><\/tr>\n      <tr><td>\"RTS/CTS 总是值得开\"<\/td><td>它有固定开销；无隐藏节点的小流量场景纯属浪费。按问题存在与否启用。<\/td><\/tr>\n      <tr><td>\"WMM 是 802.11e 标准本身\"<\/td><td>标准机制叫 EDCA/HCF；WMM 是 WFA 对其实现的认证名。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"summary\">\n    <h2>知识总结<\/h2>\n    <ul>\n      <li>半双工 RF → 无法边发边检测 → 以\"确认缺席\"暴露碰撞；<\/li>\n      <li>双重侦听：CCA（物理）+ NAV（虚拟，靠 Duration/ID）；IFS 分层给优先级；<\/li>\n      <li>退避：CW 随机取值、空闲递减、冻结、冲突翻倍；<\/li>\n      <li>RTS/CTS 四帧 Duration 递减链；CTS-to-Self 低开销单边版；<\/li>\n      <li>隐藏节点=互相听不见的发送方；EDCA/WMM 提供业务优先级；Block Ack 批量确认。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"quiz\">\n    <h2>单元测验<\/h2>\n    <div data-quiz=\"08\"><\/div>\n  <\/section>\n\n  <section id=\"mapping\">\n    <h2>教材章节映射<\/h2>\n    <table class=\"data\">\n      <tr><th>来源<\/th><th>对应位置<\/th><th>状态<\/th><\/tr>\n      <tr><td>CWNA 4th Ed<\/td><td>第 8 章全书（书页 263–282）；第 9 章 §Protection Mechanism/RTS-CTS/CTS-to-Self（书页 307–311）<\/td><td><span class=\"badge verified\">已核实（正文节选已读：p.264–276、307–311）<\/span><\/td><\/tr>\n      <tr><td>Sybex 6th Ed<\/td><td>Ch8（章题级）<\/td><td><span class=\"badge unverified\">仅目录可核<\/span><\/td><\/tr>\n      <tr><td>CWNA-110 考试域<\/td><td>WLAN Protocols and Devices（D3）<\/td><td><span class=\"badge verified\">已核实<\/span><\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"sources\">\n    <h2>标准与官方来源<\/h2>\n    <ul>\n      <li><strong>S1-1<\/strong> CWNA 4th Ed Ch8/Ch9（引用页已逐页核对）【一手】<\/li>\n      <li><strong>S3-7<\/strong> WFA WMM 认证名【已核实】<\/li>\n      <li><strong>S2-1<\/strong> IEEE 802.11-2024（EDCA 参数表/退避条款待核）【编号已核实】<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"reading\">\n    <h2>延伸阅读<\/h2>\n    <ul>\n      <li>教材 p.276：WMM-Admission Control（准入控制按业务流协商）；<\/li>\n      <li>教材 p.276：Airtime Fairness（空口公平，厂商实现居多）；<\/li>\n      <li>下一站：单元 09——一次传输里塞更多帧、让电台多睡一会儿。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"audit\">\n    <h2>本单元审核结果（摘要）<\/h2>\n    <p style=\"font-size:14px\">术语 12 条对照术语库<span class=\"badge verified\">已核实<\/span>；CSMA/CA/NAV/退避/RTS-CTS Duration 链/保护机制论断逐条对照教材正文（含 Figure 9.11）<span class=\"badge verified\">已核实<\/span>；仿真输出为教学量级（假设已在面板声明）<span class=\"badge simplified\">教学简化<\/span>。详见 <code>docs/audits/unit-08-audit.md<\/code>。<\/p>\n  <\/section>\n<\/article>\n","unit-09":"<article data-unit=\"09\">\n  <h1>单元 09 · 无线数据传输、重传、聚合、省电和资源管理<\/h1>\n  <p class=\"unit-meta\">阶段二 · 802.11 协议核心 ｜ 教材映射：CWNA 4th Ed 第 9、18 章（正文节选已核对）｜ 编制日期：2026-10-24<\/p>\n\n  <section id=\"goals\">\n    <h2>学习目标<\/h2>\n    <ol>\n      <li>解释重传机制与重传率对应用层体验的影响；<\/li>\n      <li>区分 A-MSDU 与 A-MPDU，并用计算器说明聚合的收益与代价；<\/li>\n      <li>完整讲述省电机制：Null 帧打盹、TIM 取件、DTIM 组播、ATIM（IBSS）；<\/li>\n      <li>说明 WMM-PS/U-APSD 对传统省电的改进方向；<\/li>\n      <li>把 QoS（EDCA/WMM）与资源管理（802.11k/v/r）放到正确的\"层\"上。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"prereqs\">\n    <h2>前置知识<\/h2>\n    <div class=\"callout info\"><span class=\"co-t\">先修<\/span>单元 08（ACK/Block Ack/退避）、单元 07（帧结构）。<\/div>\n  <\/section>\n\n  <section id=\"terms\">\n    <h2>核心术语<\/h2>\n    <div class=\"term-chips\">\n      <dfn data-term=\"MAC-RTX-001\">重传<\/dfn>\n      <dfn data-term=\"MAC-AGG-001\">帧聚合 A-MSDU/A-MPDU<\/dfn>\n      <dfn data-term=\"MAC-BA-001\">Block Ack<\/dfn>\n      <dfn data-term=\"MAC-PM-001\">省电模式<\/dfn>\n      <dfn data-term=\"MAC-TIM-001\">TIM/DTIM<\/dfn>\n      <dfn data-term=\"MAC-ATIM-001\">ATIM<\/dfn>\n      <dfn data-term=\"NET-UAPSD-001\">U-APSD（WMM-PS）<\/dfn>\n      <dfn data-term=\"MAC-EDCA-001\">EDCA/WMM<\/dfn>\n      <dfn data-term=\"RF-SNR-001\">重传率与 SNR<\/dfn>\n    <\/div>\n  <\/section>\n\n  <section id=\"intuition\">\n    <h2>直观解释：班车、快递柜与取件短信<\/h2>\n    <p>把发帧想成发班车：<strong>重传<\/strong>是包裹没签收就再发一班（CRC 是签收验货）；<strong>聚合<\/strong>是把一车小包裹拼成一整班车（Block Ack 一张签收单点验所有包裹）；<strong>省电<\/strong>是收件人回家睡觉，快递柜（AP 缓存）替他收着，<dfn data-term=\"MAC-TIM-001\">TIM<\/dfn> 是取件短信，<dfn data-term=\"MAC-TIM-001\">DTIM<\/dfn> 是\"全体业主注意：广播件到了\"的小区广播。三者共同回答同一个问题：<strong>怎么让昂贵的\"占道时间\"花在净荷上，让电台在没活干时多睡。<\/strong><\/p>\n  <\/section>\n\n  <section id=\"formal\">\n    <h2>正式定义<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:170px\">概念<\/th><th>定义（分级标注）<\/th><\/tr>\n      <tr><td><dfn data-term=\"MAC-RTX-001\">重传<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 单播帧必须被 ACK；FCS 失败或无 ACK → 重传，直至重传上限后丢弃（教材 p.305、55，已核对正文）。重传率高 = SNR 不足/干扰/隐藏节点/速率不匹配的\"体温计\"（Ch12 展开）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"MAC-AGG-001\">A-MSDU / A-MPDU<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> A-MSDU：多个 MSDU 打包进<strong>一个<\/strong> MPDU 的帧体（共用一个 MAC 头）；A-MPDU：多个 MPDU 拼成一次传输机会，以 Block Ack 位图批量确认（802.11n 引入；教材 Ch18，已核对 Ch18 开篇；两种聚合的差异细节延伸至 CWAP）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"MAC-PM-001\">省电模式<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> STA 经 Null 帧（Power Mgmt=1）进入 PS 模式；<strong>打盹时不能收发<\/strong>，AP 为其缓存单播帧（教材 p.312–314，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"MAC-TIM-001\">TIM / DTIM<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> TIM=Beacon 中的位图，逐 STA 指示\"有你的缓存帧\"；DTIM 时刻全体打盹 STA 必须醒来接收组播/广播，\"TIM 中的 DTIM 值为 0 表示本 Beacon 即 DTIM，随后立即发送组播\"（教材 p.315，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"MAC-ATIM-001\">ATIM<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> IBSS（无 AP）场景的流量指示帧：打盹前在 ATIM 窗口内互相通告\"我有给你的帧\"（教材 p.315 一带）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"NET-UAPSD-001\">U-APSD<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> WMM-PS 认证对应的省电机制：按服务间隔预约式取件，减少 PS-Poll 往返（教材 p.315–318 §WMM Power Save and U-APSD；细节延伸）。<\/td><\/tr>\n      <tr><td>资源管理（k/v/r）<\/td><td><span class=\"badge verified\">标准正式定义<\/span> 802.11k 测量报告、v BSS 过渡管理、r 快速切换：给漫游与调度提供\"仪表盘\"，均已并入 802.11-2024<span class=\"badge pending\">条款待核<\/span>。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"principles\">\n    <h2>工作原理<\/h2>\n\n    <h3>1. 聚合的账本<\/h3>\n    <p>一次传输机会的固定开销（前导/IFS/ACK）不随帧变小而变少。聚合把 n 个帧并成一次传输，摊薄固定开销——代价是<strong>任何一块出错整块重来<\/strong>（块越大越脆）。用\"交互实验\"节中的聚合账本计算器感受拐点。<\/p>\n\n    <h3>2. 省电的完整闭环（动画）<\/h3>\n    <p>Null 帧打盹 → AP 缓存 → TIM 点名 → PS-Poll 取件 → DTIM 全员醒来看组播。五步闭环在下方动画逐帧演示（教材 p.312–315 全部论断已核对正文）。<\/p>\n    <div data-anim=\"power-save\"><\/div>\n\n    <h3>3. QoS 与资源管理的站位<\/h3>\n    <ul>\n      <li><strong>EDCA/WMM<\/strong>（单元 08）决定\"谁先上车\"；<\/li>\n      <li><strong>聚合/Block Ack<\/strong>（本单元）决定\"一车装多少\"；<\/li>\n      <li><strong>k/v/r 资源管理<\/strong>决定\"换车时多快、去哪辆车\"（漫游，单元 06/14）；<\/li>\n      <li>三者叠加才构成现代 Wi-Fi 的 MAC 效率与体验管理。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"diagrams\">\n    <h2>图解与动画<\/h2>\n    <p>省电时序动画见上方（power-save）；聚合开销的动态账本见实验。<\/p>\n  <\/section>\n\n  <section id=\"lab\">\n    <h2>交互实验<\/h2>\n    <div data-lab=\"agg-calc\"><\/div>\n  <\/section>\n\n  <section id=\"case\">\n    <h2>工程案例：语音耳机的\"续航之谜\"<\/h2>\n    <p>某企业 VoWiFi 耳机标称 8 小时续航，实际 4 小时就没电。排查发现：AP 的 Beacon 间隔默认 100 TU、DTIM=1——耳机每 102 ms 就要醒来听一次 Beacon，DTIM=1 还让它在每个 DTIM 都保持全醒等组播。处置：把 DTIM 调到 3（组播时延换续航，语音流量走 WMM-PS/U-APSD 的服务间隔取件）；同时确认语音 AC 的 EDCA 参数未被访客网络挤占。验证：对比调整后耳机电流消耗曲线与漫游/掉话统计（单元 12/16）。<\/p>\n    <div class=\"callout warn\"><span class=\"co-t\">注意<\/span>Beacon 间隔与 DTIM 取值属厂商默认/工程权衡，无\"标准最佳值\"；调大 DTIM 会拖慢组播业务（如 AirPlay/投屏发现）。<\/div>\n  <\/section>\n\n  <section id=\"pitfalls\">\n    <h2>易错点与概念辨析<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:260px\">易错说法<\/th><th>辨析<\/th><\/tr>\n      <tr><td>\"重传率高就该调大发射功率\"<\/td><td>重传的病根常是 SNR/干扰/隐藏节点/速率错配；加功率可能加重同频干扰。先诊断（单元 16）再动手。<\/td><\/tr>\n      <tr><td>\"A-MSDU 和 A-MPDU 一回事\"<\/td><td>A-MSDU 在一个 MPDU 里拼 MSDU（一个序列号）；A-MPDU 拼多个 MPDU（各自序列号+Block Ack 位图确认）。安全性上 A-MSDU 历史上有过攻击面讨论（延伸）。<\/td><\/tr>\n      <tr><td>\"打盹的 STA 还能收到帧\"<\/td><td>打盹（doze）状态完全不能收发（教材 p.314 原文）；一切靠 AP 缓存与 TIM 点名。<\/td><\/tr>\n      <tr><td>\"DTIM 越小越省电\"<\/td><td>反了：DTIM 间隔越大、醒来次数越少越省电，但组播时延越大。<\/td><\/tr>\n      <tr><td>\"省电是 AP 的事\"<\/td><td>省电由 STA 主导（它决定打盹），AP 配合缓存与点名；STA 行为（驱动）差异巨大——\"Wi-Fi 掉线\"常是驱动省电策略所致。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"summary\">\n    <h2>知识总结<\/h2>\n    <ul>\n      <li>重传闭环：CRC/ACK → 重传 → 上限丢弃；重传率是健康度指标；<\/li>\n      <li>聚合：A-MSDU（帧内打包）vs A-MPDU（帧间拼车+Block Ack）；收益=摊薄固定开销，代价=整块重传；<\/li>\n      <li>省电：Null 帧 → doze → TIM 单播取件 → DTIM 组播全员醒 → ATIM（IBSS）→ U-APSD 高效版；<\/li>\n      <li>DTIM 间隔是续航与时延的调节旋钮；<\/li>\n      <li>QoS（谁先走）/聚合（装多少）/kvr（换车快）三层协同。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"quiz\">\n    <h2>单元测验<\/h2>\n    <div data-quiz=\"09\"><\/div>\n  <\/section>\n\n  <section id=\"mapping\">\n    <h2>教材章节映射<\/h2>\n    <table class=\"data\">\n      <tr><th>来源<\/th><th>对应位置<\/th><th>状态<\/th><\/tr>\n      <tr><td>CWNA 4th Ed<\/td><td>第 9 章 §Fragmentation/Power Management/TIM/DTIM/ATIM/WMM-PS（书页 305–318）；第 18 章开篇（HT 与聚合背景，书页 621–623）；第 8 章 §Block Ack（p.274）<\/td><td><span class=\"badge verified\">已核实（正文节选已读：p.305–315、623、274）<\/span><\/td><\/tr>\n      <tr><td>Sybex 6th Ed<\/td><td>Ch9/Ch10（章题级）<\/td><td><span class=\"badge unverified\">仅目录可核<\/span><\/td><\/tr>\n      <tr><td>CWNA-110 考试域<\/td><td>WLAN Protocols and Devices（D3）<\/td><td><span class=\"badge verified\">已核实<\/span><\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"sources\">\n    <h2>标准与官方来源<\/h2>\n    <ul>\n      <li><strong>S1-1<\/strong> CWNA 4th Ed Ch9/Ch18/Ch8（引用页已逐页核对）【一手】<\/li>\n      <li><strong>S3-7<\/strong> WFA WMM / WMM-Power Save 认证名【已核实】<\/li>\n      <li><strong>S2-1<\/strong> IEEE 802.11-2024（TWT/U-APSD 条款待核）【编号已核实】<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"reading\">\n    <h2>延伸阅读<\/h2>\n    <ul>\n      <li>教材 p.315–318：WMM-PS/U-APSD 与 802.11n 的省电增强；<\/li>\n      <li>TWT（目标唤醒时间）是 802.11ax 对省电的下一轮升级——单元 18 展开；<\/li>\n      <li>下一站：单元 10——把这些帧的\"车\"升级为 OFDM 高速公路。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"audit\">\n    <h2>本单元审核结果（摘要）<\/h2>\n    <p style=\"font-size:14px\">术语 9 条对照术语库<span class=\"badge verified\">已核实<\/span>；重传/聚合/Null 帧/TIM/DTIM=0/U-APSD 论断逐条对照教材正文<span class=\"badge verified\">已核实<\/span>；聚合计算器为教学模型（假设已声明）<span class=\"badge simplified\">教学简化<\/span>。详见 <code>docs/audits/unit-09-audit.md<\/code>。<\/p>\n  <\/section>\n<\/article>\n","unit-10":"<article data-unit=\"10\">\n  <h1>单元 10 · OFDM、调制编码、MCS 与空间流<\/h1>\n  <p class=\"unit-meta\">阶段三 · 性能与网络架构 ｜ 教材映射：CWNA 4th Ed 第 6、18、19 章（正文节选已核对）｜ 编制日期：2026-10-24<\/p>\n\n  <section id=\"goals\">\n    <h2>学习目标<\/h2>\n    <ol>\n      <li>解释 OFDM 如何把信道拆成 52（802.11a/g）/56（HT）/更多子载波并行传输，说出导频子载波的用途；<\/li>\n      <li>用\"子载波 × 比特 × 码率 ÷ 符号时长\"手工推导 54 Mb/s；<\/li>\n      <li>说明 MCS 由调制+码率+流数+带宽+GI 共同决定（教材 Table 18.2 语境）；<\/li>\n      <li>解释卷积编码（码率 1/2/2/3/3/4/5/6）用冗余换可靠；<\/li>\n      <li>理解\"调制阶数越高越快也越脆\"与动态速率切换的因果。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"prereqs\">\n    <h2>前置知识<\/h2>\n    <div class=\"callout info\"><span class=\"co-t\">先修<\/span>单元 02（QAM/键控）、单元 03（SNR 与 ISI）。<\/div>\n  <\/section>\n\n  <section id=\"terms\">\n    <h2>核心术语<\/h2>\n    <div class=\"term-chips\">\n      <dfn data-term=\"SP-OFDM-001\">OFDM<\/dfn>\n      <dfn data-term=\"SP-SC-001\">子载波/导频<\/dfn>\n      <dfn data-term=\"SP-CC-001\">卷积编码与码率<\/dfn>\n      <dfn data-term=\"SP-QAM-001\">QAM<\/dfn>\n      <dfn data-term=\"SP-GI-001\">保护间隔<\/dfn>\n      <dfn data-term=\"SS-STR-001\">空间流<\/dfn>\n      <dfn data-term=\"PERF-MCS-001\">MCS<\/dfn>\n      <dfn data-term=\"PERF-DRS-001\">动态速率切换<\/dfn>\n    <\/div>\n  <\/section>\n\n  <section id=\"intuition\">\n    <h2>直观解释：把一条窄路划成 52 条并行小道<\/h2>\n    <p>DSSS 时代像在一条单车道上依次跑车；OFDM 把 20 MHz 划成 52 条正交小道——48 条装货（数据子载波）、4 条竖信号灯（导频，供接收机做相位/幅度同步，教材 p.219 原文，已核对正文）。每条小道上的\"货物\"是 QAM 符号：阶数越高一车装得越多（16-QAM 4 bit、64-QAM 6 bit），但车厢越容易被颠簸打翻（SNR 要求越高）。再配上卷积编码的冗余（码率 3/4 = 每 4 个编码比特只有 3 个是\"干货\"），就得到每符号能装多少比特、从而算出速率。<\/p>\n  <\/section>\n\n  <section id=\"formal\">\n    <h2>正式定义<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:170px\">概念<\/th><th>定义（分级标注）<\/th><\/tr>\n      <tr><td><dfn data-term=\"SP-OFDM-001\">OFDM<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 52 个子载波编号 −26…+26，48 数据 + 4 导频（±7/±21），用于相位/幅度参考与同步（教材 p.219，已核对正文）。HT 起 20 MHz 多用 4 个子载波承载数据（p.635）。<\/td><\/tr>\n      <tr><td>符号与速率<\/td><td><span class=\"badge verified\">标准正式定义<\/span> 教材 p.220 速率表：24 Mb/s=16-QAM、4 编码比特/子载波、192 编码比特/符号、码率 1/2 → 96 数据比特/符号；54 Mb/s=64-QAM、3/4 → 216 数据比特/符号（48×6×0.75=216÷4 µs=54 Mb/s ✓，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"SP-CC-001\">卷积编码<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 以冗余换纠错能力；码率=数据比特/编码比特（1/2、2/3、3/4、5/6）（教材 p.219–220）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"PERF-MCS-001\">MCS<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 调制类型+保护间隔+空间流数共同决定最终速率（教材 p.641 Table 18.2/18.3 语境，已核对正文）；索引化后的 MCS 表<span class=\"badge pending\">待核<\/span>。<\/td><\/tr>\n      <tr><td><dfn data-term=\"PERF-DRS-001\">动态速率切换<\/dfn><\/td><td><span class=\"badge vendor\">厂商实现<\/span> 客户端按 SNR/丢包在 BSA 内的速率区间间移动（教材 p.250 提出、Ch12 展开，已核对正文位置；算法属厂商）。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"principles\">\n    <h2>工作原理<\/h2>\n    <p>速率的乘法结构是本单元的主线——<strong>带宽×调制×码率×流数÷时间<\/strong>。构建器把这个公式做成了可操作的算盘（见\"交互实验\"节；锚点已与教材 54 Mb/s 表格对齐；1024/4096-QAM 为 HE/EHT 新增调制，仅演示机制）：<\/p>\n    <p style=\"margin-top:10px\">三条工程直觉：<\/p>\n    <ul>\n      <li><strong>高阶调制是奢侈品<\/strong>：64-QAM→256-QAM→4096-QAM 每步多 33% 速率，但对 SNR 的要求逐级抬高（单元 19 的 4096-QAM 只在近距离才用得上）；<\/li>\n      <li><strong>码率是保险丝<\/strong>：低码率（1/2）抗噪但慢；信道好的时候才用 5/6；<\/li>\n      <li><strong>带宽与流数是乘法项<\/strong>：80 MHz 与双流各带来一次数量级提升——这也是\"为什么 5 GHz+MIMO 快\"的数学本质（单元 11 展开）。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"diagrams\">\n    <h2>图解<\/h2>\n    <p>速率构建器即本单元主图；QAM 星座图的渐进（64→256→4K）在单元 19 的 Wi-Fi 7 内容中呈现。<\/p>\n  <\/section>\n\n  <section id=\"lab\">\n    <h2>交互实验<\/h2>\n    <div data-lab=\"rate-builder\"><\/div>\n  <\/section>\n\n  <section id=\"case\">\n    <h2>工程案例：边缘速率之谜<\/h2>\n    <p>用户抱怨\"AP 明明标 1.2 Gb/s，我在会议室只有 60 Mb/s\"。拆解：1.2 Gb/s 是 2 流 80 MHz 867 Mb/s + 2.4 G 频段等聚合的宣传值；会议室边缘 SNR 低 → 客户端 DRS 降到 16-QAM 3/4、且空间流数随距离减少 → 60 Mb/s 恰是正常行为。处置：在会议室补一只 AP 提升该区域信噪比（单元 13），而不是\"调 AP 功率\"。<\/p>\n  <\/section>\n\n  <section id=\"pitfalls\">\n    <h2>易错点与概念辨析<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:250px\">易错说法<\/th><th>辨析<\/th><\/tr>\n      <tr><td>\"MCS 是速率的同义词\"<\/td><td>MCS 是\"怎么调制编码\"的索引；速率还要乘带宽、流数、除以符号时间，再经 MAC 开销打折。<\/td><\/tr>\n      <tr><td>\"导频子载波也承载数据\"<\/td><td>导频（±7/±21）只做同步参考，不装数据（教材 p.219）。<\/td><\/tr>\n      <tr><td>\"码率 3/4 表示丢 1/4 数据\"<\/td><td>是\"4 个编码比特承载 3 个数据比特\"——冗余用于纠错，不是丢弃。<\/td><\/tr>\n      <tr><td>\"降速是 AP 干的\"<\/td><td>DRS 决策主要在客户端驱动（厂商实现）；AP 可辅助（802.11k/v）。<\/td><\/tr>\n      <tr><td>\"GI 是给数据留的白\"<\/td><td>GI 是符号间的保护时间，抗多径 ISI；短 GI 降速换吞吐（教材 p.635 一带）。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"summary\">\n    <h2>知识总结<\/h2>\n    <ul>\n      <li>OFDM：52 子载波（48+4 导频）；HT 多用 4 个；80 MHz=234 数据子载波；<\/li>\n      <li>速率=子载波×比特×码率×流÷符号时长；54 Mb/s 锚点可手工复算；<\/li>\n      <li>MCS=调制+码率+流+带宽+GI 的组合索引；表值待核；<\/li>\n      <li>高阶调制吃 SNR；码率换可靠；带宽/流数是乘法项；<\/li>\n      <li>DRS 是客户端行为（厂商实现）。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"quiz\">\n    <h2>单元测验<\/h2>\n    <div data-quiz=\"10\"><\/div>\n  <\/section>\n\n  <section id=\"mapping\">\n    <h2>教材章节映射<\/h2>\n    <table class=\"data\">\n      <tr><th>来源<\/th><th>对应位置<\/th><th>状态<\/th><\/tr>\n      <tr><td>CWNA 4th Ed<\/td><td>第 6 章 §OFDM/卷积编码/调制（书页 218–221）；第 18 章 §HT Channels/MCS（书页 635–641）；第 19 章 §80 MHz VHT（书页 663–666）<\/td><td><span class=\"badge verified\">已核实（正文节选已读）<\/span><\/td><\/tr>\n      <tr><td>Sybex 6th Ed<\/td><td>Ch6/Ch10（章题级）<\/td><td><span class=\"badge unverified\">仅目录可核<\/span><\/td><\/tr>\n      <tr><td>CWNA-110 考试域<\/td><td>RF Technologies（D1）/ Regulations & Standards（D2）<\/td><td><span class=\"badge verified\">已核实<\/span><\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"sources\">\n    <h2>标准与官方来源<\/h2>\n    <ul>\n      <li><strong>S1-1<\/strong> CWNA 4th Ed Ch6/18/19（引用页已逐页核对）【一手】<\/li>\n      <li><strong>S2-2<\/strong> IEEE Std 802.11ax-2021（HE MCS 索引表待核）【编号已核实】<\/li>\n      <li><strong>S4-2<\/strong> CWNA-110 考试目标【已核实】<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"reading\">\n    <h2>延伸阅读<\/h2>\n    <ul>\n      <li>教材 p.641–652：HT MCS 全表（20/40 MHz × 流数 × GI）——数值级核对列入待办；<\/li>\n      <li>下一站：单元 11——把乘法项拉满（MIMO、信道绑定）之后，为什么吞吐仍只有标称的一半。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"audit\">\n    <h2>本单元审核结果（摘要）<\/h2>\n    <p style=\"font-size:14px\">术语 8 条对照术语库<span class=\"badge verified\">已核实<\/span>；OFDM 子载波/速率表/HT 附加子载波论断逐条对照教材正文（54 Mb/s 锚点复算一致）<span class=\"badge verified\">已核实<\/span>；HE/EHT MCS 索引表<span class=\"badge pending\">待核<\/span>。详见 <code>docs/audits/unit-10-audit.md<\/code>。<\/p>\n  <\/section>\n<\/article>\n","unit-11":"<article data-unit=\"11\">\n  <h1>单元 11 · MIMO、信道带宽、理论速率和实际吞吐量<\/h1>\n  <p class=\"unit-meta\">阶段三 · 性能与网络架构 ｜ 教材映射：CWNA 4th Ed 第 18、19 章（正文节选已核对）｜ 编制日期：2026-10-24<\/p>\n\n  <section id=\"goals\">\n    <h2>学习目标<\/h2>\n    <ol>\n      <li>读懂 3×3:2 记法（天线数与空间流数是两回事）；<\/li>\n      <li>解释空间复用/分集/波束成形三种 MIMO 收益；<\/li>\n      <li>说明信道绑定（40/80/160 MHz）的收益与部署约束（2.4 GHz 不适合、DFS 依赖）；<\/li>\n      <li>区分标称 PHY 速率与应用层吞吐，并解释 50% 左右折扣的来源；<\/li>\n      <li>用 SU/MU-MIMO 的视觉差异理解\"同一时刻服务谁\"。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"prereqs\">\n    <h2>前置知识<\/h2>\n    <div class=\"callout info\"><span class=\"co-t\">先修<\/span>单元 04（MIMO 基础/天线）、单元 10（速率公式）。<\/div>\n  <\/section>\n\n  <section id=\"terms\">\n    <h2>核心术语<\/h2>\n    <div class=\"term-chips\">\n      <dfn data-term=\"SS-MIMO-001\">MIMO<\/dfn>\n      <dfn data-term=\"SS-SU-001\">SU-MIMO<\/dfn>\n      <dfn data-term=\"SS-MU-001\">MU-MIMO<\/dfn>\n      <dfn data-term=\"SS-STR-001\">空间流<\/dfn>\n      <dfn data-term=\"RF-BF-001\">波束成形<\/dfn>\n      <dfn data-term=\"SP-CH-001\">信道宽度<\/dfn>\n      <dfn data-term=\"PERF-TP-001\">吞吐量 vs 标称速率<\/dfn>\n      <dfn data-term=\"PERF-JIT-001\">时延/抖动<\/dfn>\n    <\/div>\n  <\/section>\n\n  <section id=\"intuition\">\n    <h2>直观解释：车道加宽与拼车<\/h2>\n    <p>提升速率有三条\"修路\"思路：<strong>多修车道<\/strong>（空间流，MIMO 空间复用）、<strong>加宽路面<\/strong>（信道绑定，20→40→80→160 MHz）、<strong>提高限速<\/strong>（高阶调制，单元 10）。但修路的成本是\"更宽的地皮\"（频谱占用）与\"更强的车技\"（SNR/天线数）。而<strong>拼车<\/strong>（MU-MIMO）更进一步：同一时刻把车道分给多位乘客——下行由 802.11ac 引入、上行由 802.11ax 补齐（编号已核实）。最后别忘了收费站：<strong>MAC 开销+重传+竞争，把标称速率拦腰砍去近半<\/strong>。<\/p>\n  <\/section>\n\n  <section id=\"formal\">\n    <h2>正式定义<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:180px\">概念<\/th><th>定义（分级标注）<\/th><\/tr>\n      <tr><td>3×3:2 记法<\/td><td><span class=\"badge verified\">标准正式定义<\/span> \"3 发 3 收但只用 2 条独立数据流\"；3×3:3 则是 3 条流（教材 p.629 原文与 Figure 18.3，已核对正文）——<strong>天线数 ≠ 流数<\/strong>。<\/td><\/tr>\n      <tr><td><dfn data-term=\"SS-MU-001\">MU-MIMO<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 下行 MU-MIMO 由 802.11ac 引入（同时服务多用户），上行由 802.11ax 引入；802.11ac 把空间流上限提高到 8（教材 p.674，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"SP-CH-001\">信道绑定<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 40 MHz 由两个 20 MHz 绑定（HT），80 MHz/160 MHz 由 VHT 引入；160 MHz=两个 80 MHz（教材 p.666，已核对正文）。VHT 仅 5 GHz（p.663）。<\/td><\/tr>\n      <tr><td>2.4 GHz 绑定之害<\/td><td><span class=\"badge verified\">标准正式定义<\/span> \"2.4 GHz 部署 40 MHz 在多信道架构中无法扩展\"——3 个 20 MHz 非重叠信道，绑定后只剩 1 个+邻频干扰（教材 p.638，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"PERF-TP-001\">理论速率 vs 实际吞吐<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 标称值来自 MCS×带宽×流；实际吞吐被 MAC 开销（前导/IFS/ACK/退避）、重传、竞争与上层协议再打折——工程上常见约 50% 量级（具体随环境浮动，属工程经验<span class=\"badge vendor\">工程实践<\/span>）。<\/td><\/tr>\n      <tr><td>DFS 与客户端<\/td><td><span class=\"badge verified\">标准正式定义<\/span> 不支持 DFS 的客户端无法使用 U-NII-2/2E 信道——绑定设计要考虑客户端实际可用的信道集合（教材 p.434，已核对正文）。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"principles\">\n    <h2>工作原理<\/h2>\n    <p>对比图（见\"交互实验\"节）感受 SU 与 MU 的本质差别：<strong>SU-MIMO 把所有流给一个人；MU-MIMO 同一时刻把流拆给多人<\/strong>（虚线=分给其他用户的流）。MU 的前提是波束成形+用户间信道可分，所以\"能不能 MU\"要看客户端。<\/p>\n    <h3>带宽翻倍≠吞吐翻倍的三个折扣<\/h3>\n    <ol>\n      <li><strong>MAC 开销<\/strong>：前导/IFS/ACK 与帧长无关却逐帧都要付（聚合可摊薄，单元 09）；<\/li>\n      <li><strong>竞争与退避<\/strong>：同一信道上大家轮流发言；信道越宽单价越高（2.4 GHz 绑定的教训）；<\/li>\n      <li><strong>重传<\/strong>：SNR 不足时高阶调制重传率飙升——60% 的 PHY 速率可能只剩 30% 的有效吞吐（单元 16 实测排查）。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"diagrams\">\n    <h2>图解<\/h2>\n    <p>SU/MU-MIMO 对比图见上方实验；40/80/160 MHz 频谱结构见教材 Figure 6.18/19.5（已核对）。<\/p>\n  <\/section>\n\n  <section id=\"lab\">\n    <h2>交互实验<\/h2>\n    <div data-lab=\"mimo-mu\"><\/div>\n  <\/section>\n\n  <section id=\"case\">\n    <h2>工程案例：高密度会场的\"160 MHz 陷阱\"<\/h2>\n    <p>某会场为冲刺演示速率把全部 AP 绑成 80/160 MHz。结果：可用非重叠宽信道极少 → 大量 AP 被迫同频 → CCI 严重，实测人均吞吐反而低于 20/40 MHz 规划。教训（与教材 p.638 一致）：<strong>带宽是个人极值，复用是群体极值<\/strong>；高密度设计优先 20/40 MHz + 良好复用（单元 13），只有在\"终端少+频谱干净\"处才享宽信道红利。<\/p>\n  <\/section>\n\n  <section id=\"pitfalls\">\n    <h2>易错点与概念辨析<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:260px\">易错说法<\/th><th>辨析<\/th><\/tr>\n      <tr><td>\"4×4 AP=4 倍速率\"<\/td><td>速率取决于<strong>流数<\/strong>与客户端协商结果；4×4:3 只有 3 流，且单流客户端只能用 1 流。<\/td><\/tr>\n      <tr><td>\"带宽翻倍=吞吐翻倍\"<\/td><td>近似成立但被开销/竞争/重传打折；且 2.4 GHz 绑定得不偿失（p.638）。<\/td><\/tr>\n      <tr><td>\"MU-MIMO 随时生效\"<\/td><td>需要多用户同时有流量、波束成形与信道可分；只有 MU 请求者受益，其他客户端还可能被抑制。<\/td><\/tr>\n      <tr><td>\"160 MHz 在哪都能用\"<\/td><td>160=两个 80 MHz 的连续频谱；5 GHz 内可用位置有限且依赖 DFS/地区监管（地区差异待核）。<\/td><\/tr>\n      <tr><td>\"标称速率就是下载速度\"<\/td><td>标称是 PHY 空口速率；应用层还要扣 MAC/上层开销——量级 50% 是常态而非故障。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"summary\">\n    <h2>知识总结<\/h2>\n    <ul>\n      <li>3×3:2 记法：天线数≠流数；ac 把流数上限提到 8；<\/li>\n      <li>MU-MIMO：DL=802.11ac、UL=802.11ax；前提=波束成形+信道可分；<\/li>\n      <li>绑定：40/80/160 在 5 GHz；2.4 GHz 绑定不扩展（p.638）；DFS 影响可用信道集；<\/li>\n      <li>理论速率→实际吞吐的三重折扣：MAC 开销、竞争、重传；<\/li>\n      <li>高密度设计优先复用而非带宽。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"quiz\">\n    <h2>单元测验<\/h2>\n    <div data-quiz=\"11\"><\/div>\n  <\/section>\n\n  <section id=\"mapping\">\n    <h2>教材章节映射<\/h2>\n    <table class=\"data\">\n      <tr><th>来源<\/th><th>对应位置<\/th><th>状态<\/th><\/tr>\n      <tr><td>CWNA 4th Ed<\/td><td>第 18 章 §MIMO/HT Channels（书页 626–641）；第 19 章 §20/40/80/160 MHz/空间流/256-QAM（书页 663–674）<\/td><td><span class=\"badge verified\">已核实（正文节选已读）<\/span><\/td><\/tr>\n      <tr><td>Sybex 6th Ed<\/td><td>Ch10（章题级）<\/td><td><span class=\"badge unverified\">仅目录可核<\/span><\/td><\/tr>\n      <tr><td>CWNA-110 考试域<\/td><td>RF Technologies（D1）/ Protocols and Devices（D3）<\/td><td><span class=\"badge verified\">已核实<\/span><\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"sources\">\n    <h2>标准与官方来源<\/h2>\n    <ul>\n      <li><strong>S1-1<\/strong> CWNA 4th Ed Ch18/19（引用页已逐页核对）【一手】<\/li>\n      <li><strong>S2-2/S2-3<\/strong> IEEE 802.11ax-2021 / 802.11be-2024【编号已核实；条款待核】<\/li>\n      <li><strong>S3-4<\/strong> WFA Wi-Fi CERTIFIED 7 特性清单【已核实】<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"reading\">\n    <h2>延伸阅读<\/h2>\n    <ul>\n      <li>教材 p.674：8 空间流的现实性讨论（芯片/天线成本）；<\/li>\n      <li>Wi-Fi 7 的 MLO 是\"另一种加车道\"——单元 19 展开；<\/li>\n      <li>下一站：单元 12——快车道如何接进有线世界（架构/VLAN/漫游）。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"audit\">\n    <h2>本单元审核结果（摘要）<\/h2>\n    <p style=\"font-size:14px\">术语 8 条对照术语库<span class=\"badge verified\">已核实<\/span>；3×3:2 记法/MU-MIMO 归属/160 MHz 构成/2.4 GHz 绑定论断逐条对照教材正文<span class=\"badge verified\">已核实<\/span>；地区 160 MHz 监管<span class=\"badge pending\">待核<\/span>。详见 <code>docs/audits/unit-11-audit.md<\/code>。<\/p>\n  <\/section>\n<\/article>\n","unit-12":"<article data-unit=\"12\">\n  <h1>单元 12 · AP、控制器、漫游、VLAN 与有线网络集成<\/h1>\n  <p class=\"unit-meta\">阶段三 · 性能与网络架构 ｜ 教材映射：CWNA 4th Ed 第 10、13、12 章（正文节选已核对）｜ 编制日期：2026-10-24<\/p>\n\n  <section id=\"goals\">\n    <h2>学习目标<\/h2>\n    <ol>\n      <li>区分管理/控制/数据三平面，并说明自主/集中/云/分布式四种架构的取舍；<\/li>\n      <li>解释 SSID→VLAN 映射与 802.1Q 打标的路径，说明\"多 SSID 好还是 VLAN 映射好\"；<\/li>\n      <li>说明二层漫游与三层漫游的边界（何时需要隧道/Mobile IP）；<\/li>\n      <li>说出 RBAC 与访客网络（Captive Portal）的定位；<\/li>\n      <li>打通\"关联成功 → 拿到 IP → 访问互联网\"的全链路视角。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"prereqs\">\n    <h2>前置知识<\/h2>\n    <div class=\"callout info\"><span class=\"co-t\">先修<\/span>单元 05（DS/ESS）、单元 06（漫游=重新关联）。<\/div>\n  <\/section>\n\n  <section id=\"terms\">\n    <h2>核心术语<\/h2>\n    <div class=\"term-chips\">\n      <dfn data-term=\"ARCH-PLANE-001\">三平面<\/dfn>\n      <dfn data-term=\"ARCH-AC-001\">自主 AP<\/dfn>\n      <dfn data-term=\"ARCH-CTRL-001\">WLAN 控制器<\/dfn>\n      <dfn data-term=\"ARCH-CLOUD-001\">云管理<\/dfn>\n      <dfn data-term=\"TOPO-VLAN-001\">VLAN<\/dfn>\n      <dfn data-term=\"SEC-RBAC-001\">RBAC<\/dfn>\n      <dfn data-term=\"NET-ROAM-001\">漫游（L2/L3）<\/dfn>\n      <dfn data-term=\"NET-DHCP-001\">DHCP<\/dfn>\n    <\/div>\n  <\/section>\n\n  <section id=\"intuition\">\n    <h2>直观解释：连锁店的组织学<\/h2>\n    <p>AP 像连锁门店：<strong>自主 AP<\/strong>=每家店自采自营（配置各管各的，规模一大就乱）；<strong>控制器架构<\/strong>=总部统一配货、门店只管收银（配置/策略集中，转发可本地可回传）；<strong>云管理<\/strong>=总部搬到云上（SaaS，教材 p.343，已核对正文）；<strong>分布式<\/strong>=区域仓+门店自治（分支机构本地控制器，广域断联仍可运营，教材 p.351）。VLAN 则是商场里的\"分区经营\"——同一个 SSID 后面可以隔出员工区/访客区/语音区。<\/p>\n  <\/section>\n\n  <section id=\"formal\">\n    <h2>正式定义<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:180px\">概念<\/th><th>定义（分级标注）<\/th><\/tr>\n      <tr><td><dfn data-term=\"ARCH-PLANE-001\">三平面<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 管理（配置/监控）、控制（AP 间协同策略）、数据（用户流量转发）；自主 AP 本地转发，控制器方案通常由控制器转发（教材 p.337–339，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"ARCH-AC-001\">自主 AP<\/dfn> / WNMS<\/td><td><span class=\"badge verified\">标准正式定义<\/span> \"自主架构不提供重要的无线控制功能，AP 各自独立；WNMS 可集中设备管理\"（教材 p.340 原文，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"ARCH-CTRL-001\">控制器<\/dfn> / <dfn data-term=\"ARCH-CLOUD-001\">云<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 集中式：配置/控制集中、转发集中或本地；分布式：分支机构本地控制器经 VPN 隧道接受中心下载配置、断联可自治（教材 p.343–351，已核对正文）。WLAN 路由器≠AP（p.358：AP 是桥接虚拟接口）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"TOPO-VLAN-001\">SSID→VLAN<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 每 SSID 可绑定唯一 VLAN；多数厂商一射频可广播多至 16 个 SSID，但广播 16 个 SSID 因二层开销是坏实践（教材 p.486 原文，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"SEC-RBAC-001\">RBAC<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 基于角色的访问控制：按用户/组角色而非位置授予权限（教材 Ch13 §RBAC）。<\/td><\/tr>\n      <tr><td>L2 vs L3 漫游<\/td><td><span class=\"badge verified\">标准正式定义<\/span> \"Wi-Fi 运行在二层，漫游本质上是二层过程\"；跨三层边界需要隧道或 Mobile IP（家乡代理/外地代理/转交地址）（教材 p.426–428，已核对正文）。<\/td><\/tr>\n      <tr><td>Captive Portal<\/td><td><span class=\"badge verified\">标准正式定义<\/span> 访客强制门户：连上后任意网页被重定向到登录页（教材 p.486，已核对正文）。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"principles\">\n    <h2>工作原理：一条帧的有线路径<\/h2>\n    <p>STA 发出的 802.11 帧 → AP（集成服务翻译成 802.3，打上 SSID 对应的 VLAN tag）→ Trunk 交换机 → 对应 VLAN 的网关 → DHCP/DNS/互联网。在下方\"交互实验\"节的映射器中切换三个业务网观察隔离：<\/p>\n    <h3>漫游的两层含义<\/h3>\n    <ul>\n      <li><strong>二层漫游<\/strong>：ESS 内同子网换 BSS——IP 可保留，客户端行为（单元 06）；<\/li>\n      <li><strong>三层跨越<\/strong>：跨子网时 IP 失效，需要隧道回传/移动 IP 等厂商或协议机制（教材 p.426–428）；现代控制器/云架构多用隧道把客户端\"钉\"在一个锚点。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"diagrams\">\n    <h2>图解<\/h2>\n    <p>SSID→VLAN 路径图见实验；四种架构对比表：<\/p>\n    <table class=\"data\">\n      <tr><th>架构<\/th><th>配置/控制<\/th><th>数据转发<\/th><th>适用<\/th><\/tr>\n      <tr><td>自主 AP<\/td><td>各自为政（WNMS 辅助）<\/td><td>本地<\/td><td>小规模/SOHO<\/td><\/tr>\n      <tr><td>集中控制器<\/td><td>集中<\/td><td>集中或本地（split-MAC）<\/td><td>中大型园区<\/td><\/tr>\n      <tr><td>云管理<\/td><td>SaaS 云端<\/td><td>本地转发为主<\/td><td>多分支/连锁<\/td><\/tr>\n      <tr><td>分布式<\/td><td>中心下发+本地自治<\/td><td>本地<\/td><td>广域分支（断联可活）<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"lab\">\n    <h2>交互实验<\/h2>\n    <div data-lab=\"vlan-mapper\"><\/div>\n  <\/section>\n\n  <section id=\"case\">\n    <h2>工程案例：访客\"串门\"事件<\/h2>\n    <p>审计发现访客终端能访问内网打印机。排查：访客 SSID 与员工 SSID 被映射进了同一 VLAN——隔离形同虚设。修复：访客 SSID 绑定独立 VLAN + 网关侧防火墙只放行互联网；启用 Captive Portal 做同意与限速（教材 p.486）。验证：从访客终端扫描内网段应全部不可达（单元 16 复测）。教训：<strong>隔离发生在 VLAN/防火墙，不在\"另一个 SSID\"这个名字上<\/strong>。<\/p>\n  <\/section>\n\n  <section id=\"pitfalls\">\n    <h2>易错点与概念辨析<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:260px\">易错说法<\/th><th>辨析<\/th><\/tr>\n      <tr><td>\"控制器必在数据路径上\"<\/td><td>取决于架构：本地转发（split-MAC）时数据不过控制器，控制/管理才集中（p.339）。<\/td><\/tr>\n      <tr><td>\"多 SSID=多网络隔离\"<\/td><td>隔离靠 VLAN/防火墙；SSID 只是名字。同 VLAN 的两个 SSID 仍互通。<\/td><\/tr>\n      <tr><td>\"漫游跨越子网也很自然\"<\/td><td>跨子网是三层问题：需要隧道/Mobile IP（p.426–428）；二层漫游才\"顺滑\"。<\/td><\/tr>\n      <tr><td>\"16 个 SSID 是能力展示\"<\/td><td>教材明言广播 16 SSID 是坏实践——Beacon 开销挤占空口（p.486）。<\/td><\/tr>\n      <tr><td>\"WLAN 路由器≈AP\"<\/td><td>路由器含 NAT/路由功能，AP 是桥接接口（p.358），角色不同。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"summary\">\n    <h2>知识总结<\/h2>\n    <ul>\n      <li>三平面：管理/控制/数据；架构按\"控制在哪、转发在哪\"分四类；<\/li>\n      <li>SSID→VLAN 是无线接入有线世界的\"分诊台\"；16 SSID 是反模式；<\/li>\n      <li>漫游=L2 过程；跨子网需隧道/Mobile IP；<\/li>\n      <li>RBAC 按角色授权；访客网=Captive Portal+独立 VLAN+防火墙；<\/li>\n      <li>关联≠IP：DHCP/DNS/网关在有线侧接力（单元 15 展开）。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"quiz\">\n    <h2>单元测验<\/h2>\n    <div data-quiz=\"12\"><\/div>\n  <\/section>\n\n  <section id=\"mapping\">\n    <h2>教材章节映射<\/h2>\n    <table class=\"data\">\n      <tr><th>来源<\/th><th>对应位置<\/th><th>状态<\/th><\/tr>\n      <tr><td>CWNA 4th Ed<\/td><td>第 10 章 §Planes/架构（书页 337–358）；第 13 章 §VLANs/RBAC/Captive Portal（书页 484–491）；第 12 章 §Layer 3 Roaming（书页 426–428）<\/td><td><span class=\"badge verified\">已核实（正文节选已读）<\/span><\/td><\/tr>\n      <tr><td>Sybex 6th Ed<\/td><td>Ch11/Ch13（章题级）<\/td><td><span class=\"badge unverified\">仅目录可核<\/span><\/td><\/tr>\n      <tr><td>CWNA-110 考试域<\/td><td>WLAN Network Architecture and Design Concepts（D4）<\/td><td><span class=\"badge verified\">已核实<\/span><\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"sources\">\n    <h2>标准与官方来源<\/h2>\n    <ul>\n      <li><strong>S1-1<\/strong> CWNA 4th Ed Ch10/12/13（引用页已逐页核对）【一手】<\/li>\n      <li><strong>S4-2<\/strong> CWNA-110 考试目标 D4 域【已核实】<\/li>\n      <li>CAPWAP 等隧道协议细节延伸阅读（RFC 级引用待核）。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"reading\">\n    <h2>延伸阅读<\/h2>\n    <ul>\n      <li>教材 p.351：分支机构场景的中心-本地控制器协作与 VPN 隧道；<\/li>\n      <li>802.11bh（随机化 MAC）对访客Portal/身份的影响（延伸）；<\/li>\n      <li>下一站：单元 13——把多台 AP 摆成一张不互相打架的网。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"audit\">\n    <h2>本单元审核结果（摘要）<\/h2>\n    <p style=\"font-size:14px\">术语 8 条对照术语库<span class=\"badge verified\">已核实<\/span>；三平面/自主 AP/SSID→VLAN/L3 漫游/Captive Portal 论断逐条对照教材正文<span class=\"badge verified\">已核实<\/span>；CAPWAP RFC 引用<span class=\"badge pending\">待核<\/span>。详见 <code>docs/audits/unit-12-audit.md<\/code>。<\/p>\n  <\/section>\n<\/article>\n","unit-13":"<article data-unit=\"13\">\n  <h1>单元 13 · 信道规划、覆盖设计、容量规划和现场勘测<\/h1>\n  <p class=\"unit-meta\">阶段三 · 性能与网络架构 ｜ 教材映射：CWNA 4th Ed 第 12、15、16 章（正文节选已核对）｜ 编制日期：2026-10-24<\/p>\n\n  <section id=\"goals\">\n    <h2>学习目标<\/h2>\n    <ol>\n      <li>解释\"覆盖重叠但频率不重叠\"的复用原则，并为 2.4 GHz 部署 1/6/11 平面；<\/li>\n      <li>区分容量设计与覆盖设计，说出高密度场景的设计取向；<\/li>\n      <li>说明 40 MHz 绑定在复用中的代价与 DFS 信道依赖；<\/li>\n      <li>按教材流程执行一次勘测访谈→验证→交付物；<\/li>\n      <li>说出覆盖分析的正确工具链（协议分析仪+频谱仪+验证勘测）。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"prereqs\">\n    <h2>前置知识<\/h2>\n    <div class=\"callout info\"><span class=\"co-t\">先修<\/span>单元 03（衰减/干扰）、单元 11（带宽与复用的矛盾）。<\/div>\n  <\/section>\n\n  <section id=\"terms\">\n    <h2>核心术语<\/h2>\n    <div class=\"term-chips\">\n      <dfn data-term=\"RF-CCI-001\">同频干扰 CCI<\/dfn>\n      <dfn data-term=\"RF-ACI-001\">邻频干扰 ACI<\/dfn>\n      <dfn data-term=\"ARCH-MCA-001\">多信道架构 MCA<\/dfn>\n      <dfn data-term=\"ARCH-SCA-001\">单信道架构 SCA<\/dfn>\n      <dfn data-term=\"ARCH-CAPCOV-001\">容量 vs 覆盖<\/dfn>\n      <dfn data-term=\"PERF-DRS-001\">动态速率切换<\/dfn>\n      <dfn data-term=\"RF-SNR-001\">SNR 目标<\/dfn>\n      <dfn data-term=\"NET-ROAM-001\">漫游设计<\/dfn>\n    <\/div>\n  <\/section>\n\n  <section id=\"intuition\">\n    <h2>直观解释：座位的间距与教室的大小<\/h2>\n    <p>覆盖设计回答\"听得见吗\"（信号够到墙角），容量设计回答\"坐得下吗\"（每用户分到多少空口时间）。教室越大（单 AP 覆盖越广），听课的人越多、每人分到的越少——所以高密度设计的反直觉结论是：<strong>小房间多开<\/strong>（小功率、多 AP、密复用），而不是\"调大音量\"（加功率）。而频率只有 1/6/11 三条路（2.4 GHz），必须像棋盘一样让相邻教室错开课本。<\/p>\n  <\/section>\n\n  <section id=\"formal\">\n    <h2>正式定义<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:190px\">概念<\/th><th>定义（分级标注）<\/th><\/tr>\n      <tr><td><dfn data-term=\"ARCH-MCA-001\">信道复用/MCA<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> \"为避免同频/邻频干扰需要信道复用设计；漫游需要重叠的<strong>覆盖<\/strong>，但必须避免重叠的<strong>频率<\/strong>\"；2.4 GHz 只有 3 个非重叠信道，因此一定量的同频争用不可避免（教材 p.430、437，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"ARCH-SCA-001\">单信道架构 SCA<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 全网同信道：同频干扰\"确实存在，只是由控制器集中调度彼此在范围内的 AP 传输\"（教材 p.440 原文，已核对正文）；属特定厂商架构（<span class=\"badge vendor\">厂商实现<\/span>）。<\/td><\/tr>\n      <tr><td>DFS 与绑定<\/td><td><span class=\"badge verified\">标准正式定义<\/span> 不支持 DFS 的客户端只能用 U-NII-1/3 的 8 个信道——绑定与复用设计必须先盘点客户端能力（教材 p.434，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"ARCH-CAPCOV-001\">容量 vs 覆盖<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 教材 Ch12 专节（p.440 一带）：现代设计按<strong>容量<\/strong>而非信号覆盖布点；大覆盖单元=低人均空口时间。<\/td><\/tr>\n      <tr><td>重传率红线<\/td><td><span class=\"badge verified\">标准正式定义<\/span> \"干扰导致重传率超过约 10% 时，WLAN 性能/吞吐将受损\"（教材 p.565 原文，已核对正文）——验收的量化抓手。<\/td><\/tr>\n      <tr><td>勘测交付物<\/td><td><span class=\"badge verified\">标准正式定义<\/span> 访谈→需求（业务/遗留兼容/安全/访客）→设计→安装后<strong>验证勘测<\/strong>→报告（覆盖热图/频谱/吞吐）（教材 Ch15 p.534–547、Ch16 p.562–569，已核对正文）。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"principles\">\n    <h2>工作原理：把 4 台 AP 摆进走廊<\/h2>\n    <p>\"交互实验\"节的规划器把本单元两条铁律变成手感：<strong>相邻覆盖要重叠（漫游），相邻频率要错开（复用）<\/strong>。试着把相邻 AP 摆成同频或邻频，观察告警：<\/p>\n    <h3>勘测的正确姿势（教材 Ch15/16 流程）<\/h3>\n    <ol>\n      <li><strong>访谈<\/strong>：业务需求、应用与设备清单、遗留兼容（旧客户端决定安全/速率底线）、覆盖/容量期望、现有网络与基础设施（p.534–539）；<\/li>\n      <li><strong>设计<\/strong>：按容量布点、按 1/6/11（2.4 G）与带宽盘点（5 G）复用、功率对齐；<\/li>\n      <li><strong>验证<\/strong>：装后验证勘测（覆盖热图、SNR、重传率、漫游路径）；<\/li>\n      <li><strong>工具链<\/strong>：协议分析仪看二层问题（重传/隐藏节点）、<strong>频谱仪<\/strong>看非 Wi-Fi 干扰（单元 03/16），两者互补不可互相替代；<\/li>\n      <li><strong>交付物<\/strong>：需求文档、热图报告、设备清单、验收标准（重传率/SNR 门槛）。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"diagrams\">\n    <h2>图解<\/h2>\n    <p>信道规划交互图见实验；五 GHz U-NII 分块与 DFS 信道图见教材 Figure 6.18（已核对）。<\/p>\n  <\/section>\n\n  <section id=\"lab\">\n    <h2>交互实验<\/h2>\n    <div data-lab=\"channel-planner\"><\/div>\n  <\/section>\n\n  <section id=\"case\">\n    <h2>工程案例：食堂午高峰的\"覆盖很好但很卡\"<\/h2>\n    <p>食堂原有 2 台大功率 AP，信号满格但午高峰人均吞吐 <20 Mb/s、重传率 18%。诊断：覆盖单元过大 → 单 AP 挂 200+ 终端；2.4 GHz 拥挤；功率过大反而造成远处同频对打。改造：按容量拆成 6 台小功率 AP（1/6/11 复用，功率下调），5 GHz 引导双频终端（band steering，教材 p.442），开启 802.11k/v 辅助漫游。复测：重传率 4%、午高峰人均 45 Mb/s——印证 p.565 的 10% 红线与容量设计原则。<\/p>\n    <div class=\"callout warn\"><span class=\"co-t\">注意<\/span>案例数值为工程示例；每个场所的终端数/应用/建筑结构不同，须现场勘测（Ch15/16 流程）。<\/div>\n  <\/section>\n\n  <section id=\"pitfalls\">\n    <h2>易错点与概念辨析<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:260px\">易错说法<\/th><th>辨析<\/th><\/tr>\n      <tr><td>\"信号满格=设计成功\"<\/td><td>满格只证明覆盖；容量/重传/漫游才是体验指标——\"覆盖很好但很卡\"是最经典的误区。<\/td><\/tr>\n      <tr><td>\"功率越大覆盖越好越划算\"<\/td><td>大功率造成远处同频对打与客户端\"粘滞\"；小功率+密复用才是高密度正解。<\/td><\/tr>\n      <tr><td>\"2.4 GHz 用 40 MHz 更快\"<\/td><td>2.4 GHz 只有 3 个非重叠 20 MHz——绑定后邻频互踩（单元 11，p.638）。<\/td><\/tr>\n      <tr><td>\"SCA 没有同频干扰\"<\/td><td>干扰存在，只是被控制器集中调度（p.440 原文）；且属厂商专有架构。<\/td><\/tr>\n      <tr><td>\"勘测=拿软件画热图\"<\/td><td>访谈/需求先行，验证勘测在后；协议分析仪与频谱仪互补（Ch15/16）。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"summary\">\n    <h2>知识总结<\/h2>\n    <ul>\n      <li>复用铁律：覆盖可重叠、频率不可重叠；2.4 GHz 只有 1/6/11；<\/li>\n      <li>MCA vs SCA：同频干扰从\"物理回避\"到\"集中调度\"；SCA 属厂商架构；<\/li>\n      <li>容量优先于覆盖；高密度=小覆盖单元+密复用+5 G 引导；<\/li>\n      <li>DFS 信道依赖客户端能力；绑定放大频谱压力；<\/li>\n      <li>勘测流程：访谈→设计→验证→交付；重传率 ~10% 是量化红线。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"quiz\">\n    <h2>单元测验<\/h2>\n    <div data-quiz=\"13\"><\/div>\n  <\/section>\n\n  <section id=\"mapping\">\n    <h2>教材章节映射<\/h2>\n    <table class=\"data\">\n      <tr><th>来源<\/th><th>对应位置<\/th><th>状态<\/th><\/tr>\n      <tr><td>CWNA 4th Ed<\/td><td>第 12 章 §CCI/Channel Reuse/MCA/SCA/Capacity vs Coverage/Band Steering（书页 428–443）；第 15 章 §Site Survey Interview/Deliverables（书页 534–547）；第 16 章 §Site Survey Defined/覆盖分析（书页 562–569）<\/td><td><span class=\"badge verified\">已核实（正文节选已读）<\/span><\/td><\/tr>\n      <tr><td>Sybex 6th Ed<\/td><td>Ch13/Ch14（章题级）<\/td><td><span class=\"badge unverified\">仅目录可核<\/span><\/td><\/tr>\n      <tr><td>CWNA-110 考试域<\/td><td>RF Validation and Remediation（D6，权重最高的域之一）<\/td><td><span class=\"badge verified\">已核实<\/span><\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"sources\">\n    <h2>标准与官方来源<\/h2>\n    <ul>\n      <li><strong>S1-1<\/strong> CWNA 4th Ed Ch12/15/16（引用页已逐页核对）【一手】<\/li>\n      <li><strong>S4-2<\/strong> CWNA-110 考试目标 D6 域【已核实】<\/li>\n      <li>勘测软件/频谱仪为厂商工具（Ekahau 等），能力以厂商文档为准<span class=\"badge vendor\">厂商文档<\/span>。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"reading\">\n    <h2>延伸阅读<\/h2>\n    <ul>\n      <li>教材 p.444：高密度 WLAN（High-Density）专节；<\/li>\n      <li>教材 p.549：室外勘测与桥接链路（呼应单元 04）；<\/li>\n      <li>下一站：单元 14——给这张网加上真正的门禁（WPA2/WPA3 与密钥）。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"audit\">\n    <h2>本单元审核结果（摘要）<\/h2>\n    <p style=\"font-size:14px\">术语 8 条对照术语库<span class=\"badge verified\">已核实<\/span>；MCA/SCA/容量覆盖/重传红线/勘测流程论断逐条对照教材正文<span class=\"badge verified\">已核实<\/span>；勘测工具能力以厂商文档为准<span class=\"badge vendor\">厂商文档<\/span>。详见 <code>docs/audits/unit-13-audit.md<\/code>。<\/p>\n  <\/section>\n<\/article>\n","unit-14":"<article data-unit=\"14\">\n  <h1>单元 14 · WPA2、WPA3、认证、密钥和四次握手<\/h1>\n  <p class=\"unit-meta\">阶段四 · 安全与实际网络 ｜ 教材映射：CWNA 4th Ed 第 13 章（正文节选已核对）+ WFA 官方页 ｜ 编制日期：2026-10-24<\/p>\n\n  <section id=\"goals\">\n    <h2>学习目标<\/h2>\n    <ol>\n      <li>说清认证/关联/授权/加密/完整性/密钥协商六件事各自在哪个环节发生；<\/li>\n      <li>解释 PSK、SAE、802.1X/EAP 三种准入的机制差异与适用场景；<\/li>\n      <li>完整口述四次握手四条消息各做了什么、为什么口令永不/license上线；<\/li>\n      <li>画出密钥层级树（口令/凭据→PMK→PTK/GTK）；<\/li>\n      <li>说明 WEP/TKIP 为何被淘汰、WPA3 相对 WPA2 的实质改进。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"prereqs\">\n    <h2>前置知识<\/h2>\n    <div class=\"callout info\"><span class=\"co-t\">先修<\/span>单元 06（认证/关联状态机）、单元 07（Protected 位/帧体加密）。<\/div>\n  <\/section>\n\n  <section id=\"terms\">\n    <h2>核心术语<\/h2>\n    <div class=\"term-chips\">\n      <dfn data-term=\"SEC-WPA2-001\">WPA2<\/dfn>\n      <dfn data-term=\"SEC-WPA3-001\">WPA3<\/dfn>\n      <dfn data-term=\"SEC-PSK-001\">PSK<\/dfn>\n      <dfn data-term=\"SEC-SAE-001\">SAE<\/dfn>\n      <dfn data-term=\"SEC-1X-001\">802.1X<\/dfn>\n      <dfn data-term=\"SEC-EAP-001\">EAP<\/dfn>\n      <dfn data-term=\"SEC-RSN-001\">RSN<\/dfn>\n      <dfn data-term=\"SEC-4WH-001\">四次握手<\/dfn>\n      <dfn data-term=\"SEC-PMK-001\">PMK<\/dfn>\n      <dfn data-term=\"SEC-PTK-001\">PTK<\/dfn>\n      <dfn data-term=\"SEC-GTK-001\">GTK<\/dfn>\n      <dfn data-term=\"SEC-CCMP-001\">CCMP<\/dfn>\n      <dfn data-term=\"SEC-GCMP-001\">GCMP<\/dfn>\n      <dfn data-term=\"SEC-MFP-001\">管理帧保护（802.11w）<\/dfn>\n    <\/div>\n  <\/section>\n\n  <section id=\"intuition\">\n    <h2>直观解释：门禁、工牌与保险箱<\/h2>\n    <p>一栋大楼里：802.11 认证/关联是<strong>走进大门<\/strong>（单元 06，开放系统只是旋转门）；802.1X/EAP 或 SAE 是<strong>出示工牌/通过生物识别<\/strong>；四次握手是<strong>领一把当天的房间钥匙<\/strong>（PTK）与公共区域的公共钥匙（GTK）；CCMP/GCMP 加密是<strong>保险箱<\/strong>。钥匙每天换、房间不同——静态密码式锁具（WEP）早就被撬了（教材 p.465–466，已核对正文）。<\/p>\n  <\/section>\n\n  <section id=\"formal\">\n    <h2>正式定义<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:180px\">概念<\/th><th>定义（分级标注）<\/th><\/tr>\n      <tr><td><dfn data-term=\"SEC-RSN-001\">RSN<\/dfn> 与 WPA/WPA2/WPA3<\/td><td><span class=\"badge verified\">标准正式定义<\/span> IEEE 层的强健安全网络（RSN/RSNA）体系；WFA 认证名：WPA（802.11i 定稿前的过渡快照，仅 TKIP/RC4，教材 p.473 原文，已核对正文）、WPA2（RSN+CCMP）、WPA3（2018-06-25，Personal 用 SAE、Enterprise 192 位）【已核实】。<\/td><\/tr>\n      <tr><td><dfn data-term=\"SEC-PSK-001\">PSK<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 预共享密钥：口令直接派生 PMK；同一口令全员共享，易受离线字典攻击；教材提醒企业慎用（p.484 一带，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"SEC-SAE-001\">SAE<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 对等同时认证（Dragonfly）：双方互证口令并产出 PMK，抗离线字典攻击；WPA3-Personal 采用（WFA 已核实；IEEE 条款<span class=\"badge pending\">待核<\/span>）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"SEC-1X-001\">802.1X/EAP<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 端口级认证框架（申请者/认证者/认证服务器）；EAP 方法对照见教材 Table 13.2——EAP-TLS（RFC 5216）、EAP-TTLS（RFC 5281）、EAP-FAST（RFC 4851）等（已核对正文）。EAP 本体 RFC 3748（教材表内引用）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"SEC-4WH-001\">四次握手<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 基于 PMK 的 4 条 EAPOL-Key 消息：交换随机数→双向派生 PTK→加密下发 GTK→MIC 相互确认（密钥层级与\"PMK 为种子材料\"已对照教材 p.481；消息级细节<span class=\"badge pending\">条款待核<\/span>）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"SEC-PMK-001\">PMK<\/dfn> → <dfn data-term=\"SEC-PTK-001\">PTK<\/dfn>/<dfn data-term=\"SEC-GTK-001\">GTK<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> \"PMK 可由 802.1X/EAP 或 PSK 认证产生，是派生最终动态密钥的种子；最终密钥为 PTK 与 GTK\"（教材 p.481 原文，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"SEC-CCMP-001\">CCMP<\/dfn> / <dfn data-term=\"SEC-GCMP-001\">GCMP<\/dfn> / TKIP<\/td><td><span class=\"badge verified\">标准正式定义<\/span> CCMP（AES，WPA2 强制）；GCMP（AES-GCM，高吞吐场景）；TKIP 已淘汰——教材剖析其 128 位临时密钥+48 位 IV 混合设计仍救不了 WEP 式密钥生成（p.482，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"SEC-MFP-001\">管理帧保护<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 802.11w：用 MIC 保护 Deauth/Disassoc 等管理帧，遏制伪造 DoS（单元 08 的\"无法被拒绝\"条款即出于此）。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"principles\">\n    <h2>工作原理<\/h2>\n\n    <h3>1. 密钥层级树<\/h3>\n    <p>点击\"交互实验\"节中的密钥树，展开每一层的角色，回答\"口令为什么不等于密钥\"：<\/p>\n\n    <h3>2. 四次握手逐帧动画<\/h3>\n    <div data-anim=\"4wh\"><\/div>\n\n    <h3>3. 三种准入的选择题<\/h3>\n    <table class=\"data\">\n      <tr><th>方式<\/th><th>PMK 来源<\/th><th>适用<\/th><th>风险/代价<\/th><\/tr>\n      <tr><td>WPA2/WPA3-Personal（PSK）<\/td><td>口令派生<\/td><td>SOHO/小企业<\/td><td>离线字典、口令共享（教材 p.484 提醒）<\/td><\/tr>\n      <tr><td>WPA3-Personal（SAE）<\/td><td>SAE 交换<\/td><td>新一代个人/小企业<\/td><td>旧客户端兼容需过渡模式<\/td><\/tr>\n      <tr><td>WPA2/WPA3-Enterprise（802.1X/EAP）<\/td><td>EAP 认证<\/td><td>企业<\/td><td>需部署 RADIUS/证书体系；每用户可审计可撤销<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"diagrams\">\n    <h2>图解与动画<\/h2>\n    <p>密钥树实验 + 四次握手动画见上文；SAE 流程见单元 06 动画 4。<\/p>\n  <\/section>\n\n  <section id=\"lab\">\n    <h2>交互实验<\/h2>\n    <div data-lab=\"key-tree\"><\/div>\n  <\/section>\n\n  <section id=\"case\">\n    <h2>工程案例：离职员工的\"万能钥匙\"<\/h2>\n    <p>某公司全员共用一个 PSK，员工离职后仍可连入内网。改造：企业 SSID 迁移到 802.1X/EAP-TLS——每人一张证书，离职即吊销；打印机等老旧设备走厂商专有 PSK（每设备独立口令，教材 p.475 提及此类方案）单独 VLAN。验证：吊销一张测试证书后，该设备应无法通过认证（单元 16 复测）。要点：<strong>安全性来自\"可撤销、可审计\"，不是来自口令更长<\/strong>。<\/p>\n  <\/section>\n\n  <section id=\"pitfalls\">\n    <h2>易错点与概念辨析<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:260px\">易错说法<\/th><th>辨析<\/th><\/tr>\n      <tr><td>\"WPA2 加密的是整个帧\"<\/td><td>只加密帧体（MSDU）；MAC 头明文（单元 07）。<\/td><\/tr>\n      <tr><td>\"四次握手传输了口令\"<\/td><td>握手只传随机数与 MIC；口令/PMK 永不上线。猜错口令派生不出正确 PTK。<\/td><\/tr>\n      <tr><td>\"SAE 是新的加密算法\"<\/td><td>SAE 是认证+密钥交换机制；数据加密仍是 CCMP/GCMP。<\/td><\/tr>\n      <tr><td>\"WPA3=更长的口令要求而已\"<\/td><td>实质是 SAE 抗离线字典 + 企业 192 位模式；口令要求只是配套。<\/td><\/tr>\n      <tr><td>\"认证=授权\"<\/td><td>认证证明\"你是谁\"；授权决定\"你能去哪\"（VLAN/RBAC，单元 12）。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"summary\">\n    <h2>知识总结<\/h2>\n    <ul>\n      <li>六件事分层：准入（PSK/SAE/802.1X）→ 密钥协商（4WH）→ 数据保护（CCMP/GCMP）→ 管理（RBAC/VLAN）；<\/li>\n      <li>密钥树：口令/凭据→PMK→（+双方随机数）→PTK（KCK/TK）+GTK；<\/li>\n      <li>四次握手=换钥匙仪式：不传口令、每次新鲜、双向确认；<\/li>\n      <li>WEP/TKIP 已死；WPA3 的实质=SAE 抗离线字典+企业 192 位；<\/li>\n      <li>802.11w 保护管理帧，缓解 Deauth 类 DoS。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"quiz\">\n    <h2>单元测验<\/h2>\n    <div data-quiz=\"14\"><\/div>\n  <\/section>\n\n  <section id=\"mapping\">\n    <h2>教材章节映射<\/h2>\n    <table class=\"data\">\n      <tr><th>来源<\/th><th>对应位置<\/th><th>状态<\/th><\/tr>\n      <tr><td>CWNA 4th Ed<\/td><td>第 13 章 §Legacy Security/RSN/PSK/802.1X-EAP/动态密钥/4WH/TKIP-CCMP（书页 461–483）<\/td><td><span class=\"badge verified\">已核实（正文节选已读：p.461-483 关键页 15 页）<\/span><\/td><\/tr>\n      <tr><td>Wi-Fi Alliance<\/td><td>WPA3 项目页（2018-06-25：SAE/192 位）<\/td><td><span class=\"badge verified\">已核实<\/span><\/td><\/tr>\n      <tr><td>IEEE 802.11-2024<\/td><td>SAE/4WH 消息字段<span class=\"badge pending\">条款待核<\/span><\/td><td><span class=\"badge pending\">待核实<\/span><\/td><\/tr>\n      <tr><td>CWNA-110 考试域<\/td><td>WLAN Network Security（D5）<\/td><td><span class=\"badge verified\">已核实<\/span><\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"sources\">\n    <h2>标准与官方来源<\/h2>\n    <ul>\n      <li><strong>S1-1<\/strong> CWNA 4th Ed Ch13（引用页已逐页核对）【一手】<\/li>\n      <li><strong>S3-5<\/strong> Wi-Fi CERTIFIED WPA3（2018-06-25）【已核实】<\/li>\n      <li><strong>S2-1<\/strong> IEEE Std 802.11-2024（SAE/RSNA 条款待核）【编号已核实】<\/li>\n      <li>EAP RFC 编号引用教材 Table 13.2（RFC 5216/5281/4851/3748）。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"reading\">\n    <h2>延伸阅读<\/h2>\n    <ul>\n      <li>教材 p.486–491：访客网络/Captive Portal（呼应单元 12）；<\/li>\n      <li>802.11r（FT）快速切换中的握手变体——漫游+安全的交叉（延伸）；<\/li>\n      <li>下一站：单元 15——门禁通过之后，拿到 IP 才算\"能上网\"。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"audit\">\n    <h2>本单元审核结果（摘要）<\/h2>\n    <p style=\"font-size:14px\">术语 14 条对照术语库<span class=\"badge verified\">已核实<\/span>；密钥层级/PSK/802.1X/WPA 历史论断逐条对照教材正文<span class=\"badge verified\">已核实<\/span>；4WH 消息级字段与 SAE 条款<span class=\"badge pending\">待核<\/span>（动画已标注）。详见 <code>docs/audits/unit-14-audit.md<\/code>。<\/p>\n  <\/section>\n<\/article>\n","unit-15":"<article data-unit=\"15\">\n  <h1>单元 15 · 从 Wi-Fi 连接到 DHCP、ARP、DNS 和互联网访问<\/h1>\n  <p class=\"unit-meta\">阶段四 · 安全与实际网络 ｜ 教材映射：轻（CWNA 以二层为主）——本单元主体为课程自补的 TCP/IP 先修内容（RFC 已核实）｜ 编制日期：2026-10-24<\/p>\n\n  <section id=\"goals\">\n    <h2>学习目标<\/h2>\n    <ol>\n      <li>完整口述 DHCP 四步（DORA）及每个报文的收发方与寻址方式；<\/li>\n      <li>解释 ARP 的作用与\"没有 ARP 连网关都到不了\"；<\/li>\n      <li>说明 DNS 在\"能 ping 通≠能上网\"中的角色；<\/li>\n      <li>用\"排障阶梯\"对\"已连接但上不了网\"做分层定位；<\/li>\n      <li>把 169.254.x.x、网关不可达、DNS 失败三种现象对应到正确环节。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"prereqs\">\n    <h2>前置知识<\/h2>\n    <div class=\"callout info\"><span class=\"co-t\">先修<\/span>单元 12（网关/VLAN）、单元 14（握手完成=二层就绪）。<strong>诚实声明<\/strong>：本地 CWNA 教材以二层为主，本单元的 TCP/IP 内容为课程自补，依据 RFC 2131（DHCP）、RFC 826（ARP）、RFC 1035（DNS）——编号已对照 RFC Editor 官方页核实（2026-10-24）。<\/div>\n  <\/section>\n\n  <section id=\"terms\">\n    <h2>核心术语<\/h2>\n    <div class=\"term-chips\">\n      <dfn data-term=\"NET-DHCP-001\">DHCP<\/dfn>\n      <dfn data-term=\"NET-ARP-001\">ARP<\/dfn>\n      <dfn data-term=\"NET-DNS-001\">DNS<\/dfn>\n      <dfn data-term=\"TOPO-VLAN-001\">VLAN/网关<\/dfn>\n      <dfn data-term=\"NET-ASSOC-001\">关联（二层就绪的前提）<\/dfn>\n    <\/div>\n  <\/section>\n\n  <section id=\"intuition\">\n    <h2>直观解释：入住酒店的四道手续<\/h2>\n    <p>关联+握手=拿到房卡走进房间（二层）。但要在城里活动还得：<strong>登记入住领房号<\/strong>（DHCP 分配 IP）、<strong>知道电梯在哪<\/strong>（ARP 找到网关 MAC）、<strong>有通讯录<\/strong>（DNS 把名字变地址）、<strong>大门开着<\/strong>（网关路由/NAT）。四道手续任何一道卡住，你在房间里（Wi-Fi 已连接）却哪儿也去不了——这就是\"已连接但上不了网\"的全部真相。<\/p>\n  <\/section>\n\n  <section id=\"formal\">\n    <h2>正式定义<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:170px\">概念<\/th><th>定义（分级标注）<\/th><\/tr>\n      <tr><td><dfn data-term=\"NET-DHCP-001\">DHCP（DORA）<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> Discover（客户端广播）→ Offer（服务器提议）→ Request（客户端广播确认）→ Ack（服务器确认租约：IP/掩码/网关/DNS/租期）。RFC 2131【已核实（rfc-editor.org）】。<\/td><\/tr>\n      <tr><td><dfn data-term=\"NET-ARP-001\">ARP<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 把 IPv4 地址解析为链路层 MAC；跨网段时解析的是<strong>网关<\/strong>的 MAC，而非远端主机。RFC 826【已核实（rfc-editor.org）】。<\/td><\/tr>\n      <tr><td><dfn data-term=\"NET-DNS-001\">DNS<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 域名→IP 的解析系统；终端向配置的递归服务器发起查询。RFC 1035【已核实（rfc-editor.org）】。<\/td><\/tr>\n      <tr><td>APIPA/169.254.x.x<\/td><td><span class=\"badge verified\">标准正式定义<\/span> DHCP 失败后客户端自动配置的链路本地地址——<strong>看见它=DHCP 环节失败<\/strong>（排障第一信号）。<\/td><\/tr>\n      <tr><td>默认网关<\/td><td><span class=\"badge verified\">标准正式定义<\/span> 本网段通向其他网络的路由器接口；ARP/路由/NAT 在此接力（单元 12）。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"principles\">\n    <h2>工作原理：联网流水线动画<\/h2>\n    <p>从\"二层就绪\"到\"业务上线\"的完整八步，逐帧走一遍（教材覆盖薄弱，本动画为课程自补内容，已按 RFC 核实）：<\/p>\n    <div data-anim=\"ip-boot\"><\/div>\n\n    <h3>排障阶梯（自下而上）<\/h3>\n    <ol>\n      <li><strong>二层就绪？<\/strong>关联/握手是否完成（抓包或系统状态）；<\/li>\n      <li><strong>DHCP？<\/strong>地址是否合法（169.254 = 失败）；<\/li>\n      <li><strong>网关？<\/strong>ping 网关；<\/li>\n      <li><strong>DNS？<\/strong>nslookup 域名、ping 公网 IP 对照。<\/li>\n    <\/ol>\n    <p>在\"交互实验\"节的排障阶梯中用四个真实症状练习这套顺序。<\/p>\n  <\/section>\n\n  <section id=\"diagrams\">\n    <h2>图解与动画<\/h2>\n    <p>联网流水线动画（ip-boot）见上文；VLAN/网关路径见单元 12 实验。<\/p>\n  <\/section>\n\n  <section id=\"lab\">\n    <h2>交互实验<\/h2>\n    <div data-lab=\"diag-ladder\"><\/div>\n  <\/section>\n\n  <section id=\"case\">\n    <h2>工程案例：只坏一半的 DNS<\/h2>\n    <p>市场部反馈\"内网系统打不开、网页正常\"。按阶梯定位：Wi-Fi 已连接（①过）、地址 10.1.10.x（②过）、ping 网关通（③过）、nslookup 内网域名失败但公网正常（④局部）。结论：内网 DNS 视图的解析条目缺失/域控制器副本异常——与 Wi-Fi 毫无关系，但用户只会说\"Wi-Fi 又坏了\"。教训：<strong>排障阶梯的价值在于把\"Wi-Fi 坏了\"翻译成\"第几层坏了\"<\/strong>；内网 DNS 依赖域控制器，属基础设施问题。<\/p>\n  <\/section>\n\n  <section id=\"pitfalls\">\n    <h2>易错点与概念辨析<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:260px\">易错说法<\/th><th>辨析<\/th><\/tr>\n      <tr><td>\"已连接=有 IP=能上网\"<\/td><td>三个独立状态：二层就绪→三层地址→出口路径。任何一个缺失都是\"连不上\"。<\/td><\/tr>\n      <tr><td>\"DHCP 是 Wi-Fi 的一部分\"<\/td><td>DHCP 是三层应用协议，与 802.11 无关；只是它依赖二层先通（广播帧过桥）。<\/td><\/tr>\n      <tr><td>\"ARP 解析的是远端服务器的 MAC\"<\/td><td>跨网段时解析的是<strong>网关<\/strong>的 MAC；去往远端的帧目的 MAC 是网关、目的 IP 才是服务器。<\/td><\/tr>\n      <tr><td>\"ping 不通=Wi-Fi 问题\"<\/td><td>先分层：二层？地址？网关？DNS？逐层排除再定责。<\/td><\/tr>\n      <tr><td>\"169.254 只是网速慢\"<\/td><td>169.254/16 是 DHCP 失败的自动配置地址——直接指向 ②环节。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"summary\">\n    <h2>知识总结<\/h2>\n    <ul>\n      <li>DORA 四步：广播 Discover→Offer→广播 Request→Ack；<\/li>\n      <li>ARP 找网关 MAC；DNS 把名字变地址；网关负责出口；<\/li>\n      <li>169.254=DHCP 失败的信号灯；<\/li>\n      <li>排障阶梯：二层→DHCP→网关→DNS，自下而上；<\/li>\n      <li>关联≠上网：中间还隔着握手、DHCP、ARP、DNS 四道门。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"quiz\">\n    <h2>单元测验<\/h2>\n    <div data-quiz=\"15\"><\/div>\n  <\/section>\n\n  <section id=\"mapping\">\n    <h2>教材章节映射<\/h2>\n    <table class=\"data\">\n      <tr><th>来源<\/th><th>对应位置<\/th><th>状态<\/th><\/tr>\n      <tr><td>CWNA 4th Ed<\/td><td>二层部分：第 9/10 章（已核）；<strong>TCP/IP 部分教材覆盖轻<\/strong>（CWNA 以二层为纲）<\/td><td><span class=\"badge vendor\">课程自补（如实标注）<\/span><\/td><\/tr>\n      <tr><td>RFC（课程自补依据）<\/td><td>DHCP=RFC 2131；ARP=RFC 826；DNS=RFC 1035<\/td><td><span class=\"badge verified\">已核实（rfc-editor.org 官方页，2026-10-24）<\/span><\/td><\/tr>\n      <tr><td>CWNA-110 考试域<\/td><td>WLAN Network Architecture and Design（D4）——考试假定 TCP/IP 先修<\/td><td><span class=\"badge verified\">已核实<\/span><\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"sources\">\n    <h2>标准与官方来源<\/h2>\n    <ul>\n      <li><strong>RFC Editor<\/strong>：rfc-editor.org/info/rfc2131 / rfc826 / rfc1035【已核实】<\/li>\n      <li><strong>S1-1<\/strong> CWNA 4th Ed（二层前提部分）【一手】<\/li>\n      <li><strong>S4-2<\/strong> CWNA-110 考试目标（TCP/IP 为先修假设）【已核实】<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"reading\">\n    <h2>延伸阅读<\/h2>\n    <ul>\n      <li>RFC 2131 §4.4：DORA 的状态机细节；<\/li>\n      <li>DHCPv6/RA 与 IPv6 的对应机制（本课程暂不展开，延伸）；<\/li>\n      <li>下一站：单元 16——把前 15 个单元的\"体检工具\"全部用起来。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"audit\">\n    <h2>本单元审核结果（摘要）<\/h2>\n    <p style=\"font-size:14px\">术语 5 条对照术语库<span class=\"badge verified\">已核实<\/span>；DHCP/ARP/DNS 定义与 RFC 编号对照 RFC Editor 官方页<span class=\"badge verified\">已核实<\/span>；<strong>本单元 TCP/IP 主体为课程自补，已如实标注（教材覆盖轻）<\/strong><span class=\"badge vendor\">课程自补<\/span>。详见 <code>docs/audits/unit-15-audit.md<\/code>。<\/p>\n  <\/section>\n<\/article>\n","unit-16":"<article data-unit=\"16\">\n  <h1>单元 16 · 抓包分析、故障诊断、干扰分析和安全排查<\/h1>\n  <p class=\"unit-meta\">阶段四 · 安全与实际网络 ｜ 教材映射：CWNA 4th Ed 第 12、14、16 章（正文节选已核对）｜ 编制日期：2026-10-24<\/p>\n\n  <section id=\"goals\">\n    <h2>学习目标<\/h2>\n    <ol>\n      <li>用\"重传率/RSSI/碰撞特征\"三件套给无线问题分类；<\/li>\n      <li>读出抓包中低 SNR、隐藏节点、Deauth 攻击三种模式的指纹；<\/li>\n      <li>说明协议分析仪与频谱仪的分工（二层问题 vs 射频干扰）；<\/li>\n      <li>区分 rogue AP、干扰源与邻居网络，说出各自处置；<\/li>\n      <li>执行一次完整排障：症状→分层定位→工具→修复→复测。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"prereqs\">\n    <h2>前置知识<\/h2>\n    <div class=\"callout info\"><span class=\"co-t\">先修<\/span>单元 08（重传/隐藏节点）、单元 09（重传率）、单元 13（勘测/10% 红线）、单元 15（排障阶梯）。<\/div>\n  <\/section>\n\n  <section id=\"terms\">\n    <h2>核心术语<\/h2>\n    <div class=\"term-chips\">\n      <dfn data-term=\"MAC-RTX-001\">重传率<\/dfn>\n      <dfn data-term=\"DIAG-ROGUE-001\">Rogue AP<\/dfn>\n      <dfn data-term=\"DIAG-WIPS-001\">WIDS/WIPS<\/dfn>\n      <dfn data-term=\"DIAG-SPECTRUM-001\">频谱分析仪<\/dfn>\n      <dfn data-term=\"RF-CCI-001\">同频干扰<\/dfn>\n      <dfn data-term=\"RF-ACI-001\">邻频干扰<\/dfn>\n      <dfn data-term=\"MAC-HN-001\">隐藏节点<\/dfn>\n      <dfn data-term=\"SEC-MFP-001\">管理帧保护<\/dfn>\n    <\/div>\n  <\/section>\n\n  <section id=\"intuition\">\n    <h2>直观解释：无线网络的\"体检套餐\"<\/h2>\n    <p>无线排障不是玄学，是三台\"体检仪\"的交叉读片：<strong>协议分析仪<\/strong>看对话记录（谁重传、谁碰撞、谁被踢出），<strong>频谱仪<\/strong>看空气里的能量（微波炉、蓝牙、无线摄像头），<strong>验证勘测<\/strong>看空间分布（哪里 SNR 低、哪里漫游抖动）。教材 p.565 已给出量化红线：重传率超过约 10%，性能必然受损（已核对正文）。<\/p>\n  <\/section>\n\n  <section id=\"formal\">\n    <h2>正式定义<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:190px\">概念<\/th><th>定义（分级标注）<\/th><\/tr>\n      <tr><td>排障症状族（Ch12 目录已核+正文）<\/td><td><span class=\"badge verified\">标准正式定义<\/span> 二层重传、RF 干扰、多径、邻频、低 SNR、功率错配、近/远、隐藏节点、漫游粘滞/乒乓、同频争用、容量不足（教材 Ch12 全章框架，p.401–450）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"DIAG-ROGUE-001\">Rogue AP<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 未经授权接入有线网的无线 AP——风险在于\"给受保护网络开了无线后门\"（教材 Ch14 §Rogue，p.501–503）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"DIAG-WIPS-001\">WIDS/WIPS<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 传感器=常听模式的被动射频设备（硬件形态似 AP），上报集中服务器做检测/防御（教材 p.518 原文，已核对正文）。<\/td><\/tr>\n      <tr><td><dfn data-term=\"DIAG-SPECTRUM-001\">频谱分析仪<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 测量非编码 RF 能量的工具——测量噪声底的正确手段（单元 03，p.94）；识别非 Wi-Fi 干扰（微波炉/蓝牙/无线摄像头，教材 p.567 列举 5 GHz 干扰源）。<\/td><\/tr>\n      <tr><td>窃听与加密<\/td><td><span class=\"badge verified\">标准正式定义<\/span> \"空口传输对任何人都开放\"（教材 p.505 语境，已核对正文）——无加密即无隐私；受保护网络的 MAC 头仍明文（元数据可见）。<\/td><\/tr>\n      <tr><td>Deauth 类 DoS<\/td><td><span class=\"badge verified\">标准正式定义<\/span> Deauth/Disassoc 是\"无法拒绝的通知\"（p.304）；802.11w 管理帧保护用 MIC 遏制伪造（单元 14）；教材 p.514 提到 Wi-Fi 钓鱼/中间人的防御须依赖加密与验证。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"principles\">\n    <h2>工作原理：三种抓包指纹<\/h2>\n    <p>进入\"交互实验\"节的取证沙盘：三份迷你抓包（低 SNR 重传 / 隐藏节点碰撞 / Deauth 泛洪），先自己读帧列表下诊断，再看解析：<\/p>\n\n    <h3>标准排障流程（综合前 15 单元）<\/h3>\n    <ol>\n      <li><strong>分层定性<\/strong>：先用单元 15 的阶梯判\"第几层\"；<\/li>\n      <li><strong>协议层读片<\/strong>：重传率、碰撞对、漫游时延（Reassociation 间隔）、Beacon 完整性；<\/li>\n      <li><strong>射频层读片<\/strong>：频谱仪找非 Wi-Fi 干扰；信道占用与噪声底（单元 03/13）；<\/li>\n      <li><strong>安全读片<\/strong>： rogue 扫描、Deauth 异常、陌生 SSID 同名仿冒（Evil Twin）；<\/li>\n      <li><strong>修复→复测<\/strong>：改动一项，重测重传率/SNR/吞吐对比基线（单元 13 的量化红线）。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"diagrams\">\n    <h2>图解与动画<\/h2>\n    <p>取证沙盘即本单元主图；时序动画（扫描/漫游/握手）见单元 06/09/14。<\/p>\n  <\/section>\n\n  <section id=\"lab\">\n    <h2>交互实验<\/h2>\n    <div data-lab=\"packet-forensics\"><\/div>\n  <\/section>\n\n  <section id=\"case\">\n    <h2>工程案例：一次\"Wi-Fi 坏了\"的全景会诊<\/h2>\n    <p>某办公室整层投诉断流。会诊记录：<strong>协议分析仪<\/strong>——A 区重传率 22%、多为 FCS 失败；<strong>频谱仪<\/strong>——信道 6 上有周期性宽带突发，节奏与茶水间微波炉一致；<strong>勘测<\/strong>——A 区恰为 2.4 GHz 边缘、SNR 14 dB。结论：微波炉干扰 + 低 SNR 叠加。处置：受害终端引导至 5 GHz（单元 13 频段引导）、茶水间加装屏蔽/更换设备、A 区补 AP。复测：重传率 3%。方法论要点：<strong>两台仪器讲的是两个世界的故事，必须交叉验证<\/strong>（教材 Ch16 的核心分工）。<\/p>\n  <\/section>\n\n  <section id=\"pitfalls\">\n    <h2>易错点与概念辨析<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:260px\">易错说法<\/th><th>辨析<\/th><\/tr>\n      <tr><td>\"分析仪能看见所有帧\"<\/td><td>只能抓到所在信道的帧；多信道漫游问题需多信道捕获（教材 p.426 AirPcap 多信道示例）。<\/td><\/tr>\n      <tr><td>\"WIPS 传感器=更多的 AP\"<\/td><td>传感器是被动常听设备，形态似 AP 但不服务客户端（p.518）。<\/td><\/tr>\n      <tr><td>\"邻居的 AP 是 rogue\"<\/td><td>rogue 的定义是<strong>未经授权接入本方有线网<\/strong>；邻居网络只是\"可见的无关网络\"（p.501）。<\/td><\/tr>\n      <tr><td>\"频谱仪能解码 Wi-Fi 帧\"<\/td><td>频谱仪看的是能量（非编码 RF）；帧内容归协议分析仪（p.94/522 分工）。<\/td><\/tr>\n      <tr><td>\"加密了就不会被 Deauth\"<\/td><td>传统 Deauth 是管理帧、不加密即可伪造；须 802.11w 管理帧保护才被 MIC 挡住。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"summary\">\n    <h2>知识总结<\/h2>\n    <ul>\n      <li>三种指纹：低 SNR=同序列号反复重传；隐藏节点=两 STA 同隙碰撞；攻击=Deauth 风暴；<\/li>\n      <li>分析仪（二层对话）与频谱仪（空气能量）互补，不可互替；<\/li>\n      <li>rogue=未授权接入有线网；WIDS/WIPS=被动传感器+集中检测；<\/li>\n      <li>重传率 ~10% 红线（p.565）；修复必须以复测对照基线收尾；<\/li>\n      <li>安全排查=rogue/仿冒/DoS 三张清单 + 802.11w 缓解。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"quiz\">\n    <h2>单元测验<\/h2>\n    <div data-quiz=\"16\"><\/div>\n  <\/section>\n\n  <section id=\"mapping\">\n    <h2>教材章节映射<\/h2>\n    <table class=\"data\">\n      <tr><th>来源<\/th><th>对应位置<\/th><th>状态<\/th><\/tr>\n      <tr><td>CWNA 4th Ed<\/td><td>第 12 章（症状族，书页 401–450）；第 14 章（攻击/WIDS/WIPS，书页 501–522）；第 16 章（覆盖分析/工具链，书页 562–569）<\/td><td><span class=\"badge verified\">已核实（正文节选已读）<\/span><\/td><\/tr>\n      <tr><td>Sybex 6th Ed<\/td><td>Ch15/Ch16（章题级）<\/td><td><span class=\"badge unverified\">仅目录可核<\/span><\/td><\/tr>\n      <tr><td>CWNA-110 考试域<\/td><td>RF Validation and Remediation（D6）<\/td><td><span class=\"badge verified\">已核实<\/span><\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"sources\">\n    <h2>标准与官方来源<\/h2>\n    <ul>\n      <li><strong>S1-1<\/strong> CWNA 4th Ed Ch12/14/16（引用页已逐页核对）【一手】<\/li>\n      <li><strong>S4-2<\/strong> CWNA-110 考试目标 D6 域【已核实】<\/li>\n      <li>抓包工具（Wireshark 等）能力以厂商文档为准<span class=\"badge vendor\">厂商文档<\/span>。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"reading\">\n    <h2>延伸阅读<\/h2>\n    <ul>\n      <li>教材 p.426：多信道捕获与漫游分析（AirPcap 时代工具示例）；<\/li>\n      <li>802.11bh 随机化 MAC 对设备识别的影响（延伸）；<\/li>\n      <li>下一站：单元 17——从这张网的运维，回到技术演进的全景。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"audit\">\n    <h2>本单元审核结果（摘要）<\/h2>\n    <p style=\"font-size:14px\">术语 8 条对照术语库<span class=\"badge verified\">已核实<\/span>；症状族/rogue/WIDS/频谱仪分工/重传红线论断逐条对照教材正文<span class=\"badge verified\">已核实<\/span>；工具能力为厂商文档<span class=\"badge vendor\">厂商文档<\/span>。详见 <code>docs/audits/unit-16-audit.md<\/code>。<\/p>\n  <\/section>\n<\/article>\n","unit-17":"<article data-unit=\"17\">\n  <h1>单元 17 · Wi-Fi 4/5/6/6E 的技术演进<\/h1>\n  <p class=\"unit-meta\">阶段五 · 现代 Wi-Fi ｜ 教材映射：CWNA 4th Ed 第 5/18/19 章（止于 802.11ac）+ WFA/IEEE 官方资料（本单元主体）｜ 编制日期：2026-10-24<\/p>\n\n  <section id=\"goals\">\n    <h2>学习目标<\/h2>\n    <ol>\n      <li>按代梳理 HT→VHT→HE 的技术递进（带宽/调制/MU/频段）；<\/li>\n      <li>严格区分 WFA 代际名与 IEEE 修正案编号，说出 6E 认证的官方定位；<\/li>\n      <li>概述 6 GHz 的监管格局（1200 MHz 总量；美欧开放；中国大陆划归 IMT）；<\/li>\n      <li>解释 RNR（Reduced Neighbor Report）在 6 GHz 发现中的角色；<\/li>\n      <li>用\"每个世代解决一个瓶颈\"的视角读懂演进逻辑。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"prereqs\">\n    <h2>前置知识<\/h2>\n    <div class=\"callout info\"><span class=\"co-t\">先修<\/span>单元 10/11（速率与带宽）、单元 13（频谱与复用）。<strong>来源声明<\/strong>：本地教材止于 802.11ac；本单元 Wi-Fi 6/6E 部分依据 IEEE 802.11ax-2021（编号已核实）与 WFA 官方页（已核实），机制细节条款<span class=\"badge pending\">待核<\/span>。<\/div>\n  <\/section>\n\n  <section id=\"terms\">\n    <h2>核心术语<\/h2>\n    <div class=\"term-chips\">\n      <dfn data-term=\"EVOL-HT-001\">Wi-Fi 4（HT）<\/dfn>\n      <dfn data-term=\"EVOL-VHT-001\">Wi-Fi 5（VHT）<\/dfn>\n      <dfn data-term=\"EVOL-HE-001\">Wi-Fi 6/6E（HE）<\/dfn>\n      <dfn data-term=\"SP-6GHZ-001\">6 GHz 频段<\/dfn>\n      <dfn data-term=\"NET-RNR-001\">RNR<\/dfn>\n      <dfn data-term=\"STD-WFA-001\">Wi-Fi Alliance<\/dfn>\n    <\/div>\n  <\/section>\n\n  <section id=\"intuition\">\n    <h2>直观解释：每个世代都在解决一个瓶颈<\/h2>\n    <p>Wi-Fi 4 解决\"速率太低\"（MIMO/40 MHz）；Wi-Fi 5 解决\"5 GHz 的带宽红利怎么吃\"（160 MHz/256-QAM/下行 MU-MIMO）——代价是彻底放弃 2.4 GHz；Wi-Fi 6 解决的不是\"更快\"而是\"更多人\"（OFDMA/上行 MU-MIMO/TWT，家庭十几台设备的时代来了）；Wi-Fi 6E 解决\"没频谱可用\"（打开 6 GHz 新大陆）；Wi-Fi 7 解决\"多射射频谱割裂\"（MLO 把它们拧成一股绳）。读懂\"瓶颈—解法\"这条线，代际就不需要死记。<\/p>\n  <\/section>\n\n  <section id=\"formal\">\n    <h2>正式定义与对照表<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:170px\">概念<\/th><th>定义（分级标注）<\/th><\/tr>\n      <tr><td>代际命名<\/td><td><span class=\"badge verified\">WFA 认证要求<\/span> Wi-Fi 4=802.11n、Wi-Fi 5=802.11ac、Wi-Fi 6=802.11ax（WFA 2018-10-03 新闻稿，已核实）；\"Wi-Fi CERTIFIED 6 于 2019-09-16 启动\"（已核实）。<\/td><\/tr>\n      <tr><td>Wi-Fi 6E 认证定位<\/td><td><span class=\"badge verified\">WFA 认证要求<\/span> WFA 原话：Wi-Fi 6E 认证是 Wi-Fi CERTIFIED 6 的一部分（2021-01-07 可用，2020-01-03 命名）——<strong>不是独立认证项目<\/strong>【已核实】。<\/td><\/tr>\n      <tr><td><dfn data-term=\"SP-6GHZ-001\">6 GHz 频段<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> 5925–7125 MHz 共 1200 MHz；802.11ax 起支持。监管分岔：美国等开放整段给 Wi-Fi（以当地监管文件与 WFA 6 GHz 监管页为准）；<strong>中国大陆经工信部 2023 版《无线电频率划分规定》率先将 6425–7125 MHz 划分给 IMT（5G/6G）<\/strong>【已核实（工信部文件公开报道，2023-06）】——即中国大陆公众 Wi-Fi 无法使用 6 GHz 上半段<span class=\"badge vendor\">以最新监管为准<\/span>。<\/td><\/tr>\n      <tr><td><dfn data-term=\"NET-RNR-001\">RNR<\/dfn><\/td><td><span class=\"badge verified\">标准正式定义<\/span> Reduced Neighbor Report：在 2.4/5 GHz 的 Beacon 中预告相邻 6 GHz BSS 的信息，让客户端\"顺路\"发现 6 GHz 网络，减少全信道扫描（CWNA-110 考试目标提及；条款<span class=\"badge pending\">待核<\/span>）。<\/td><\/tr>\n    <\/table>\n    <p>交互式逐列对比见\"交互实验\"节（gen-compare）。<\/p>\n  <\/section>\n\n  <section id=\"principles\">\n    <h2>工作原理：演进的四条主线<\/h2>\n    <ol>\n      <li><strong>频谱线<\/strong>：2.4→5→6 GHz；6 GHz 带来干净频谱与宽信道，但监管决定你能不能用（中国大陆的现实见上表）；<\/li>\n      <li><strong>介质效率线<\/strong>：从\"排队\"（Wi-Fi 4/5）到\"调度\"（Wi-Fi 6 的 OFDMA/触发帧，单元 18）；<\/li>\n      <li><strong>多天线线<\/strong>：SU→DL MU（ac）→UL+DL MU（ax）；<\/li>\n      <li><strong>功耗线<\/strong>：传统 PS→WMM-PS→TWT（ax）。<\/li>\n    <\/ol>\n    <div class=\"callout warn\"><span class=\"co-t\">诚实边界<\/span>本单元的 IEEE 机制细节（RNR 字段、TWT 参数族等）尚未做条款级核对；认证名/日期/频段监管已核实。教材（4 版）不含 Wi-Fi 6/6E 内容，历史部分（HT/VHT）以教材 Ch18/19 为据。<\/div>\n  <\/section>\n\n  <section id=\"diagrams\">\n    <h2>图解<\/h2>\n    <p>代际矩阵（gen-compare）即本单元主图；演进逻辑线见\"四条主线\"。<\/p>\n  <\/section>\n\n  <section id=\"lab\">\n    <h2>交互实验<\/h2>\n    <div data-lab=\"gen-compare\"><\/div>\n  <\/section>\n\n  <section id=\"case\">\n    <h2>工程案例：中国市场采购\"Wi-Fi 7\"AP 的频段现实<\/h2>\n    <p>招标书写\"需支持 Wi-Fi 7 的 320 MHz 信道与 MLO\"。落地评估：Wi-Fi 7 的 320 MHz 与 6 GHz 强绑定——而中国大陆已将 6 GHz 上半段划分给 IMT（2023 规定），故 320 MHz 在境内公众部署基本无频谱可落；MLO 在 2.4+5 GHz 组合上的价值仍在（聚合/可靠性），但速率上限大打折扣。结论：按\"5 GHz 160 MHz + MLO（2.4/5 组合）+ OFDMA\"评估实际收益，把\"320 MHz\"写成\"预留在监管开放地区使用\"。这 正是单元 01\"四层体系\"中监管层的现实权重。<\/p>\n  <\/section>\n\n  <section id=\"pitfalls\">\n    <h2>易错点与概念辨析<\/h2>\n    <table class=\"data\">\n      <tr><th style=\"width:260px\">易错说法<\/th><th>辨析<\/th><\/tr>\n      <tr><td>\"Wi-Fi 6E 是比 Wi-Fi 6 更快的一代\"<\/td><td>6E=同样的 802.11ax + 6 GHz 频段扩展；速率机制相同，新大陆是新频谱（WFA 定位已核实）。<\/td><\/tr>\n      <tr><td>\"6 GHz 全球都能用\"<\/td><td>监管分岔极大：美欧多地开放，中国大陆将上半段划给 IMT（已核实）。采购前先查当地规定。<\/td><\/tr>\n      <tr><td>\"Wi-Fi 5 也支持 2.4 GHz\"<\/td><td>VHT 仅 5 GHz（教材 p.663，已核对正文）；2.4 GHz 上最高仍是 HT/HE。<\/td><\/tr>\n      <tr><td>\"6E 的 1200 MHz 都能给一个 320 MHz 信道连用四次\"<\/td><td>6 GHz 总量 1200 MHz、320 MHz 信道数受频段内连续频谱约束，且监管切割后更少——数字要看当地规则。<\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"summary\">\n    <h2>知识总结<\/h2>\n    <ul>\n      <li>代际名（WFA）与修正案（IEEE）双轨记；6E 是 6+6 GHz 扩展、非独立认证；<\/li>\n      <li>演进四主线：频谱/介质效率/多天线/功耗；<\/li>\n      <li>6 GHz=1200 MHz 新频谱，监管是分水岭：美欧多地开放、中国大陆上半段归 IMT（已核实）；<\/li>\n      <li>RNR 让 6 GHz 网络被发现更高效（条款待核）。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"quiz\">\n    <h2>单元测验<\/h2>\n    <div data-quiz=\"17\"><\/div>\n  <\/section>\n\n  <section id=\"mapping\">\n    <h2>教材章节映射<\/h2>\n    <table class=\"data\">\n      <tr><th>来源<\/th><th>对应位置<\/th><th>状态<\/th><\/tr>\n      <tr><td>CWNA 4th Ed<\/td><td>第 18 章（HT）/第 19 章（VHT）——止于 802.11ac；<strong>Wi-Fi 6/6E 零覆盖<\/strong><\/td><td><span class=\"badge verified\">已核实（正文节选已读）<\/span><\/td><\/tr>\n      <tr><td>IEEE / WFA / 监管<\/td><td>802.11ax-2021 编号；WFA 命名与 CERTIFIED 6/6E 日期；中国大陆 6 GHz 划归 IMT（工信部 2023 规定）<\/td><td><span class=\"badge verified\">已核实<\/span><\/td><\/tr>\n      <tr><td>Sybex 6th Ed<\/td><td>Ch2/Ch19（章题级；正文未核）<\/td><td><span class=\"badge unverified\">仅目录可核<\/span><\/td><\/tr>\n    <\/table>\n  <\/section>\n\n  <section id=\"sources\">\n    <h2>标准与官方来源<\/h2>\n    <ul>\n      <li><strong>S2-2<\/strong> IEEE Std 802.11ax-2021【编号已核实】<\/li>\n      <li><strong>S3-1/S3-2/S3-3/S3-8<\/strong> WFA 命名/6/6E/6 GHz 监管页【已核实】<\/li>\n      <li><strong>S6-1（新增）<\/strong> 工信部 2023 版《无线电频率划分规定》：6425–7125 MHz 划分给 IMT（公开报道转载，见 docs/source-map.md）【已核实】<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"reading\">\n    <h2>延伸阅读<\/h2>\n    <ul>\n      <li>WFA\"Regulations Enabling 6 GHz Wi-Fi\"互动地图（各地区开放状态一手来源）；<\/li>\n      <li>下一站：单元 18——拆开 Wi-Fi 6 的四件武器。<\/li>\n    <\/ul>\n  <\/section>\n\n  <section id=\"audit\">\n    <h2>本单元审核结果（摘要）<\/h2>\n    <p style=\"font-size:14px\">术语 6 条对照术语库<span class=\"badge verified\">已核实<\/span>；认证名/日期/6 GHz 监管（含中国大陆）逐条对照官方来源<span class=\"badge verified\">已核实<\/span>；RNR 等机制条款<span class=\"badge pending\">待核<\/span>。详见 <code>docs/audits/unit-17-audit.md<\/code>。<\/p>\n  <\/section>\n<\/article>\n","unit-18":"<article data-unit=\"18\">\n  <h1>单元 18 · Wi-Fi 6 的 OFDMA、MU-MIMO、BSS Coloring 和 TWT<\/h1>\n  <p class=\"unit-meta\">阶段五 · 现代 Wi-Fi ｜ 来源：IEEE 802.11ax-2021（编号已核实）+ WFA Wi-Fi 6/6E 官方页（已核实）；本地教材零覆盖｜ 编制日期：2026-10-24<\/p>\n\n  <section id=\"goals\">\n    <h2>学习目标<\/h2>\n    <ol>\n      <li>解释 OFDMA 与 OFDM/MU-MIMO 的维度差异（频率切分 vs 空间切分），并说出触发帧的角色；<\/li>\n      <li>说明 RU 的概念与\"多 RU 给同一 STA\"（Wi-Fi 7 增强）；<\/li>\n      <li>解释 BSS Coloring（空间复用）解决什么问题、判定依据是什么；<\/li>\n      <li>说明 TWT 与传统 PS/DTIM 省电的差别（预约式唤醒）；<\/li>\n      <li>指出 Wi-Fi 6 在\"高密度多设备\"场景收益最大的原因。<\/li>\n    <\/ol>\n  <\/section>\n\n  <section id=\"prereqs\">\n    <h2>前置知识<\/h2>\n    <div class=\"callout info\"><span class=\"co-t\">先修<\/span>单元 08（介质访问）、单元 09（省电/聚合）、单元 11（MU-MIMO）。<strong>来源声明<\/strong>：本地教材零覆盖；本单元以 802.11ax-2021（编号已核实）与 WFA 官方页为据，机制细节条款<span class=\"badge pending\">待核<\/span>。<\/div>\n  <\/section>\n\n  <section id=\"terms\">\n    <h2>核心术语<\/h2>\n    <div class=\"term-chips\">\n      <dfn data-term=\"PERF-OFDMA-001\">OFDMA<\/dfn>\n      <dfn data-term=\"SP-RU-001\">资源单元 RU<\/dfn>\n      <dfn data-term=\"SS-MU-001\">UL/DL MU-MIMO<\/dfn>\n      <dfn data-term=\"MAC-BC-001\">BSS Coloring<\/dfn>\n      <dfn data-term=\"MAC-TWT-001\">TWT<\/dfn>\n      <dfn data-term=\"SP-QAM-001\">1024-QAM<\/dfn>\n      <dfn data-term=\"EVOL-HE-001\">Wi-Fi 6（HE）<\/dfn>\n    <\/div>\n  <\/section>\n\n  <section id=\"intuition\">\n    <h2>直观解释：从\"轮流包场\"到\"拼桌\"<\/h2>\n    <p>传统 Wi-Fi 里，哪怕你只发一条消息，也要<strong>包场<\/strong>整条信道；邻居家网络再热闹，你也只能等。Wi-Fi 6 的四件武器：<strong>OFDMA<\/strong> 把信道切成小块\"拼桌\"（多个用户同一时刻并行）；<strong>MU-MIMO<\/strong> 从空间维度再切一刀（不同方向的波束同时
