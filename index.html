<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wi-Fi Academy — 交互式无线网络课程（单文件版）</title>
<style>
/* Wi-Fi Academy · 主题变量 */
:root {
  color-scheme: light;
  --bg: #f6f8fa;
  --bg-elev: #ffffff;
  --bg-soft: #eef1f5;
  --text: #1d2530;
  --text-soft: #57626e;
  --text-faint: #8b95a1;
  --accent: #0b62c4;
  --accent-strong: #084a94;
  --accent-soft: #e4eefb;
  --ok: #1a7a3c;
  --ok-soft: #e0f2e6;
  --warn: #8a5a00;
  --warn-soft: #fbf0d2;
  --bad: #a3271e;
  --bad-soft: #fbe5e2;
  --border: #d8dde4;
  --code-bg: #eff2f6;
  --shadow: 0 1px 3px rgba(16, 24, 40, 0.09);
  --topbar-h: 52px;
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12161c;
  --bg-elev: #1a2028;
  --bg-soft: #212932;
  --text: #e7ebf0;
  --text-soft: #a9b3be;
  --text-faint: #7a8490;
  --accent: #5ea3ef;
  --accent-strong: #8ec2f8;
  --accent-soft: #1d2e44;
  --ok: #5cba7d;
  --ok-soft: #17301f;
  --warn: #d9a63e;
  --warn-soft: #332a10;
  --bad: #e57361;
  --bad-soft: #3c1e18;
  --border: #2c3540;
  --code-bg: #242c36;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
}

/* Wi-Fi Academy · 布局与组件 */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.75 "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; cursor: pointer; }

/* ---------- 顶栏 ---------- */
#topbar {
  position: fixed; inset: 0 0 auto 0; height: var(--topbar-h); z-index: 60;
  display: flex; align-items: center; gap: 12px; padding: 0 14px;
  background: var(--bg-elev); border-bottom: 1px solid var(--border); box-shadow: var(--shadow);
}
#menu-btn { display: none; border: 1px solid var(--border); background: var(--bg-soft);
  border-radius: 6px; padding: 4px 10px; color: var(--text); }
.brand { font-weight: 700; font-size: 17px; color: var(--text); white-space: nowrap; }
.brand span { color: var(--accent); }
.crumb { color: var(--text-soft); font-size: 13.5px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; flex: 0 1 auto; }
.search-wrap { position: relative; margin-left: auto; flex: 0 1 340px; }
#search-input {
  width: 100%; padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg-soft); color: var(--text); font-size: 14px;
}
#search-input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.search-results {
  position: absolute; top: 40px; left: 0; right: 0; max-height: 380px; overflow: auto;
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--shadow); padding: 6px; z-index: 80;
}
.search-results .sr-item { display: block; padding: 7px 10px; border-radius: 7px;
  color: var(--text); font-size: 14px; }
.search-results .sr-item:hover { background: var(--bg-soft); text-decoration: none; }
.search-results .sr-kind { color: var(--text-faint); font-size: 12px; margin-right: 6px; }
.search-results .sr-empty { padding: 10px; color: var(--text-faint); font-size: 13.5px; }
.top-actions { display: flex; align-items: center; gap: 10px; }
#progress-chip {
  font-size: 12.5px; color: var(--accent-strong); background: var(--accent-soft);
  padding: 3px 10px; border-radius: 999px; white-space: nowrap;
}
#theme-btn, #settings-btn { border: 1px solid var(--border); background: var(--bg-soft);
  border-radius: 6px; padding: 4px 10px; color: var(--text); font-size: 13px; }

/* ---------- 三栏布局 ---------- */
#layout {
  display: grid; grid-template-columns: 264px minmax(0, 1fr) 252px;
  gap: 20px; padding: 20px; margin-top: var(--topbar-h); max-width: 1440px; margin-inline: auto;
}
#sidebar {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 10px; height: fit-content; position: sticky; top: calc(var(--topbar-h) + 16px);
  max-height: calc(100vh - var(--topbar-h) - 32px); overflow: auto;
}
.nav-phase { margin: 10px 4px 4px; font-size: 12px; font-weight: 700; color: var(--text-faint);
  letter-spacing: .04em; }
.nav-unit { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px;
  color: var(--text); font-size: 14px; line-height: 1.35; }
.nav-unit:hover { background: var(--bg-soft); text-decoration: none; }
.nav-unit.current { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.nav-unit .no { color: var(--text-faint); font-size: 12px; min-width: 20px; }
.nav-unit.current .no { color: var(--accent-strong); }
.nav-unit .st { margin-left: auto; font-size: 12px; color: var(--ok); }
.sidebar-foot { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 8px; }
.sidebar-foot a, .sidebar-foot button { text-align: left; color: var(--text-soft); font-size: 13.5px;
  background: none; border: none; padding: 0; }
.sidebar-foot a:hover, .sidebar-foot button:hover { color: var(--accent); text-decoration: underline; }

/* ---------- 主内容 ---------- */
#main { min-width: 0; }
#content {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px;
  padding: 28px clamp(18px, 4vw, 42px) 40px;
}
#content h1 { font-size: 26px; line-height: 1.35; margin: 4px 0 6px; }
#content h2 { font-size: 21px; margin: 34px 0 10px; padding-top: 10px; }
#content h3 { font-size: 17.5px; margin: 24px 0 8px; }
#content p, #content li { color: var(--text); }
#content .unit-meta { color: var(--text-faint); font-size: 13.5px; margin: 0 0 18px; }
#content ul, #content ol { padding-left: 1.4em; }
#content li { margin: 4px 0; }
section[id] { scroll-margin-top: calc(var(--topbar-h) + 14px); }
hr { border: none; border-top: 1px solid var(--border); margin: 26px 0; }
code { background: var(--code-bg); border-radius: 5px; padding: 1px 6px; font-size: .88em;
  font-family: Consolas, "Cascadia Mono", monospace; }
.formula {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 16px; margin: 12px 0; overflow-x: auto;
}
.formula .f-main { font-family: Consolas, monospace; font-size: 15px; }
.formula .f-defs { font-size: 13.5px; color: var(--text-soft); margin-top: 8px; }

/* 提示框 */
.callout { border-radius: 10px; padding: 12px 16px; margin: 14px 0; font-size: 14.5px;
  border: 1px solid transparent; }
.callout .co-t { font-weight: 700; display: block; margin-bottom: 2px; font-size: 13.5px; }
.callout.info { background: var(--accent-soft); color: var(--accent-strong); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.callout.warn { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.callout.ok { background: var(--ok-soft); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
.callout.plain { background: var(--bg-soft); color: var(--text-soft); border-color: var(--border); }
.callout p, .callout li { color: inherit; }
.callout :last-child { margin-bottom: 0; }

/* 徽章 */
.badge { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 999px;
  vertical-align: 1px; white-space: nowrap; }
.badge.verified { background: var(--ok-soft); color: var(--ok); }
.badge.pending { background: var(--warn-soft); color: var(--warn); }
.badge.unverified { background: var(--bg-soft); color: var(--text-faint); }
.badge.simplified { background: var(--accent-soft); color: var(--accent-strong); }
.badge.vendor { background: var(--bg-soft); color: var(--text-soft); }

/* 术语 */
dfn[data-term] { font-style: normal; color: var(--accent); border-bottom: 1px dashed var(--accent);
  cursor: help; }
dfn[data-term]:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
.term-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.term-chips dfn[data-term] {
  background: var(--accent-soft); color: var(--accent-strong); border: none;
  padding: 4px 12px; border-radius: 999px; font-size: 13.5px; cursor: help;
}

/* 表格 */
table.data { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; }
table.data th, table.data td { border: 1px solid var(--border); padding: 7px 10px; text-align: left;
  vertical-align: top; }
table.data th { background: var(--bg-soft); font-weight: 600; }
table.data tr:nth-child(even) td { background: color-mix(in srgb, var(--bg-soft) 45%, transparent); }

/* 折叠 */
details { border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px; margin: 12px 0;
  background: var(--bg-elev); }
details summary { cursor: pointer; font-weight: 600; font-size: 14.5px; color: var(--accent-strong); }
details[open] summary { margin-bottom: 8px; }

/* ---------- 动画 ---------- */
.anim-box { border: 1px solid var(--border); border-radius: 12px; margin: 16px 0; overflow: hidden;
  background: var(--bg-elev); }
.anim-head { padding: 10px 16px 6px; border-bottom: 1px solid var(--border); background: var(--bg-soft); }
.anim-head .a-title { font-weight: 700; font-size: 15px; }
.anim-head .a-sub { color: var(--text-faint); font-size: 12.5px; }
.anim-stage-wrap { overflow: auto; max-height: 430px; padding: 8px 10px 2px; }
.anim-stage svg { display: block; width: 100%; height: auto; min-width: 620px; }
.anim-controls { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  border-top: 1px solid var(--border); flex-wrap: wrap; }
.anim-controls button { border: 1px solid var(--border); background: var(--bg-soft); color: var(--text);
  border-radius: 7px; padding: 4px 12px; font-size: 13.5px; }
.anim-controls button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.anim-controls .speed { margin-left: auto; display: flex; gap: 4px; }
.anim-controls .speed button.on { background: var(--accent-soft); color: var(--accent-strong);
  border-color: var(--accent); }
.anim-narr { padding: 10px 16px 14px; font-size: 14px; color: var(--text-soft); border-top: 1px dashed var(--border); }
.anim-narr .n-step { color: var(--accent-strong); font-weight: 700; margin-right: 8px; }
.anim-state { padding: 4px 16px 10px; font-size: 13.5px; }
.anim-state .chip { display: inline-block; background: var(--ok-soft); color: var(--ok);
  padding: 2px 12px; border-radius: 999px; font-weight: 600; }
/* SVG 时序图内部样式 */
.sg-actor { fill: var(--bg-soft); stroke: var(--border); rx: 8; }
.sg-actor-name { fill: var(--text); font-size: 13px; font-weight: 600; }
.sg-lane { stroke: var(--border); stroke-dasharray: 3 4; }
.sg-msg { stroke: var(--accent); stroke-width: 1.8; fill: none; }
.sg-msg.bcast { stroke-dasharray: 5 4; }
.sg-msg-label { fill: var(--accent-strong); font-size: 12.5px; }
.sg-arrow { fill: var(--accent); }
.sg-step-note text { fill: var(--text-soft); font-size: 12.5px; }
.sg-step-note rect { fill: var(--bg-soft); stroke: var(--border); rx: 6; }
.sg-step-state rect { fill: var(--ok-soft); stroke: var(--ok); rx: 12; }
.sg-step-state text { fill: var(--ok); font-size: 12.5px; font-weight: 600; }
.sg-step-phase rect { fill: var(--accent-soft); stroke: var(--accent); rx: 6; }
.sg-step-phase text { fill: var(--accent-strong); font-size: 12.5px; font-weight: 700; }
.sg-active { filter: drop-shadow(0 0 3px color-mix(in srgb, var(--accent) 55%, transparent)); }

/* ---------- 实验面板 ---------- */
.lab-box { border: 1px solid var(--border); border-radius: 12px; margin: 16px 0; padding: 16px 18px; }
.lab-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.lab-head .l-title { font-weight: 700; font-size: 15.5px; }
.lab-controls { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
.lab-controls label { display: grid; grid-template-columns: 170px 1fr 84px; gap: 10px; align-items: center;
  font-size: 14px; color: var(--text-soft); }
.lab-controls input[type="range"] { width: 100%; accent-color: var(--accent); }
.lab-controls .val { font-family: Consolas, monospace; font-size: 13.5px; color: var(--text); text-align: right; }
.lab-status { font-size: 14.5px; margin: 8px 0; }
.lab-status .chip { display: inline-block; padding: 3px 14px; border-radius: 999px; font-weight: 700;
  background: var(--ok-soft); color: var(--ok); }
.lab-status .chip.roam { background: var(--warn-soft); color: var(--warn); }
.lab-status .chip.weak { background: var(--bad-soft); color: var(--bad); }
.lab-metrics { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
.lab-metrics .m { border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; min-width: 118px; }
.lab-metrics .m .k { font-size: 12px; color: var(--text-faint); }
.lab-metrics .m .v { font-family: Consolas, monospace; font-size: 16px; font-weight: 700; }

/* ---------- 测验 ---------- */
.quiz-q { border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; margin: 14px 0; }
.quiz-q .q-head { font-weight: 700; margin-bottom: 6px; }
.quiz-q .q-meta { color: var(--text-faint); font-size: 12px; margin-bottom: 8px; }
.quiz-q .q-opt { display: flex; gap: 10px; align-items: flex-start; padding: 7px 10px; border-radius: 8px;
  margin: 4px 0; cursor: pointer; border: 1px solid transparent; }
.quiz-q .q-opt:hover { background: var(--bg-soft); }
.quiz-q .q-opt input { margin-top: 5px; accent-color: var(--accent); }
.quiz-q.graded .q-opt.correct { background: var(--ok-soft); border-color: var(--ok); }
.quiz-q.graded .q-opt.wrong-pick { background: var(--bad-soft); border-color: var(--bad); }
.quiz-q .q-expl { display: none; margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 10px;
  font-size: 14px; color: var(--text-soft); }
.quiz-q.graded .q-expl { display: block; }
.quiz-actions { display: flex; gap: 10px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
.quiz-actions .btn { border: 1px solid var(--accent); background: var(--accent); color: #fff;
  border-radius: 8px; padding: 7px 18px; font-size: 14px; }
.quiz-actions .btn.secondary { background: var(--bg-soft); color: var(--text); border-color: var(--border); }
.quiz-score { font-weight: 700; font-size: 15px; }

/* ---------- 分页与辅助 ---------- */
#unit-pager { display: flex; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
#unit-pager .pg { flex: 1 1 200px; border: 1px solid var(--border); background: var(--bg-elev);
  border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 14px; }
#unit-pager .pg small { display: block; color: var(--text-faint); font-size: 12px; }
#unit-pager .pg.next { text-align: right; }
#unit-pager .pg:hover { border-color: var(--accent); text-decoration: none; }
#unit-pager .mid { display: flex; flex-direction: column; gap: 8px; align-items: center; }
#unit-pager .mid button { border: 1px solid var(--border); background: var(--bg-soft); color: var(--text);
  border-radius: 8px; padding: 6px 14px; font-size: 13.5px; }
#unit-pager .mid button.done-on { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }

#aux { position: sticky; top: calc(var(--topbar-h) + 16px); height: fit-content; display: flex;
  flex-direction: column; gap: 14px; }
.aux-card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.aux-card h4 { margin: 0 0 8px; font-size: 13px; color: var(--text-faint); letter-spacing: .03em; }
.aux-card ul { margin: 0; padding-left: 1.2em; font-size: 13.5px; }
.aux-card li { margin: 3px 0; }
.aux-card .privacy { font-size: 12.5px; color: var(--text-faint); }

/* ---------- 模态与浮卡 ---------- */
.modal-mask { position: fixed; inset: 0; background: rgba(10, 14, 20, .45); z-index: 100;
  display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 14px;
  max-width: 520px; width: 100%; max-height: 84vh; overflow: auto; padding: 22px 24px; box-shadow: var(--shadow); }
.modal h3 { margin-top: 0; }
.modal .m-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
.modal .m-actions button { border-radius: 8px; padding: 7px 16px; border: 1px solid var(--border);
  background: var(--bg-soft); color: var(--text); }
.modal .m-actions button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.modal .m-actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.modal .danger-zone { border: 1px solid var(--bad); border-radius: 10px; padding: 12px 14px; margin-top: 14px; }
.modal .danger-zone p { color: var(--bad); font-size: 13.5px; }

#tooltip-root .tip-card { position: absolute; z-index: 120; width: min(420px, 88vw);
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 6px 22px rgba(10, 14, 20, .18); padding: 14px 16px; font-size: 13.5px; }
#tooltip-root .tip-card h5 { margin: 0 0 4px; font-size: 15px; }
#tooltip-root .tip-card .t-en { color: var(--text-faint); font-size: 12.5px; margin-bottom: 6px; }
#tooltip-root .tip-card .t-sec { margin-top: 8px; }
#tooltip-root .tip-card .t-k { font-size: 11.5px; color: var(--text-faint); display: block; }
#tooltip-root .tip-card .t-src { margin-top: 10px; font-size: 12px; color: var(--text-faint); }

/* 术语表页 */
.gloss-group h3 { border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.term-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin: 10px 0; }
.term-card.hl { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.term-card .tc-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.term-card .tc-id { font-size: 11.5px; color: var(--text-faint); font-family: Consolas, monospace; }
.term-card .tc-en { color: var(--text-soft); font-size: 13px; }
.term-card p { margin: 6px 0; font-size: 14px; }

/* 占位页 */
.placeholder-box { text-align: center; padding: 60px 20px; color: var(--text-faint); }
.placeholder-box .big { font-size: 40px; }

/* ---------- 响应式 ---------- */
@media (max-width: 1220px) { #layout { grid-template-columns: 250px minmax(0, 1fr); } #aux { display: none; } }
@media (max-width: 880px) {
  #layout { grid-template-columns: minmax(0, 1fr); padding: 14px; }
  #menu-btn { display: inline-block; }
  #sidebar { position: fixed; z-index: 70; left: 0; top: var(--topbar-h); bottom: 0; width: 290px;
    border-radius: 0 12px 12px 0; display: none; max-height: none; }
  #sidebar.open { display: block; }
  .crumb { display: none; }
  .lab-controls label { grid-template-columns: 120px 1fr 70px; }
  table.data { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  /* 实验内联 SVG 在小屏按容器等比缩放（viewBox 自适应），避免 min-width 撑破页面 */
  .lab-box svg { min-width: 0 !important; }
}
@media (max-width: 520px) {
  #topbar { gap: 7px; padding: 0 9px; }
  .brand { font-size: 14.5px; }
  .search-wrap { flex-basis: 96px; min-width: 0; }
  #search-input { padding: 6px 8px; font-size: 13px; }
  #progress-chip { font-size: 11px; padding: 2px 6px; white-space: normal; text-align: center; line-height: 1.2; }
  #theme-btn { padding: 4px 7px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

</style>
</head>
<body>
<header id="topbar">
  <button id="menu-btn" aria-label="打开目录">☰</button>
  <a class="brand" href="#/unit/00">Wi-Fi <span>Academy</span></a>
  <span id="crumb" class="crumb"></span>
  <div class="search-wrap">
    <input id="search-input" type="search" placeholder="搜索单元、术语…" aria-label="搜索" autocomplete="off">
    <div id="search-results" class="search-results" hidden></div>
  </div>
  <div class="top-actions">
    <span id="progress-chip" title="整体学习进度">进度 0/20 单元</span>
    <button id="theme-btn" aria-label="切换深浅主题" title="切换深浅主题">🌙</button>
  </div>
</header>
<div id="layout">
  <nav id="sidebar" aria-label="课程目录">
    <div id="nav-tree"></div>
    <div class="sidebar-foot">
      <a href="#/glossary">📖 术语表</a>
      <button id="settings-btn">⚙ 学习设置</button>
    </div>
  </nav>
